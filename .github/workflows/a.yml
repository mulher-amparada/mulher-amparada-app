name: Analisar todas as linguagens

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  analisar:
    name: Percorrer todo o repositório
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Analisar arquivos e linguagens
        shell: bash
        run: |
          set -e

          mkdir -p relatorios

          echo "Procurando arquivos em todo o repositório..."

          # Lista arquivos normais e ocultos, sem excluir pastas.
          find . -type f -print0 > /tmp/arquivos-repositorio.bin

          # Gera uma lista de caminhos para o cloc.
          python3 - <<'PY'
          import os

          with open("/tmp/arquivos-repositorio.bin", "rb") as source:
              paths = source.read().split(b"\0")

          with open("/tmp/arquivos-repositorio.txt", "w", encoding="utf-8") as output:
              for path in paths:
                  if not path:
                      continue
                  name = os.fsdecode(path)
                  if os.path.isfile(name):
                      output.write(name + "\n")
          PY

          # Analisa os arquivos encontrados, incluindo os ocultos.
          cloc \
            --list-file=/tmp/arquivos-repositorio.txt \
            --follow-links \
            --json \
            --out=relatorios/linguagens.json

          cloc \
            --list-file=/tmp/arquivos-repositorio.txt \
            --follow-links \
            --md \
            --out=relatorios/linguagens.md

      - name: Exibir relatório
        run: |
          cat relatorios/linguagens.md

      - name: Salvar relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f relatorios/linguagens.json relatorios/linguagens.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: atualizar relatório de linguagens"
            git push
          else
            echo "Nenhuma alteração nos relatórios."
          fi