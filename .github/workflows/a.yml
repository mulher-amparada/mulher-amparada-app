name: Testar Hashnode

on:
  workflow_dispatch:

jobs:

  buscar-artigo:

    name: Buscar artigo do Hashnode

    runs-on: ubuntu-latest

    steps:

      - name: Buscar artigo
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error

          query = """
          query {
            publication(host: "mulher-amparada.hashnode.dev") {
              post(slug: "projeto-mulher-amparada") {
                id
                title
                slug
                url
              }
            }
          }
          """

          dados = json.dumps({
              "query": query
          }).encode("utf-8")

          requisicao = urllib.request.Request(
              "https://gql.hashnode.com",
              data=dados,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": os.environ["HASHNODE_TOKEN"]
              }
          )

          try:

              with urllib.request.urlopen(requisicao) as resposta:
                  resultado = json.load(resposta)

              print(
                  json.dumps(
                      resultado,
                      indent=2,
                      ensure_ascii=False
                  )
              )

          except urllib.error.HTTPError as erro:

              corpo = erro.read().decode("utf-8")

              print(f"HTTP: {erro.code}")
              print(corpo)

              raise

          PY