name: Simular Safe Woman OS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  simulate:
    name: Android virtual + system.img modificada
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          CMDLINE_TOOLS="$(find "$SDK/cmdline-tools" \
            -mindepth 3 \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$CMDLINE_TOOLS")" >> "$GITHUB_PATH"

          "$CMDLINE_TOOLS" --version

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;aosp_atd;x86_64"

      - name: Encontrar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "Safe Woman Operational System" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Projeto: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Encontrar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          echo "APK: $PWD/$APK"
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"

      - name: Criar AVD
        shell: bash
        run: |
          set -e

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd \
            --force \
            --name SafeWomanOS \
            --package "system-images;android-35;aosp_atd;x86_64" \
            --device "pixel_2"

          if ! emulator -list-avds | grep -qx "SafeWomanOS"; then
            echo "::error::AVD SafeWomanOS não foi criado."
            exit 1
          fi

      - name: Inspecionar imagens disponíveis
        id: images
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SYSTEM_IMAGE_DIR="$SDK/system-images/android-35/aosp_atd/x86_64"

          mkdir -p simulation/image

          echo "===== DIRETÓRIO DA IMAGEM ====="
          echo "$SYSTEM_IMAGE_DIR"

          echo
          echo "===== TODOS OS ARQUIVOS ====="

          find "$SYSTEM_IMAGE_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p | %s bytes\n' \
            | tee simulation/image/files.txt

          echo
          echo "===== IMAGENS ====="

          find "$SYSTEM_IMAGE_DIR" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.raw' \
              -o -name '*.simg' \
            \) \
            -print \
            | tee simulation/image/images.txt

          echo
          echo "===== TIPOS ====="

          while IFS= read -r IMAGE; do
            echo
            echo "### $IMAGE"
            file "$IMAGE"
            ls -lh "$IMAGE"
          done < simulation/image/images.txt

          SYSTEM_IMG="$SYSTEM_IMAGE_DIR/system.img"

          if [ -f "$SYSTEM_IMG" ]; then
            echo
            echo "system.img encontrada:"
            ls -lh "$SYSTEM_IMG"
            echo "system=$SYSTEM_IMG" >> "$GITHUB_OUTPUT"
          fi

          SUPER_IMG="$SYSTEM_IMAGE_DIR/super.img"

          if [ -f "$SUPER_IMG" ]; then
            echo
            echo "super.img encontrada:"
            ls -lh "$SUPER_IMG"
            echo "super=$SUPER_IMG" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar ferramentas de imagem
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            e2fsprogs \
            android-sdk-libsparse-utils \
            lvm2 \
            gdisk

          command -v debugfs
          command -v file
          command -v simg2img
          command -v img2simg




      - name: Configurar aceleração KVM
        shell: bash
        run: |
          set -e

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          ls -l /dev/kvm || true

      - name: Iniciar Safe Woman OS e Injetar Priv-App
        shell: bash
        run: |
          set -e
          mkdir -p simulation

          export ANDROID_AVD_HOME="$HOME/.android/avd"
          APK="${{ steps.apk.outputs.path }}"

          echo "===== 1. INICIANDO EMULADOR EM MODO WRITABLE ====="
          nohup emulator \
            -avd SafeWomanOS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -wipe-data \
            -no-snapshot \
            -writable-system \
            -qemu -append "androidboot.verifiedbootstate=orange" \
            > simulation/emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > simulation/emulator.pid

          echo "===== 2. AGUARDANDO ADB INICIAL ====="
          for i in {1..60}; do
            if adb get-state >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "===== 3. DESATIVANDO DM-VERITY ====="
          adb root
          sleep 2
          adb disable-verity
          
          echo "===== 4. PRIMEIRO REBOOT (APLICAR ESCRITA) ====="
          adb reboot
          sleep 5

          echo "===== 5. AGUARDANDO RETORNO PÓS-VERITY ====="
          for i in {1..60}; do
            if adb get-state >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # Torna as partições modificáveis via ADB
          adb root
          sleep 1
          adb remount
          sleep 1

          echo "===== 6. CRIAÇÃO DE DIRETÓRIOS E INJEÇÃO DO APK ====="
          adb shell mkdir -p /system/priv-app/MulherAmparada
          adb push "$APK" /system/priv-app/MulherAmparada/MulherAmparada.apk
          
          # Aplica permissões Linux corretas para o Android aceitar a leitura
          adb shell chmod 755 /system/priv-app/MulherAmparada
          adb shell chmod 644 /system/priv-app/MulherAmparada/MulherAmparada.apk
          adb shell chown -R root:root /system/priv-app/MulherAmparada

          echo "===== 7. CRIANDO WHITELIST DE PERMISSÕES PRIVILEGIADAS ====="
          # Criamos o arquivo xml temporário local no runner do GitHub
          cat <<EOF > privapp-permissions-com.mulheres.xml
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="com.mulheres">
                  <!-- Se o seu app não usar permissões com protectionLevel="privileged", pode deixar vazio -->
                  <!-- Mas o arquivo precisa existir para o Android registrar o app da pasta priv-app -->
              </privapp-permissions>
          </permissions>
          EOF

          # Envia a whitelist para o diretório correto do Android core
          adb push privapp-permissions-com.mulheres.xml /system/etc/permissions/privapp-permissions-com.mulheres.xml
          adb shell chmod 644 /system/etc/permissions/privapp-permissions-com.mulheres.xml
          adb shell chown root:root /system/etc/permissions/privapp-permissions-com.mulheres.xml

          echo "===== 8. SEGUNDO REBOOT (FORÇAR RE-ESCANEAR PARSE DE PACKAGES) ====="
          # Este reboot é o que vai fazer o PackageManager encontrar o APK recém-colocado lá dentro
          adb reboot
          sleep 5

          echo "===== 9. AGUARDANDO COMPLETA INICIALIZAÇÃO DO ANDROID RUNTIME ====="
          BOOT_COMPLETED=false
          for i in {1..120}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            echo "Boot status: ${BOOT:-aguardando} — tentativa $i/120"
            if [ "$BOOT" = "1" ]; then
              BOOT_COMPLETED=true
              break
            fi
            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android falhou ao inicializar após o escaneamento do pacote."
            cat simulation/emulator.log || true
            exit 1
          fi

          echo "✓ APK e Permissões injetados e indexados pelo PackageManager."


      - name: Diagnosticar partições reais
        shell: bash
        run: |
          set +e

          echo "===== MOUNT ====="

          adb shell mount \
            | tee simulation/mount.txt

          echo
          echo "===== DF ====="

          adb shell df -h \
            | tee simulation/df.txt

          echo
          echo "===== /SYSTEM ====="

          adb shell ls -la /system \
            | tee simulation/system-list.txt

          echo
          echo "===== /PRIV-APP ====="

          adb shell ls -la /priv-app \
            | tee simulation/priv-app-list.txt

          echo
          echo "===== /DEV/BLOCK/BY-NAME ====="

          adb shell ls -la /dev/block/by-name/ \
            | tee simulation/partitions.txt

          echo
          echo "===== PARTIÇÕES DINÂMICAS ====="

          adb shell getprop ro.boot.dynamic_partitions \
            | tee simulation/dynamic-partitions.txt

          echo
          echo "===== SLOT ====="

          adb shell getprop ro.boot.slot_suffix \
            | tee simulation/slot.txt

          echo
          echo "===== PRODUTO ====="

          adb shell getprop ro.product.name \
            | tee simulation/product.txt

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            | tee simulation/build-type.txt

          adb shell getprop ro.debuggable \
            | tee simulation/debuggable.txt

          echo
          echo "===== PROCURANDO MULHER AMPARADA ====="

          adb shell find /system \
            -maxdepth 5 \
            -iname '*Mulher*' \
            2>/dev/null \
            | tee simulation/system-search.txt

          echo
          echo "===== DIRETÓRIO ESPERADO ====="

          adb shell ls -la \
            /priv-app/MulherAmparada
            2>&1 \
            | tee simulation/expected-directory.txt

      - name: Verificar registro do pacote
        shell: bash
        run: |
          set -e

          echo "===== PACKAGE MANAGER ====="

          adb shell pm path com.mulheres 2>&1 \
            | tr -d '\r' \
            | tee simulation/pm-path.txt

          if ! grep -q '^package:' simulation/pm-path.txt; then
            echo "::error::PackageManagerService não registrou com.mulheres."
            exit 1
          fi

          echo
          echo "===== PACOTE REGISTRADO ====="

          cat simulation/pm-path.txt

          if grep -q '/priv-app/' simulation/pm-path.txt; then
            echo
            echo "✓ com.mulheres registrado como priv-app."
          else
            echo "::error::com.mulheres foi registrado, mas não está em um caminho priv-app."
            exit 1
          fi

      - name: Verificar permissões
        shell: bash
        run: |
          set +e

          adb shell dumpsys package com.mulheres \
            > simulation/permissions.txt

          echo "===== PERMISSÕES ====="

          grep -A100 -B10 \
            "requested permissions" \
            simulation/permissions.txt \
            || true

          echo
          echo "===== PRIVILEGIADAS ====="

          grep -Ei \
            "granted=true|privileged|INSTALL|LOCATION|RECORD_AUDIO|READ_CONTACTS|CALL_PHONE" \
            simulation/permissions.txt \
            || true

      - name: Capturar tela
        shell: bash
        run: |
          set +e

          adb exec-out screencap -p \
            > simulation/boot-screenshot.png

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== PACOTE ====="

          adb shell dumpsys package com.mulheres \
            || true

          echo
          echo "===== CAMINHO ====="

          adb shell pm path com.mulheres \
            || true

          echo
          echo "===== BOOT ====="

          adb shell getprop sys.boot_completed \
            || true

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            || true

          adb shell getprop ro.debuggable \
            || true

          echo
          echo "===== VERITY ====="

          adb shell getprop ro.boot.verifiedbootstate \
            || true

      - name: Parar emulador
        if: always()
        run: |
          if [ -f simulation/emulator.pid ]; then
            kill "$(cat simulation/emulator.pid)" 2>/dev/null || true
          fi

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Safe-Woman-OS-Simulacao
          path: simulation/
          if-no-files-found: warn
