name: Publicar sitemap.xml

on:
  push:
    branches:
      - main
    paths:
      - 'sitemap.xml'
      - '.github/workflows/publicar-sitemap.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar sitemap no GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        run: |
          mkdir -p _site
          cp sitemap.xml _site/sitemap.xml

      - name: Enviar sitemap para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4