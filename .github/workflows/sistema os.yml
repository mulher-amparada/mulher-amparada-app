name: Validar estrutura do Safe Woman OS

on:
  workflow_dispatch:
  push:
    paths:
      - "Safe Woman Operational System/**"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Validar estrutura AOSP
        shell: bash
        run: |
          set -e

          ROOT="Safe Woman Operational System"
          DEVICE="$ROOT/device/safe_woman"
          APP="$ROOT/packages/apps/MulherAmparada"

          echo "=== Safe Woman OS — Validação estrutural ==="
          echo

          fail=0

          check_file() {
            if [ -f "$1" ]; then
              echo "✓ $1"
            else
              echo "✗ AUSENTE: $1"
              fail=1
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "✓ $1/"
            else
              echo "✗ AUSENTE: $1/"
              fail=1
            fi
          }

          echo "== Diretórios =="
          check_dir "$DEVICE"
          check_dir "$APP"
          check_dir "$APP/app/src/main"

          echo
          echo "== Configuração do produto =="
          check_file "$DEVICE/AndroidProducts.mk"
          check_file "$DEVICE/BoardConfig.mk"
          check_file "$DEVICE/safe_woman.mk"

          echo
          echo "== Permissões =="
          check_file "$DEVICE/privapp-permissions-mulher-amparada.xml"

          echo
          echo "== Aplicativo =="
          check_file "$APP/Android.bp"
          check_file "$APP/app/src/main/AndroidManifest.xml"

          echo
          echo "== Verificando referências =="

          if grep -q "safe_woman.mk" "$DEVICE/AndroidProducts.mk"; then
            echo "✓ AndroidProducts.mk referencia safe_woman.mk"
          else
            echo "✗ AndroidProducts.mk não referencia safe_woman.mk"
            fail=1
          fi

          if grep -q "safe_woman-userdebug" "$DEVICE/AndroidProducts.mk"; then
            echo "✓ lunch safe_woman-userdebug declarado"
          else
            echo "✗ safe_woman-userdebug não encontrado"
            fail=1
          fi

          if grep -q "cuttlefish" "$DEVICE/safe_woman.mk"; then
            echo "✓ Produto referencia Cuttlefish"
          else
            echo "✗ Produto não referencia Cuttlefish"
            fail=1
          fi

          if grep -q "MulherAmparada" "$DEVICE/safe_woman.mk"; then
            echo "✓ Produto inclui MulherAmparada"
          else
            echo "✗ MulherAmparada não está em PRODUCT_PACKAGES"
            fail=1
          fi

          if grep -q 'name: "MulherAmparada"' "$APP/Android.bp"; then
            echo "✓ Android.bp declara MulherAmparada"
          else
            echo "✗ Android.bp não declara o módulo MulherAmparada"
            fail=1
          fi

          if grep -q 'package="com.mulheres"' \
              "$DEVICE/privapp-permissions-mulher-amparada.xml"; then
            echo "✓ Allowlist aponta para com.mulheres"
          else
            echo "✗ Allowlist não aponta para com.mulheres"
            fail=1
          fi

          echo
          echo "== Verificação de caminhos =="

          if grep -q \
              "device/safe_woman/privapp-permissions-mulher-amparada.xml" \
              "$DEVICE/safe_woman.mk"; then
            echo "✓ Caminho da allowlist está referenciado"
          else
            echo "✗ Caminho da allowlist não encontrado no produto"
            fail=1
          fi

          echo
          echo "======================================"

          if [ "$fail" -eq 0 ]; then
            echo "✓ RESULTADO: estrutura AOSP coerente."
            echo
            echo "Nenhum build foi executado."
            echo "Nenhum AOSP foi baixado."
          else
            echo "✗ RESULTADO: existem problemas estruturais."
            exit 1
          fi