<style>

/* =========================================================
   FONT
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("file:///android_asset/font.ttf") format("truetype");
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #000000;
    --surface: #0d0d0f;
    --surface-2: #121216;
    --surface-3: #18181d;

    --line: #24242a;
    --line-light: #303038;

    --text: #ffffff;
    --text-soft: #a6a6ae;
    --text-muted: #707078;

    --blue: #7c6cff;
    --blue-2: #9589ff;
    --blue-dark: #5548d8;

    --danger: #ff4f67;

    --radius: 24px;

}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: #000000 !important;
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;

    background: #000000 !important;
    color: var(--text);

    font-family: "Quicksand", sans-serif;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;
    max-width: 720px;

    margin: 0 auto;

    padding:
        0
        clamp(18px, 5vw, 34px)
        60px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    width: 100%;

    min-height: clamp(190px, 32vh, 270px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding-top: 20px;
    padding-bottom: 24px;

}


/* =========================================================
   HEROTAG
   SEM BACKGROUND
========================================================= */

.heroTag {

    width: 100%;

    min-height: 70px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 12px;

    color: #ffffff;

    font-family: "Quicksand", sans-serif;

    font-size: clamp(27px, 8vw, 42px);

    font-weight: 800;

    line-height: 1.1;

    letter-spacing: -0.8px;

    text-align: center;

}


/* =========================================================
   SUBTÍTULO
========================================================= */

.heroSubtitle {

    max-width: 500px;

    color: var(--text-soft);

    font-size: clamp(14px, 3.8vw, 17px);

    font-weight: 500;

    line-height: 1.5;

    text-align: center;

}




/* =========================================================
   SEÇÃO
========================================================= */

.section {

    width: 100%;


    margin-bottom: 34px;

}


.sectionHeader {

    display: flex;


    align-items: center;
    justify-content: space-between;

    margin-bottom: 13px;

}


.sectionTitle {

    color: #ffffff;

    font-size: 19px;

    font-weight: 800;

    letter-spacing: -0.3px;

}




/* =========================================================
   LISTA
========================================================= */

.list {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* =========================================================
   BOTÃO
========================================================= */
/* =========================================================
   BOTÃO
========================================================= */

.btn {

    width: 100%;
    height: auto;

    display: flex;
    align-items: center;

    padding: 26px;
    
    gap: 20px;

    border: 1px solid var(--line);
    border-radius: var(--radius);

    background: var(--surface);
    color: #ffffff;

    font-family: "Quicksand", sans-serif;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;


padding-bottom: 15px;
padding-top: 15px;

margin-top: 1.5%;
margin-bottom: 1.5%;
}

.btn:active {

    transform: scale(.985);

    background: var(--surface-2);

}


.btn:hover {

    background: var(--surface-2);

    border-color: var(--line-light);

}


/* =========================================================
   ÍCONE / EMOJI
========================================================= */

.emoji {

    width: 44px;
    height: 44px;



    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 14px;


}


.emoji img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;

}


.emoji svg {

    width: 100%;
    height: 100%;

    display: block;

    color: #ffffff;

}


/* =========================================================
   CONTEÚDO
========================================================= */

.content {

    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 3px;

}


.title {
    color: #ffffff;

    font-size: 15px;
    font-weight: 750;

    line-height: 1.25;


    white-space:
        normal;

    overflow:
        hidden;

    text-overflow:
        clip;
        
}

.description {
    color: var(--text-muted);

    font-size: 12px;
    font-weight: 500;

    line-height: 1.3;
    
    white-space:
        normal;

    overflow:
        hidden;

    text-overflow:
        clip;

    
}
/* =========================================================
   SETA
========================================================= */

.arrow {

    width: 30px;
    height: 30px;

    flex: 0 0 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #64646d;

}


.arrow svg {

    width: 18px;
    height: 18px;

}


/* =========================================================
   EMERGÊNCIA
========================================================= */

.emergency {

    border-color: #32171c;

    background: #100a0c;

}




.emergency .title {

    color: #ff6679;
    
    white-space:
        normal;

    overflow:
        hidden;

    text-overflow:
        clip;

}


.emergency .description {

    color: #98616a;

}


.emergency .arrow {

    color: #a94453;

}


/* =========================================================
   APPS
========================================================= */

.appCard {

    min-height: 84px;

}


.appCard .emoji {

    width: 50px;
    height: 50px;

    flex-basis: 50px;

    border-radius: 15px;

}


.appCard .emoji img {

    object-fit: cover;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.emptyState {

    display: none;

    width: 100%;

    padding: 34px 20px;

    border: 1px solid var(--line);

    border-radius: 22px;

    background: var(--surface);

    text-align: center;

}


.emptyIcon {

    width: 46px;
    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 12px;

    border-radius: 14px;

    background: #17171c;

    color: #8b8b94;

}


.emptyIcon svg {

    width: 23px;
    height: 23px;

}





</style>

<script>

/* =========================================================
   NAVEGAÇÃO ENTRE PÁGINAS HTML
========================================================= */

function ir(pagina) {

    if (
        typeof pagina !== "string" ||
        pagina.trim() === ""
    ) {
        return false;
    }

    try {

        window.location.href = pagina;

        return true;

    } catch (erro) {

        console.error(
            "Erro ao navegar para:",
            pagina,
            erro
        );

        return false;

    }

}


/* =========================================================
   ANDROID BRIDGE
========================================================= */

function androidCall(metodo) {

    if (
        typeof metodo !== "string" ||
        metodo.trim() === ""
    ) {
        console.warn("Método Android inválido.");
        return false;
    }


    try {

        /*
         * Verifica se a interface Android existe.
         */

        if (
            typeof Android === "undefined" ||
            Android === null
        ) {

            console.warn(
                "Interface Android não disponível."
            );

            return false;

        }


        /*
         * Verifica se o método realmente existe
         * no WebAppInterface.
         */

        if (
            typeof Android[metodo] !== "function"
        ) {

            console.warn(
                "Método Android não encontrado:",
                metodo
            );

            return false;

        }


        /*
         * Executa o método.
         */

        Android[metodo]();

        return true;

    } catch (erro) {

        console.error(
            "Erro ao executar método Android:",
            metodo,
            erro
        );

        return false;

    }

}



/* =========================================================
   DESATIVAR MENU DE CONTEXTO
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    },
    false
);



</script>
