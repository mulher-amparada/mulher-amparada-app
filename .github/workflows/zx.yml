name: Sincronizar README com Paper.wf

on:
  workflow_dispatch:

jobs:
  sincronizar-paperwf:
    name: Sincronizar README com Paper.wf
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Autenticar e atualizar publicação
        env:
          PAPERWF_USERNAME: ${{ secrets.PAPERWF_USERNAME }}
          PAPERWF_PASSWORD: ${{ secrets.PAPERWF_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          BASE = "https://paper.wf"

          USERNAME = os.environ["PAPERWF_USERNAME"]
          PASSWORD = os.environ["PAPERWF_PASSWORD"]

          COLLECTION = "mulheramparada"
          SLUG = "projeto-mulher-amparada"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          def api(url, method="GET", data=None, token=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Mulher-Amparada-GitHub-Action"
              }

              if data is not None:
                  headers["Content-Type"] = "application/json"

              if token:
                  headers["Authorization"] = f"Token {token}"

              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read().decode("utf-8")

                      print(f"HTTP {response.status}")

                      if not body:
                          return {}

                      return json.loads(body)

              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(f"HTTP {error.code}")
                  print(body)
                  raise

          # ============================================================
          # LOGIN
          # ============================================================

          print("Autenticando no Paper.wf...")

          login_payload = json.dumps({
              "alias": USERNAME,
              "pass": PASSWORD
          }).encode("utf-8")

          login = api(
              f"{BASE}/api/auth/login",
              method="POST",
              data=login_payload
          )

          token = (
              login.get("data", {}).get("access_token")
              or login.get("access_token")
              or login.get("token")
              or login.get("data", {}).get("token")
          )

          if not token:
              raise RuntimeError(
                  "O Paper.wf não retornou um token de acesso."
              )

          print("Login realizado com sucesso.")

          # ============================================================
          # LOCALIZAR POST EXISTENTE
          # ============================================================

          print("Localizando publicação existente...")

          post = api(
              f"{BASE}/api/collections/{COLLECTION}/posts/{SLUG}",
              method="GET",
              token=token
          )

          print("Resposta da publicação:")

          resposta_post = dict(post)

          # Não exibir possíveis tokens na resposta.
          def ocultar_tokens(obj):
              if isinstance(obj, dict):
                  resultado = {}

                  for chave, valor in obj.items():
                      if chave.lower() in {
                          "token",
                          "access_token",
                          "accesstoken",
                          "password",
                          "pass",
                          "session",
                          "modify_token"
                      }:
                          resultado[chave] = "[OCULTO]"
                      else:
                          resultado[chave] = ocultar_tokens(valor)

                  return resultado

              if isinstance(obj, list):
                  return [ocultar_tokens(item) for item in obj]

              return obj

          print(json.dumps(
              ocultar_tokens(resposta_post),
              ensure_ascii=False,
              indent=2
          ))

          # O WriteFreely normalmente coloca o objeto do post
          # dentro de "data".
          post_data = post.get("data", post)

          if isinstance(post_data, list):
              if not post_data:
                  raise RuntimeError(
                      "O Paper.wf retornou uma lista de posts vazia."
                  )

              post_data = post_data[0]

          if not isinstance(post_data, dict):
              raise RuntimeError(
                  "Resposta inesperada ao localizar o post."
              )

          post_id = (
              post_data.get("id")
              or post_data.get("post", {}).get("id")
              if isinstance(post_data.get("post"), dict)
              else post_data.get("id")
          )

          if not post_id:
              raise RuntimeError(
                  "Não foi possível encontrar o ID do post existente."
              )

          print(f"Post encontrado: {post_id}")

          # ============================================================
          # ATUALIZAR O MESMO POST
          # ============================================================

          payload = json.dumps({
              "title": "Projeto Mulher Amparada",
              "body": readme
          }).encode("utf-8")

          print("Atualizando publicação...")

          atualizado = api(
              f"{BASE}/api/posts/{post_id}",
              method="POST",
              data=payload,
              token=token
          )

          print("Resposta da atualização:")

          print(json.dumps(
              ocultar_tokens(atualizado),
              ensure_ascii=False,
              indent=2
          ))

          print("README sincronizado com o Paper.wf.")
          PY