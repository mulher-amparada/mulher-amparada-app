name: 🧹 Limpar arquivos da raiz da code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout da branch code
        uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0

      - name: Apagar somente arquivos da raiz
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos que serão removidos:"
          find . -maxdepth 1 -type f \
            ! -path './.git/*' \
            -print

          find . -maxdepth 1 -type f \
            -delete

      - name: Salvar alterações na code
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          if git diff --cached --quiet; then
            echo "Nenhum arquivo para remover."
            exit 0
          fi

          git commit -m "Limpar arquivos da raiz da code"

          git fetch origin code
          git rebase origin/code
          git push origin HEAD:code



