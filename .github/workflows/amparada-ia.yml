name: Amparada IA - testes Python, BPE e C

on:
  push:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
  pull_request:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    name: Testes Python e tokenizadores
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Amparada IA
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Amparada IA/requirements.txt"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Treinar modelo com caracteres
        run: |
          python -m src.amparada_ia.train \
            --tokenizer char --steps 5 --block-size 16 \
            --output runs/ci-char.pt

      - name: Treinar modelo com BPE
        run: |
          python -m src.amparada_ia.train \
            --tokenizer bpe --vocab-size 128 --steps 5 --block-size 16 \
            --output runs/ci-bpe.pt

      - name: Avaliar checkpoint BPE
        run: |
          python -m src.amparada_ia.evaluate \
            --checkpoint runs/ci-bpe.pt --batches 2

      - name: Testar geração BPE
        run: |
          python -m src.amparada_ia.generate \
            --checkpoint runs/ci-bpe.pt --prompt "Respeito" --tokens 8

  test-c-runtime:
    name: Compilar e validar inferência C
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Amparada IA
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar runtime C com avisos
        run: |
          cc -O2 -std=c11 -Wall -Wextra -pedantic \
            c_runtime/amparada.c -lm -o /tmp/amparada-c

      - name: Treinar checkpoint pequeno para CI
        run: |
          python -m src.amparada_ia.train \
            --tokenizer char --steps 5 --block-size 16 \
            --output runs/ci-c.pt

      - name: Comparar logits C com PyTorch
        run: |
          python -m src.amparada_ia.verify_c \
            --checkpoint runs/ci-c.pt --prompt "Respeito" --tolerance 0.001