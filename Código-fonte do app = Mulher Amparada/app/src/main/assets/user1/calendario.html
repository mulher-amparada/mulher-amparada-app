<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ciclo</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

*::-webkit-scrollbar{
    width:0;
    height:0;
    background:transparent;
}

*::-webkit-scrollbar-track{
    background:transparent;
}

*::-webkit-scrollbar-thumb{
    background:transparent;
    border:none;
}

*{
    scrollbar-width:none;
    scrollbar-color:transparent transparent;
}

html,
body{
    scrollbar-width:none;
    scrollbar-color:transparent transparent;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
    width:0;
    height:0;
    background:transparent;
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Quicksand",sans-serif;
}


@font-face{
    font-family:"Quicksand";
    src:url("font.ttf") format("truetype");
}


:root{

    --rosa:#ff7f9f;
    --rosa2:#ff4f78;
    --rosa3:#ffb1c4;

    --fundo:#080808;

    --card:rgba(255,255,255,.075);
    --card2:rgba(255,255,255,.11);

    --texto:#fff;
    --texto2:rgba(255,255,255,.68);
    --texto3:rgba(255,255,255,.42);

    --borda:rgba(255,255,255,.10);

    --verde:#67e8a5;
    --amarelo:#ffd166;
    --vermelho:#ff657d;

    --raio:26px;
}


/* =========================================================
   BODY
========================================================= */

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    overflow-x:hidden;

    color:var(--texto);

    background:black;

    padding-top:50px;
}


/* =========================================================
   APP
========================================================= */

#app{

    width:min(720px,100%);

    padding-top: 16px 50px;

    opacity:0;

    

    animation:
        entrada
        .55s
        ease both;
}


@keyframes entrada{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* =========================================================
   TOPO
========================================================= */

.topo{

    position:relative;

    top:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    height:82px;

    margin-bottom:8px;

    background:#000;

    border-radius:200px;

    width:95%;

    margin:2.5%;

    backdrop-filter:none;

    -webkit-backdrop-filter:none;

    isolation:isolate;
}


.topo::before,
.topo::after{
    display:none;
}


.topo-esquerda{

    display:flex;

    flex-direction:column;

    gap:3px;
}


.titulo{

    font-size:25px;

    font-weight:800;

    letter-spacing:-.8px;

    background:
        linear-gradient(
            135deg,
            #fff,
            var(--rosa3)
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}


.subtitulo{

    font-size:12px;

    color:var(--texto3);
}


/* =========================================================
   AÇÕES
========================================================= */

.acoes{

    display:flex;

    align-items:center;

    gap:9px;
}


.botao,
.apagar{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    width:48px;

    height:48px;

    border:0;

    border-radius:999px;

    cursor:pointer;

    color:white;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;

    overflow:hidden;
}


.botao::before,
.apagar::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            transparent 55%
        );

    opacity:.8;
}


.botao::after,
.apagar::after{

    content:"";

    position:absolute;

    width:70%;

    height:70%;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    filter:blur(12px);

    transform:translateY(35px);

    transition:transform .3s ease;
}


.botao{

    background:
        linear-gradient(
            135deg,
            var(--rosa),
            var(--rosa2)
        );

    box-shadow:
        0 8px 24px rgba(255,79,120,.28);
}


.botao:hover{

    transform:
        translateY(-2px)
        scale(1.04);
}


.botao:hover::after{

    transform:translateY(0);
}


.botao:active,
.apagar:active{

    transform:scale(.94);
}


.mais{

    position:relative;

    z-index:2;

    font-size:30px;

    font-weight:300;

    line-height:1;
}


.apagar{

    background:rgba(255,255,255,.08);

    border:1px solid var(--borda);
}


.apagar:hover{

    background:
        rgba(255,75,95,.18);

    transform:translateY(-2px);
}


.apagar img{

    position:relative;

    z-index:2;

    width:20px;

    height:20px;

    object-fit:contain;
}


/* =========================================================
   RESUMO
========================================================= */

.resumo{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-bottom:18px;
}


.resumo-card{

    position:relative;

    min-height:88px;

    padding:14px;

    border:1px solid var(--borda);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(16px);

    -webkit-backdrop-filter:blur(16px);

    overflow:hidden;
}


.resumo-card::before{

    content:"";

    position:absolute;

    width:70px;

    height:70px;

    right:-28px;

    bottom:-30px;

    border-radius:50%;

    background:
        rgba(255,127,159,.18);

    filter:blur(4px);
}


.resumo-label{

    position:relative;

    color:var(--texto3);

    font-size:11px;

    font-weight:600;
}


.resumo-valor{

    position:relative;

    margin-top:5px;

    font-size:23px;

    font-weight:800;
}


.resumo-detalhe{

    position:relative;

    margin-top:1px;

    color:var(--texto3);

    font-size:9px;
}


/* =========================================================
   CONTROLES
========================================================= */

.controles{

    display:flex;

    align-items:center;

    gap:9px;

    width:100%;

    margin-bottom:15px;
}


.busca{

    flex:1;

    min-width:0;

    height:46px;

    padding:0 16px;

    border:1px solid var(--borda);

    border-radius:999px;

    outline:none;

    color:white;

    background:
        rgba(255,255,255,.07);

    font-size:13px;

    transition:
        border .2s,
        background .2s;
}


.busca::placeholder{

    color:var(--texto3);
}


.busca:focus{

    border-color:
        rgba(255,127,159,.5);

    background:
        rgba(255,255,255,.10);
}

/* =========================================================
   DROPDOWN CUSTOMIZADO
   HTML + CSS — SEM SELECT NATIVO
========================================================= */

.ordenar-wrapper{

    position:relative;

    width:175px;

    flex-shrink:0;

    z-index:50;
}


/* =========================================================
   BOTÃO
========================================================= */

.ordenar-botao{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:space-between;

    width:100%;

    height:46px;

    padding:
        0 15px
        0 42px
        0 16px;
        
        padding-left: 15px;
    border:
        1px solid
        var(--borda);

    border-radius:999px;

    outline:none;

    color:white;

    background:
        #111;

    font-family:"Quicksand",sans-serif;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    
    transition:
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.ordenar-botao {
    
}

.ordenar-botao:hover {
    border: 1px solid rgba(255, 192, 203, 0.5);
}


/* =========================================================
   SETA
========================================================= */

.ordenar-seta{

    position:absolute;

    right:14px;

    top:50%;

    width:17px;

    height:17px;

    transform:
        translateY(-50%);

    color:
        rgba(255,177,196,.85);

    pointer-events:none;

    transition:
        transform .25s ease,
        color .25s ease;
}


/* SETA ABERTA */

.ordenar-wrapper.aberto
.ordenar-seta{

    transform:
        translateY(-50%)
        rotate(180deg);

    color:
        var(--rosa3);
}


/* =========================================================
   MENU
========================================================= */

.menu-ordenar{

    position:absolute;

    top:calc(100% + 8px);

    left:50%;

    width:50%;

    padding:6px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:20px;

    background: #111;



    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transform:
        translateY(-6px)
        scale(.97);

    transform-origin:
        top center;

    transition:
        opacity .18s ease,
        transform .18s ease,
        visibility .18s ease;
}


/* =========================================================
   MENU ABERTO
========================================================= */

.ordenar-wrapper.aberto
.menu-ordenar{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

    
}


/* =========================================================
   OPÇÕES
========================================================= */

.opcao-ordenar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    width:100%;

    min-height:42px;

    padding:
        0 11px;

    border:0;

    border-radius:14px;

    outline:none;

    color:
        rgba(255,255,255,.72);

    background:transparent;

    font-family:"Quicksand",sans-serif;

    font-size:11px;

    font-weight:650;

    text-align:left;

    cursor:pointer;

    transition:
        background .18s ease,
        color .18s ease;
}


.opcao-ordenar:hover{

    color:white;

    
}


.opcao-ordenar:active{

    background:
        rgba(255, 192, 203, 0.5);
}


/* =========================================================
   OPÇÃO SELECIONADA
========================================================= */

.opcao-ordenar.ativa{

    color:white;

    background: rgba(255, 192, 203, 0.5);
}






/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:560px){

    .ordenar-wrapper{

        width:100%;

    }


    .ordenar-botao{

        width:100%;

    }


    .menu-ordenar{

        top:calc(100% + 7px);

        border-radius:18px;

    }

}
/* =========================================================
   LISTA
========================================================= */

#lista{

    display:flex;

    flex-direction:column;


    gap:10px;
}


.vazio{

    position:relative;

    padding:45px 20px;

    text-align:center;

    border:1px dashed
        rgba(255,255,255,.13);

    border-radius:28px;

    background:
        rgba(255,255,255,.035);
}


.vazio-icone{

    font-size:38px;

    margin-bottom:10px;
}


.vazio-titulo{

    font-size:16px;

    font-weight:700;
}


.vazio-texto{

    margin-top:5px;

    color:var(--texto3);

    font-size:12px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    display:flex;

    align-items:center;

    gap:14px;

    min-height:88px;

    padding:14px 15px;

    padding-right:68px;

    border:1px solid var(--borda);

    border-radius:26px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.045)
        );

    backdrop-filter:blur(16px);

    -webkit-backdrop-filter:blur(16px);

    cursor:pointer;

    overflow:hidden;

    animation:
        cardEntrada
        .45s
        ease
        both;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}


@keyframes cardEntrada{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


.card::before{

    content:"";

    position:absolute;

    left:0;

    top:12px;

    bottom:12px;

    width:3px;

    border-radius:
        0 5px 5px 0;

    background:
        linear-gradient(
            180deg,
            var(--rosa),
            var(--rosa2)
        );
}


.card::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    right:-70px;

    top:-70px;

    border-radius:50%;

    background:
        rgba(255,127,159,.10);

    filter:blur(8px);

    transition:
        transform .35s ease;
}


.card:hover{

    transform:translateY(-3px);

    border-color:
        rgba(255,127,159,.28);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.06)
        );

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.22);
}


.card:hover::after{

    transform:scale(1.6);
}


.humor{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:center;

    width:52px;

    height:52px;

    flex-shrink:0;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,127,159,.22),
            rgba(255,255,255,.06)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    font-size:26px;
}


.card-info{

    position:relative;

    z-index:2;

    flex:1;

    min-width:0;
}


.card-data{

    font-size:15px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.card-humor{

    margin-top:3px;

    color:var(--texto3);

    font-size:11px;
}


.card-direita{

    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:4px;

    flex-shrink:0;
}


.dor{

    padding:5px 9px;

    border-radius:999px;

    font-size:10px;

    font-weight:800;

    background:
        rgba(255,255,255,.08);
}


.seta{

    color:var(--texto3);

    font-size:17px;
}




/* =========================================================
   TELA GRÁFICOS
========================================================= */

#telaGraficos{

    display:none;

    animation:
        entrada
        .4s
        ease
        both;
}


.graficos-topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;
}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

#volta{
    width:44px;
    height:44px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    border:1px solid var(--borda);
    border-radius:999px;

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    transition:
        transform .2s,
        background .2s;
}

#volta svg{
    display:block;

    width:21px;
    height:21px;

    flex-shrink:0;
}

#volta:hover{
    transform:translateX(-3px);
    background:rgba(255,255,255,.13);
}

.detalhe-titulo{

    font-size:20px;

    font-weight:800;
}


.detalhe-sub{

    margin-top:2px;

    color:var(--texto3);

    font-size:11px;
}


/* =========================================================
   DESTAQUE DA DOR
========================================================= */

.dor-destaque{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:space-between;

    min-height:105px;

    padding:20px;

    margin-bottom:12px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,127,159,.22),
            rgba(255,255,255,.055)
        );

    border:
        1px solid
        rgba(255,127,159,.20);

    overflow:hidden;
}


.dor-destaque::before{

    content:"";

    position:absolute;

    width:170px;

    height:170px;

    right:-70px;

    top:-70px;

    border-radius:50%;

    background:
        rgba(255,127,159,.15);

    filter:blur(8px);
}


.dor-label{

    position:relative;

    color:var(--texto2);

    font-size:12px;
}


.dor-numero{

    position:relative;

    margin-top:3px;

    font-size:40px;

    line-height:1;

    font-weight:900;
}


.dor-max{

    position:relative;

    color:var(--texto3);

    font-size:11px;
}


.dor-barra{

    position:relative;

    width:45%;

    height:9px;

    border-radius:999px;

    background:
        rgba(255,255,255,.10);

    overflow:hidden;
}


.dor-progresso{

    height:100%;

    width:0;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--verde),
            var(--amarelo),
            var(--vermelho)
        );

    transition:
        width .8s ease;
}


/* =========================================================
   GRID DE GRÁFICOS
========================================================= */

.graficos-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}


.grafico-card{

    position:relative;

    min-width:0;

    padding:14px;

    border:
        1px solid
        var(--borda);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    overflow:hidden;
}


.grafico-card::before{

    content:"";

    position:absolute;

    top:-45px;

    right:-45px;

    width:100px;

    height:100px;

    border-radius:50%;

    background:
        rgba(255,127,159,.08);
}


.grafico-titulo{

    position:relative;

    margin-bottom:8px;

    font-size:12px;

    font-weight:800;
}


.grafico-card canvas{

    position:relative;

    width:100% !important;

    height:220px !important;
}


/* =========================================================
   MODAL
========================================================= */

#modal{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:flex-end;

    justify-content:center;

    padding:
        15px
        15px
        max(20px,env(safe-area-inset-bottom));

    background:
        rgba(0,0,0,.65);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    overflow:hidden;
}


#modal.aberto{

    display:flex;

    animation:
        modalFundo
        .25s
        ease;
}


@keyframes modalFundo{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* =========================================================
   CONTEÚDO MODAL
========================================================= */

.modal-conteudo{

    position:relative;

    width:min(650px,100%);

    max-height:
        calc(
            90vh -
            max(20px,env(safe-area-inset-bottom))
        );

    padding:
        22px
        22px
        28px;

    
    overflow-y:auto;

    overflow-x:hidden;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:
        32px
        32px
        20px
        20px;

    background:
        linear-gradient(
            145deg,
            rgba(35,35,35,.97),
            rgba(12,12,12,.97)
        );

    box-shadow:
        0 -20px 80px
        rgba(0,0,0,.45);

    animation:
        modalSubir
        .35s
        cubic-bezier(.2,.8,.2,1);
}


@keyframes modalSubir{

    from{
        transform:translateY(60px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }

}


/* =========================================================
   BARRINHA MODAL
========================================================= */

.modal-conteudo::before{

    content:"";

    position:absolute;

    top:9px;

    left:50%;

    width:45px;

    height:4px;

    transform:
        translateX(-50%);

    border-radius:999px;

    background:
        rgba(255,255,255,.20);
}


/* =========================================================
   TOPO MODAL
========================================================= */

.modal-topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:18px;

    padding-top:8px;
}


.modal-titulo{

    font-size:21px;

    font-weight:800;
}


.fechar{

    width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    font-size:19px;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}


.campo{

    display:flex;

    flex-direction:column;

    gap:6px;
}


.campo.full{

    grid-column:1/-1;
}


.campo label{

    color:var(--texto2);

    font-size:11px;

    font-weight:600;
}


.campo input,
.campo select{

    width:100%;

    height:45px;

    padding:0 13px;

    border:
        1px solid
        var(--borda);

    border-radius:15px;

    outline:none;

    color:white;

    background:
        rgba(255,255,255,.07);
}


.campo input:focus,
.campo select:focus{

    border-color:
        rgba(255,127,159,.5);
}


.checks{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:5px;
}


.check{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:10px;

    min-height:43px;

    padding:9px 11px;

    border:
        1px solid

<script>

/* =========================================================
   DADOS
========================================================= */

let charts = [];

let ordemAtual = "novo";


/* =========================================================
   CARREGAR DADOS
========================================================= */

function getDados(){

    try{

        const dados =
            Cripto.carregar("ciclo");

        if(!dados){
            return [];
        }

        const parsed =
            JSON.parse(dados);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(e){

        console.error(
            "Erro ao carregar dados:",
            e
        );

        return [];

    }

}


/* =========================================================
   SALVAR DADOS
========================================================= */

function salvarDados(dados){

    try{

        const json =
            JSON.stringify(dados);

        Cripto.salvar(
            "ciclo",
            json
        );

    }catch(e){

        console.error(
            "Erro ao salvar dados:",
            e
        );

    }

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function valor(id){

    const elemento =
        document.getElementById(id);

    return elemento
        ? elemento.checked
        : false;

}


function formatarData(data){

    if(!data){
        return "—";
    }

    const partes =
        data.split("-");

    if(partes.length !== 3){
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


function emojiHumor(humor){

    const emojis = {

        feliz:"😊",
        neutro:"😐",
        triste:"😢",
        desconfortavel:"😣"

    };

    return emojis[humor] || "😐";

}


function nomeHumor(humor){

    const nomes = {

        feliz:"Feliz",
        neutro:"Neutro",
        triste:"Triste",
        desconfortavel:"Desconfortável"

    };

    return nomes[humor] || "Neutro";

}


/* =========================================================
   SELETOR DE HUMOR
========================================================= */

function criarSeletorHumor(){

    const select =
        document.getElementById("humor");

    if(!select){
        return;
    }

    select.style.display = "none";

    const campo =
        select.closest(".campo");

    if(!campo){
        return;
    }

    /*
       Evita criar o seletor duas vezes.
    */

    if(
        campo.querySelector(
            ".humor-selector"
        )
    ){

        return;

    }


    const valores = [

        {
            value:"feliz",
            emoji:"😊",
            texto:"Feliz"
        },

        {
            value:"neutro",
            emoji:"😐",
            texto:"Neutro"
        },

        {
            value:"desconfortavel",
            emoji:"😣",
            texto:"Desconfortável"
        },

        {
            value:"triste",
            emoji:"😢",
            texto:"Triste"
        }

    ];


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "humor-selector";


    wrapper.innerHTML = `

        <button
            type="button"
            class="humor-selector-botao"
            aria-haspopup="listbox"
            aria-expanded="false"
        >

            <span class="humor-selector-valor">
                😊 Feliz
            </span>

            <svg
                class="humor-selector-seta"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M7 9.5L12 14.5L17 9.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </button>


        <div
            class="humor-selector-menu"
            role="listbox"
        ></div>

    `;


    const menu =
        wrapper.querySelector(
            ".humor-selector-menu"
        );


    valores.forEach(item => {

        const opcao =
            document.createElement("button");

        opcao.type = "button";

        opcao.className =
            "humor-opcao";

        opcao.dataset.value =
            item.value;


        opcao.innerHTML = `

            <span class="humor-opcao-esquerda">

                <span class="humor-opcao-emoji">
                    ${item.emoji}
                </span>

                <span>
                    ${item.texto}
                </span>

            </span>

            <span class="humor-opcao-check">
                ✓
            </span>

        `;


        opcao.onclick =
            function(event){

                event.stopPropagation();

                selecionarHumor(
                    item.value,
                    item.emoji,
                    item.texto
                );

            };


        menu.appendChild(
            opcao
        );

    });


    select.insertAdjacentElement(
        "afterend",
        wrapper
    );


    const botao =
        wrapper.querySelector(
            ".humor-selector-botao"
        );


    botao.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            alternarHumor();

        }
    );


    marcarHumorSelecionado(
        "feliz"
    );

}


/* =========================================================
   ABRIR / FECHAR HUMOR
========================================================= */

function alternarHumor(){

    const wrapper =
        document.querySelector(
            ".humor-selector"
        );

    if(!wrapper){
        return;
    }


    const aberto =
        wrapper.classList.contains(
            "aberto"
        );


    fecharTodosSeletores();


    if(!aberto){

        wrapper.classList.add(
            "aberto"
        );


        const botao =
            wrapper.querySelector(
                ".humor-selector-botao"
            );


        if(botao){

            botao.setAttribute(
                "aria-expanded",
                "true"
            );

        }

    }

}


/* =========================================================
   SELECIONAR HUMOR
========================================================= */

function selecionarHumor(
    valorSelecionado,
    emoji,
    texto
){

    const select =
        document.getElementById(
            "humor"
        );


    const wrapper =
        document.querySelector(
            ".humor-selector"
        );


    if(select){

        select.value =
            valorSelecionado;

    }


    if(wrapper){

        const textoElemento =
            wrapper.querySelector(
                ".humor-selector-valor"
            );


        if(textoElemento){

            textoElemento.textContent =
                `${emoji} ${texto}`;

        }


        wrapper
            .querySelectorAll(
                ".humor-opcao"
            )
            .forEach(opcao => {

                opcao.classList.toggle(
                    "ativa",
                    opcao.dataset.value ===
                        valorSelecionado
                );

            });


        wrapper.classList.remove(
            "aberto"
        );


        const botao =
            wrapper.querySelector(
                ".humor-selector-botao"
            );


        if(botao){

            botao.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }

}


/* =========================================================
   MARCAR HUMOR
========================================================= */

function marcarHumorSelecionado(
    valorSelecionado
){

    const item =
        document.querySelector(
            `.humor-opcao[data-value="${valorSelecionado}"]`
        );


    if(!item){
        return;
    }


    const emoji =
        item.querySelector(
            ".humor-opcao-emoji"
        )?.textContent || "";


    const texto =
        item
            .querySelector(
                ".humor-opcao-esquerda"
            )
            ?.innerText
            ?.replace(
                emoji,
                ""
            )
            ?.trim() || "";


    selecionarHumor(
        valorSelecionado,
        emoji,
        texto
    );

}


/* =========================================================
   ORDENAÇÃO
========================================================= */

function alternarOrdenar(){

    const wrapper =
        document.querySelector(
            ".ordenar-wrapper"
        );

    if(!wrapper){
        return;
    }


    const aberto =
        wrapper.classList.contains(
            "aberto"
        );


    fecharTodosSeletores();


    if(!aberto){

        wrapper.classList.add(
            "aberto"
        );


        const botao =
            document.getElementById(
                "ordenarBotao"
            );


        if(botao){

            botao.setAttribute(
                "aria-expanded",
                "true"
            );

        }

    }

}


/* =========================================================
   SELECIONAR ORDENAÇÃO
========================================================= */

function selecionarOrdenacao(
    valorSelecionado,
    texto
){

    ordemAtual =
        valorSelecionado;


    const textoElemento =
        document.getElementById(
            "ordenarTexto"
        );


    if(textoElemento){

        textoElemento.textContent =
            texto;

    }


    document
        .querySelectorAll(
            ".opcao-ordenar"
        )
        .forEach(opcao => {

            opcao.classList.toggle(
                "ativa",
                opcao.dataset.value ===
                    valorSelecionado
            );

        });


    const wrapper =
        document.querySelector(
            ".ordenar-wrapper"
        );


    if(wrapper){

        wrapper.classList.remove(
            "aberto"
        );

    }


    const botao =
        document.getElementById(
            "ordenarBotao"
        );


    if(botao){

        botao.setAttribute(
            "aria-expanded",
            "false"
        );

    }


    renderizar();

}


/* =========================================================
   FECHAR SELETORES
========================================================= */

function fecharTodosSeletores(){

    const ordenar =
        document.querySelector(
            ".ordenar-wrapper"
        );


    if(ordenar){

        ordenar.classList.remove(
            "aberto"
        );


        const botao =
            document.getElementById(
                "ordenarBotao"
            );


        if(botao){

            botao.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }


    const humor =
        document.querySelector(
            ".humor-selector"
        );


    if(humor){

        humor.classList.remove(
            "aberto"
        );


        const botao =
            humor.querySelector(
                ".humor-selector-botao"
            );


        if(botao){

            botao.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }

}


/* =========================================================
   CLIQUE FORA
========================================================= */

document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".ordenar-wrapper"
            ) &&
            !event.target.closest(
                ".humor-selector"
            )
        ){

            fecharTodosSeletores();

        }

    }
);


/* =========================================================

========================================================= */

function abrirRegistro(){

    const hoje =
        new Date();


    const ano =
        hoje.getFullYear();


    const mes =
        String(
            hoje.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            hoje.getDate()
        ).padStart(
            2,
            "0"
        );


    const dataAtual =
        `${ano}-${mes}-${dia}`;


    const form =
        document.getElementById(
            "formRegistro"
        );


    if(form){

        form.reset();

    }


    const data =
        document.getElementById(
            "data"
        );


    if(data){

        data.value =
            dataAtual;

    }


    selecionarHumor(
        "feliz",
        "😊",
        "Feliz"
    );


    const modal =
        document.getElementById(
            "modal"
        );


    if(modal){

        modal.classList.add(
            "aberto"
        );

    }

}


function fecharModal(){

    const modal =
        document.getElementById(
            "modal"
        );


    if(modal){

        modal.classList.remove(
            "aberto"
        );

    }


    fecharTodosSeletores();

}


const modal =
    document.getElementById(
        "modal"
    );


if(modal){

    modal.addEventListener(
        "click",
        function(e){

            if(e.target === this){

                fecharModal();

            }

        }
    );

}


/* =========================================================
   SALVAR REGISTRO
========================================================= */

function salvarRegistro(event){

    event.preventDefault();


    const dataElemento =
        document.getElementById(
            "data"
        );


    const dorElemento =
        document.getElementById(
            "dor"
        );


    const humorElemento =
        document.getElementById(
            "humor"
        );


    const registro = {

        data:
            dataElemento
                ? dataElemento.value
                : "",


        dor:
            dorElemento
                ? Number(
                    dorElemento.value
                ) || 0
                : 0,


        humorTexto:
            humorElemento
                ? humorElemento.value
                : "feliz",


        /* Hábitos */

        agua:
            valor("agua"),

        cafe:
            valor("cafe"),

        chocolate:
            valor("chocolate"),

        exercicio:
            valor("exercicio"),

        sonoRuim:
            valor("sonoRuim"),

        apetite:
            valor("apetite"),


        /* Sintomas */

        cansaco:
            valor("cansaco"),

        irritacao:
            valor("irritacao"),

        ansiedade:
            valor("ansiedade"),

        colica:
            valor("colica"),

        dorCabeca:
            valor("dorCabeca"),

        inchaco:
            valor("inchaco"),

        acne:
            valor("acne"),

        nausea:
            valor("nausea"),

        tontura:
            valor("tontura"),

        energiaBaixa:
            valor("energiaBaixa"),


        /* Emocional */

        estresse:
            valor("estresse"),

        tristeza:
            valor("tristeza"),

        felicidade:
            valor("felicidade"),

        sensibilidade:
            valor("sensibilidade"),

        concentracao:
            valor("concentracao"),

        libido:
            valor("libido")

    };


    /*
       Carrega os registros existentes.
    */

    const dados =
        getDados();


    /*
       Adiciona o novo registro.
    */

    dados.push(
        registro
    );


    /*
       SALVA DIRETAMENTE NA CRIPTO.
    */

    salvarDados(
        dados
    );


    /*
       Limpa o formulário.
    */

    const form =
        document.getElementById(
            "formRegistro"
        );


    if(form){

        form.reset();

    }


    /*
       Restaura o humor padrão.
    */

    selecionarHumor(
        "feliz",
        "😊",
        "Feliz"
    );


    /*
       Fecha o modal.
    */

    fecharModal();


    /*
       Atualiza a lista.
    */

    renderizar();

}


/* =========================================================
   APAGAR TODOS
========================================================= */

function apagarTudo(){

    const dados =
        getDados();


    if(dados.length === 0){

        return;

    }


    if(
        !confirm(
            "Apagar todos os registros?\n\nEssa ação não pode ser desfeita."
        )
    ){

        return;

    }


    Cripto.remover(
        "ciclo"
    );


    renderizar();

}


/* =========================================================
   APAGAR REGISTRO INDIVIDUAL
========================================================= */

function apagarRegistro(registro){

    const dados =
        getDados();


    const indice =
        dados.indexOf(
            registro
        );


    if(indice === -1){

        return;

    }


    if(
        !confirm(
            "Apagar este registro?\n\nEssa ação não pode ser desfeita."
        )
    ){

        return;

    }


    dados.splice(
        indice,
        1
    );


    if(dados.length === 0){

        Cripto.remover(
            "ciclo"
        );

    }else{

        salvarDados(
            dados
        );

    }


    renderizar();

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(dados){

    const total =
        document.getElementById(
            "totalRegistros"
        );


    const mediaElemento =
        document.getElementById(
            "dorMedia"
        );


    const ultimo =
        document.getElementById(
            "ultimoRegistro"
        );


    if(total){

        total.textContent =
            dados.length;

    }


    if(dados.length === 0){

        if(mediaElemento){

            mediaElemento.textContent =
                "0";

        }


        if(ultimo){

            ultimo.textContent =
                "—";

        }


        return;

    }


    const media =
        dados.reduce(
            (total,d) => {

                return total +
                    (
                        Number(d.dor) || 0
                    );

            },
            0
        ) / dados.length;


    if(mediaElemento){

        mediaElemento.textContent =
            media.toFixed(1);

    }


    const ordenados =
        [...dados].sort(
            (a,b) =>
                String(b.data)
                    .localeCompare(
                        String(a.data)
                    )
        );


    if(ultimo){

        ultimo.textContent =
            formatarData(
                ordenados[0].data
            );

    }

}


/* =========================================================
   LISTA
========================================================= */

function renderizar(){

    const container =
        document.getElementById(
            "lista"
        );


    if(!container){
        return;
    }


    let dados =
        getDados();


    atualizarResumo(
        dados
    );


    const busca =
        document
            .getElementById(
                "busca"
            )
            ?.value
            ?.toLowerCase()
            .trim() || "";


    const ordem =
        ordemAtual || "novo";


    /* =====================================================
       PESQUISA
    ===================================================== */

    if(busca){

        dados =
            dados.filter(
                d => {

                    const texto = [

                        d.data,
                        d.humorTexto,
                        d.dor

                    ]
                    .join(" ")
                    .toLowerCase();


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /* =====================================================
       ORDENAÇÃO
    ===================================================== */

    dados.sort(
        (a,b) => {

            if(ordem === "dor"){

                return (
                    Number(b.dor) -
                    Number(a.dor)
                );

            }


            const comparacao =
                String(b.data)
                    .localeCompare(
                        String(a.data)
                    );


            return ordem === "novo"
                ? comparacao
                : -comparacao;

        }
    );


    container.innerHTML =
        "";


    /* =====================================================
       VAZIO
    ===================================================== */

    if(dados.length === 0){

        container.innerHTML = `

            <div class="vazio">

                <div class="vazio-icone">
                    ${busca ? "🔎" : "🌸"}
                </div>

                <div class="vazio-titulo">

                    ${
                        busca
                            ? "Nenhum resultado"
                            : "Nenhum registro ainda"
                    }

                </div>

                <div class="vazio-texto">

                    ${
                        busca
                            ? "Tente pesquisar por outra data ou informação."
                            : "Toque no botão + para criar seu primeiro registro."
                    }

                </div>

            </div>

        `;

        return;

    }


    /* =====================================================
       CARDS
    ===================================================== */

    dados.forEach(
        (d,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "card";


            card.style.animationDelay =
                `${index * .035}s`;


            const dor =
                Number(d.dor) || 0;


            card.innerHTML = `

                <div class="humor">

                    ${emojiHumor(
                        d.humorTexto
                    )}

                </div>


                <div class="card-info">

                    <div class="card-data">

                        ${formatarData(
                            d.data
                        )}

                    </div>


                    <div class="card-humor">

                        ${nomeHumor(
                            d.humorTexto
                        )}

                    </div>

                </div>


                <div class="card-direita">

                    <div class="dor">

                        Dor ${dor}/10

                    </div>


                    <div class="card-acoes">

                        <button
                            class="card-apagar"
                            type="button"
                            aria-label="Apagar registro"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M4 7H20"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M9 7V4H15V7"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M7 7L8 20H16L17 7"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M10 11V16M14 11V16"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </button>


                        <div class="seta">

                            ›

                        </div>

                    </div>

                </div>

            `;


            card.onclick =
                () =>
                    abrirGraficos(d);


            const botaoApagar =
                card.querySelector(
                    ".card-apagar"
                );


            if(botaoApagar){

                botaoApagar.onclick =
                    function(event){

                        event.preventDefault();

                        event.stopPropagation();

                        apagarRegistro(d);

                    };

            }


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================

========================================================= */

function destruir(){

    charts.forEach(
        chart => {

            try{

                chart.destroy();

            }catch(e){}

        }
    );


    charts = [];

}


const chartBase = {

    responsive:true,

    maintainAspectRatio:false,

    plugins:{

        legend:{

            labels:{

                color:

                font:{

                    family:"Quicksand",

                    size:10

                boxWidth:10,

};


function bool(v){

}
