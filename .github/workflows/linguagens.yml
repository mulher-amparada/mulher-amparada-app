name: Atualizar relatório de linguagens

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/linguagens.yml'

  workflow_call:

  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: relatorio-linguagens
  cancel-in-progress: false

jobs:
  analisar:
    name: Analisar linguagens da main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar dependências do Linguist
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ruby-full \
            build-essential \
            cmake \
            pkg-config \
            libicu-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            jq

      - name: Instalar GitHub Linguist
        run: |
          set -euo pipefail

          gem install github-linguist \
            --no-document \
            --user-install

          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"


      - name: Analisar linguagens do repositório
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p relatorios

          github-linguist \
            --breakdown \
            --json \
            > /tmp/linguagens.json

          jq -e 'type == "object"' /tmp/linguagens.json > /dev/null

          ruby <<'RUBY'
          require "json"
          require "time"

          origem = "/tmp/linguagens.json"
          destino_json = "relatorios/linguagens.json"
          destino_md = "relatorios/linguagens.md"

          dados_linguist = JSON.parse(File.read(origem))

          linguagens = dados_linguist.map do |nome, dados|
            {
              "nome" => nome,
              "tamanho_bytes" => dados["size"] || 0,
              "percentual" => dados["percentage"] || "0",
              "arquivos" => dados["files"] || []
            }
          end

          linguagens.sort_by! { |item| item["nome"].downcase }

          total_bytes = linguagens.sum { |item| item["tamanho_bytes"].to_i }
          total_arquivos = linguagens.sum { |item| item["arquivos"].length }

          relatorio = {
            "repositorio" => "mulher-amparada/mulher-amparada-app",
            "branch" => "main",
            "fonte_classificacao" => "GitHub Linguist",
            "fonte_lista_linguagens" =>
              "https://github.com/github-linguist/linguist",
            "gerado_em_utc" => Time.now.utc.iso8601,
            "total_linguagens" => linguagens.length,
            "total_arquivos_classificados" => total_arquivos,
            "total_bytes_classificados" => total_bytes,
            "linguagens" => linguagens
          }

          File.write(
            destino_json,
            JSON.pretty_generate(relatorio) + "\n"
          )

          linhas = [
            "# Relatório de linguagens",
            "",
            "- **Repositório:** `mulher-amparada/mulher-amparada-app`",
            "- **Branch:** `main`",
            "- **Classificador:** GitHub Linguist",
            "- **Lista oficial:** https://github.com/github-linguist/linguist",
            "- **Gerado em UTC:** #{relatorio["gerado_em_utc"]}",
            "- **Linguagens identificadas:** #{linguagens.length}",
            "- **Arquivos classificados:** #{total_arquivos}",
            "- **Tamanho classificado:** #{total_bytes} bytes",
            "",
            "> O Linguist aplica suas regras de classificação e pode excluir",
            "> arquivos binários, gerados, vendorizados ou não contabilizados",
            "> nas estatísticas de linguagens.",
            "",
            "## Resumo",
            "",
            "| Linguagem | Arquivos | Bytes | Percentual |",
            "|---|---:|---:|---:|"
          ]

          linguagens
            .sort_by { |item| [-item["tamanho_bytes"].to_i, item["nome"].downcase] }
            .each do |item|
              linhas << "| #{item["nome"]} | #{item["arquivos"].length} | #{item["tamanho_bytes"]} | #{item["percentual"]}% |"
            end

          linhas << ""
          linhas << "## Arquivos por linguagem"
          linhas << ""

          linguagens.each do |item|
            linhas << "### #{item["nome"]}"
            linhas << ""
            linhas << "- **Arquivos:** #{item["arquivos"].length}"
            linhas << "- **Tamanho:** #{item["tamanho_bytes"]} bytes"
            linhas << "- **Percentual:** #{item["percentual"]}%"
            linhas << ""

            item["arquivos"].sort.each do |arquivo|
              linhas << "- `#{arquivo}`"
            end

            linhas << ""
          end

          File.write(destino_md, linhas.join("\n") + "\n")

          puts "Linguagens: #{linguagens.length}"
          puts "Arquivos classificados: #{total_arquivos}"
          puts "Relatórios gerados com sucesso."
          RUBY

      - name: Validar relatórios
        run: |
          set -euo pipefail

          test -s relatorios/linguagens.md
          test -s relatorios/linguagens.json

          jq -e '
            .fonte_classificacao == "GitHub Linguist"
            and (.linguagens | type == "array")
          ' relatorios/linguagens.json > /dev/null

      - name: Verificar alterações
        id: alteracoes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            relatorios/linguagens.md \
            relatorios/linguagens.json; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar relatórios
        if: steps.alteracoes.outputs.mudou == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            relatorios/linguagens.md \
            relatorios/linguagens.json

          git commit -m "Atualizar relatório de linguagens"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main