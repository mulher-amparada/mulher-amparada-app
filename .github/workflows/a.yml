name: Simular Safe Woman OS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  simulate:
    name: Android virtual + app privilegiado
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          CMDLINE_TOOLS="$(find "$SDK/cmdline-tools" \
            -mindepth 3 \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::sdkmanager não encontrado."

            echo "Conteúdo de cmdline-tools:"
            find "$SDK/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -print || true

            exit 1
          fi

          echo "sdkmanager: $CMDLINE_TOOLS"

          echo "$(dirname "$CMDLINE_TOOLS")" >> "$GITHUB_PATH"

          "$CMDLINE_TOOLS" --version

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;aosp_atd;x86_64"

      - name: Encontrar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "Safe Woman Operational System" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Projeto: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Encontrar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado."

            find . \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "APK: $APK"
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"

      - name: Criar AVD
        shell: bash
        run: |
          set -e

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          mkdir -p "$ANDROID_AVD_HOME"

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd \
            --force \
            --name SafeWomanOS \
            --package "system-images;android-35;aosp_atd;x86_64" \
            --device "pixel_2"

          echo
          echo "===== AVDs DISPONÍVEIS ====="

          emulator -list-avds

          if ! emulator -list-avds | grep -qx "SafeWomanOS"; then
            echo "::error::AVD SafeWomanOS não foi criado corretamente."

            echo
            echo "===== CONTEÚDO DO AVD ====="

            find "$ANDROID_AVD_HOME" \
              -maxdepth 3 \
              -type f \
              -print || true

            exit 1
          fi

          echo "AVD SafeWomanOS criado com sucesso."

      - name: Configurar aceleração KVM
        shell: bash
        run: |
          set -e

          echo "===== KVM ====="

          ls -l /dev/kvm || true
          groups || true

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          ls -l /dev/kvm || true

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM disponível."
          else
            echo "::warning::KVM não está disponível para o usuário."
          fi

      - name: Iniciar Android
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"

          echo
          echo "===== AVDs DISPONÍVEIS ====="

          emulator -list-avds

          if ! emulator -list-avds | grep -qx "SafeWomanOS"; then
            echo "::error::AVD SafeWomanOS não está disponível."
            exit 1
          fi

          echo
          echo "===== ADB ====="

          command -v adb
          adb version

          echo
          echo "===== INICIANDO EMULADOR ====="

          nohup emulator \
            -avd SafeWomanOS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -writable-system \
            -wipe-data \
            -no-snapshot \
            > simulation/emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "$EMULATOR_PID" > simulation/emulator.pid

          echo "PID do emulador: $EMULATOR_PID"

          echo
          echo "===== AGUARDANDO ADB ====="

          ADB_READY=false

          for i in {1..60}; do
            if adb get-state >/dev/null 2>&1; then
              echo "ADB detectou o emulador."
              ADB_READY=true
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::O processo do emulador encerrou antes de o ADB detectá-lo."

              echo
              echo "===== LOG DO EMULADOR ====="

              cat simulation/emulator.log || true

              exit 1
            fi

            echo "ADB ainda não detectou o emulador... tentativa $i/60"

            sleep 2
          done

          if [ "$ADB_READY" != "true" ]; then
            echo "::error::ADB não detectou o emulador após 120 segundos."

            echo
            echo "===== PROCESSOS ====="

            ps -ef | grep -E "[e]mulator|[q]emu" || true

            echo
            echo "===== DISPOSITIVOS ADB ====="

            adb devices -l || true

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "===== AGUARDANDO BOOT DO ANDROID ====="

          BOOT_COMPLETED=false

          for i in {1..120}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            echo "Boot: ${BOOT:-aguardando} — tentativa $i/120"

            if [ "$BOOT" = "1" ]; then
              echo
              echo "Android iniciou corretamente."

              BOOT_COMPLETED=true

              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::O emulador encerrou durante o boot."

              echo
              echo "===== LOG DO EMULADOR ====="

              cat simulation/emulator.log || true

              exit 1
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android não terminou o boot após 240 segundos."

            echo
            echo "===== DISPOSITIVOS ADB ====="

            adb devices -l || true

            echo
            echo "===== PROPRIEDADES ====="

            adb shell getprop sys.boot_completed || true
            adb shell getprop dev.bootcomplete || true

            echo
            echo "===== PROCESSOS ====="

            ps -ef | grep -E "[e]mulator|[q]emu" || true

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "===== ADB APÓS BOOT ====="

          adb devices -l

          adb get-state

          echo
          echo "===== TESTE DE SHELL ====="

          adb shell id
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      - name: Obter acesso root
        shell: bash
        run: |
          set -e

          echo "===== VERIFICANDO EMULADOR ====="

          adb devices -l

          if ! adb get-state >/dev/null 2>&1; then
            echo "::error::Nenhum dispositivo Android está conectado ao ADB."

            echo
            echo "===== PROCESSOS ====="

            ps -ef | grep -E "[e]mulator|[q]emu" || true

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo "Emulador encontrado."

          echo
          echo "===== ROOT ====="

          ROOT_OK=false

          for i in {1..10}; do
            echo "Tentativa de adb root: $i/10"

            if adb root; then
              ROOT_OK=true
              break
            fi

            sleep 3
          done

          if [ "$ROOT_OK" != "true" ]; then
            echo "::error::Não foi possível obter root."

            adb devices -l || true
            adb shell id || true

            exit 1
          fi

          echo
          echo "===== AGUARDANDO ADB ROOT ====="

          sleep 5

          adb wait-for-device

          echo
          echo "===== UID ====="

          adb shell id

      - name: Diagnosticar partições graváveis
        shell: bash
        run: |
          set -e

          echo "===== MONTAGENS ====="
          adb shell mount

          echo
          echo "===== TESTANDO /DATA ====="
          adb shell 'touch /data/safe-woman-test && rm /data/safe-woman-test'
          echo "/data: OK"

          echo
          echo "===== TESTANDO /CACHE ====="
          adb shell 'touch /cache/safe-woman-test && rm /cache/safe-woman-test' \
            && echo "/cache: OK" \
            || echo "/cache: somente leitura ou inexistente"

          echo
          echo "===== TESTANDO /METADATA ====="
          adb shell 'touch /metadata/safe-woman-test && rm /metadata/safe-woman-test' \
            && echo "/metadata: OK" \
            || echo "/metadata: somente leitura ou inexistente"

          echo
          echo "===== OVERLAY SYSTEM ====="
          adb shell 'mount | grep " /system " || true'

          echo
          echo "===== UPPERDIR ====="
          adb shell 'ls -ld /mnt/scratch /mnt/scratch/overlay /mnt/scratch/overlay/system /mnt/scratch/overlay/system/upper' \
            || true
            
      - name: Tornar system gravável
        shell: bash
        run: |
          set -e

          echo "===== ROOT ====="

          adb root

          sleep 5

          adb wait-for-device

          echo
          echo "===== REMOUNT ====="

          if adb remount; then
            echo "adb remount funcionou."
          else
            echo "::error::adb remount falhou."

            echo
            echo "===== MONTAGENS ====="

            adb shell mount || true

            echo
            echo "===== PROPRIEDADES ====="

            adb shell getprop ro.build.type || true
            adb shell getprop ro.debuggable || true
            adb shell getprop ro.boot.verifiedbootstate || true

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "===== REBOOT PARA ATIVAR OVERLAYFS ====="

          adb reboot

          echo "Aguardando dispositivo..."

          adb wait-for-device

          BOOT_COMPLETED=false

          for i in {1..120}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            echo "Boot: ${BOOT:-aguardando} — tentativa $i/120"

            if [ "$BOOT" = "1" ]; then
              BOOT_COMPLETED=true
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android não terminou o boot após ativar OverlayFS."

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "===== ROOT NOVAMENTE ====="

          ROOT_OK=false

          for i in {1..15}; do
            echo "Tentativa de adb root: $i/15"

            if adb root; then
              ROOT_OK=true
              break
            fi

            sleep 3
          done

          if [ "$ROOT_OK" != "true" ]; then
            echo "::error::Não foi possível recuperar root após reboot."

            adb devices -l || true
            adb shell id || true

            exit 1
          fi

          sleep 5

          adb wait-for-device

          echo
          echo "===== UID ====="

          adb shell id

          echo
          echo "===== MONTAGENS ====="

          adb shell mount \
            | grep -E ' /system | /system_ext | /product | /vendor ' \
            || true

          echo
          echo "===== TESTE DE ESCRITA ====="

          adb shell mkdir -p /system/priv-app/MulherAmparada

          echo "OverlayFS está gravável."

      - name: Instalar APK como priv-app
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          APK="${{ steps.apk.outputs.path }}"

          echo "APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo "::error::APK não existe."
            exit 1
          fi

          echo
          echo "===== ROOT ====="

          adb root

          sleep 5

          adb wait-for-device

          echo
          echo "===== CRIANDO PRIV-APP ====="

          adb shell mkdir -p \
            /system/priv-app/MulherAmparada

          echo
          echo "===== COPIANDO APK ====="

          adb push \
            "$APK" \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          echo
          echo "===== PERMISSÕES ====="

          adb shell chmod 0644 \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          adb shell chown root:root \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          echo
          echo "===== ARQUIVO ====="

          adb shell ls -la \
            /system/priv-app/MulherAmparada/

          echo
          echo "APK colocado em /system/priv-app."

          echo
          echo "===== REINICIANDO ANDROID ====="

          adb reboot

          adb wait-for-device

          BOOT_COMPLETED=false

          for i in {1..120}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            echo "Boot: ${BOOT:-aguardando} — tentativa $i/120"

            if [ "$BOOT" = "1" ]; then
              BOOT_COMPLETED=true
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android não terminou o boot após instalar o priv-app."

            echo
            echo "===== LOG DO EMULADOR ====="

            cat simulation/emulator.log || true

            exit 1
          fi

      - name: Verificar se é aplicativo do sistema
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          echo "===== CAMINHO DO PACOTE ====="

          adb shell pm path com.mulheres \
            | tee simulation/pm-path.txt

          echo
          echo "===== INFORMAÇÕES DO PACOTE ====="

          adb shell dumpsys package com.mulheres \
            | tee simulation/package-info.txt

          echo
          echo "===== SYSTEM APPS ====="

          adb shell pm list packages -s \
            | tee simulation/system-packages.txt

          echo
          echo "===== PRIV-APP ====="

          adb shell pm path com.mulheres \
            | tee simulation/priv-app-check.txt

          if ! grep -q '/system/priv-app/' \
            simulation/priv-app-check.txt; then

            echo "::error::Mulher Amparada NÃO está em /system/priv-app."

            exit 1
          fi

          echo
          echo "======================================"
          echo " MULHER AMPARADA É PRIV-APP"
          echo "======================================"

      - name: Verificar permissões
        shell: bash
        run: |
          set -e

          adb shell dumpsys package com.mulheres \
            > simulation/permissions.txt

          echo "===== PERMISSÕES DO APLICATIVO ====="

          grep -A100 -B10 \
            "requested permissions" \
            simulation/permissions.txt \
            || true

          echo
          echo "===== PERMISSÕES PRIVILEGIADAS ====="

          grep -Ei \
            "granted=true|privileged|INSTALL|LOCATION|RECORD_AUDIO|READ_CONTACTS|CALL_PHONE" \
            simulation/permissions.txt \
            || true

      - name: Capturar tela inicial
        shell: bash
        run: |
          set -e

          adb exec-out screencap -p \
            > simulation/boot-screenshot.png

      - name: Abrir gaveta de aplicativos
        shell: bash
        run: |
          set -e

          adb shell input keyevent KEYCODE_HOME

          sleep 3

          adb shell input swipe \
            540 1800 \
            540 500 \
            700

          sleep 3

          adb exec-out screencap -p \
            > simulation/app-drawer.png

      - name: Verificar presença na gaveta
        shell: bash
        run: |
          set -e

          adb shell pm list packages \
            | tee simulation/all-packages.txt

          if grep -q "com.mulheres" \
            simulation/all-packages.txt; then

            echo "Mulher Amparada está instalada."

          else

            echo "::error::Mulher Amparada não está instalada."

            exit 1
          fi

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          echo "===== PACOTE ====="

          adb shell dumpsys package com.mulheres \
            || true

          echo
          echo "===== CAMINHO ====="

          adb shell pm path com.mulheres \
            || true

          echo
          echo "===== BOOT ====="

          adb shell getprop sys.boot_completed \
            || true

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            || true

          adb shell getprop ro.debuggable \
            || true

          echo
          echo "===== VERITY ====="

          adb shell getprop ro.boot.verifiedbootstate \
            || true

          echo
          echo "===== ADB ====="

          adb devices -l \
            || true

      - name: Parar emulador
        if: always()
        shell: bash
        run: |
          if [ -f simulation/emulator.pid ]; then
            kill "$(cat simulation/emulator.pid)" 2>/dev/null || true
          fi

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Safe-Woman-OS-Simulacao
          path: simulation/
          if-no-files-found: warn