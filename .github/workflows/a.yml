name: Data do primeiro commit da main

on:
  workflow_dispatch:

jobs:
  primeiro-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar histórico da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obter data do primeiro commit da main
        run: |
          DATA=$(git log main --reverse --format=%cI | head -n 1)
          echo "Primeiro commit da main: $DATA"