name: Automacao Java

on:
  workflow-dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: java Automacao.java