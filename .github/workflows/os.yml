name: "AmparadaOS - Pre-build DevContainer"

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ativar manualmente clicando em um botão no GitHub

jobs:
  devcontainer-activation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permissão para salvar a imagem pronta no registro do GitHub
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Activate DevContainer Environment
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/amparada-os-live
          cacheFrom: ghcr.io/${{ github.repository }}/amparada-os-live
          push: always
          # Executa a compilação do seu app em Kotlin/Compose direto na esteira
          runCmd: |
            echo "🔨 Automatizando processos do aplicativo Mulher Amparada..."
            cd "Código-fonte do app = Mulher Amparada" && gradle assembleDebug
