name: Organizar e sincronizar código do app

on:
  push:
    branches:
      - main
    paths:
      - 'Código-fonte do app = Mulher Amparada/**'
      - '.github/workflows/sincronizar-app.yml'

  workflow_call:

permissions:
  contents: write

concurrency:
  group: sincronizar-mulher-amparada
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Organizar e atualizar arquivos
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verificar pasta de origem
        shell: bash
        run: |
          set -euo pipefail

          ORIGEM="Código-fonte do app = Mulher Amparada"

          if [ ! -d "$ORIGEM" ]; then
            echo "::error::Pasta de origem não encontrada: $ORIGEM"
            exit 1
          fi

          if [ -z "$(find "$ORIGEM" -mindepth 1 -print -quit)" ]; then
            echo "::error::A pasta de origem está vazia."
            exit 1
          fi

      - name: Copiar e sobrescrever arquivos
        shell: bash
        run: |
          set -euo pipefail

          ORIGEM="Código-fonte do app = Mulher Amparada"
          DESTINO="Safe Woman Operational System/packages/apps/MulherAmparada"

          mkdir -p "$DESTINO"

          cp -a "$ORIGEM/." "$DESTINO/"

          echo "Arquivos copiados e atualizados."
          echo "Os arquivos exclusivos do destino foram preservados."

      - name: Verificar alterações
        id: alteracoes
        shell: bash
        run: |
          set -euo pipefail

          DESTINO="Safe Woman Operational System/packages/apps/MulherAmparada"

          git add -A -- "$DESTINO"

          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração encontrada."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            echo "Alterações encontradas."
          fi

      - name: Salvar alterações no GitHub
        if: steps.alteracoes.outputs.mudou == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Sincronizar código do app Mulher Amparada"

          for tentativa in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Sincronização concluída com sucesso."
                exit 0
              fi
            else
              echo "::error::Conflito durante o rebase. É necessária uma resolução manual."
              git rebase --abort || true
              exit 1
            fi

            echo "Tentativa $tentativa falhou. Atualizando a branch novamente."

            if [ "$tentativa" -lt 5 ]; then
              sleep 2
            fi
          done

          echo "::error::Não foi possível enviar as alterações após 5 tentativas."
          exit 1