<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#070709"
>

<title>Planner</title>


<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

/* Chrome, Edge, Safari, Android WebView */
*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

/* Firefox */
* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

/* Página */
html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

/* Remove qualquer fundo da área de rolagem */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --accent: #ff9db7;

    --accent-soft:
        rgba(255,157,183,.14);

    --accent-border:
        rgba(255,157,183,.24);

    --bg: #060608;

    --card:
        rgba(255,255,255,.055);

    --card-hover:
        rgba(255,255,255,.085);

    --border:
        rgba(255,255,255,.085);

    --text:
        rgba(255,255,255,.95);

    --muted:
        rgba(255,255,255,.45);

    --danger:
        #ff6878;

    --success:
        #6dffad;

    --warning:
        #ffd76a;
}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    font-family:
        Quicksand,
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;
}

html,
body {

    width: 100%;

    min-height: 100%;

    background: var(--bg);

    color: var(--text);
}

body {

    overflow-x: hidden;

    user-select: none;

    -webkit-user-select: none;

padding-top: 2.5%;
    padding-bottom:
        env(safe-area-inset-bottom);
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 5px;

    height: 5px;
}

::-webkit-scrollbar-track {

    background: transparent;
}

::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.13);

    border-radius: 999px;
}


/* =========================================================
   FUNDO
========================================================= */

.fundo {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% -15%,
            var(--accent-soft),
            transparent 38%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.025),
            transparent 40%
        ),

        #050507;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transform: scale(1.03);
}


.fundo::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            rgba(0,0,0,.5)
        );
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

        from {
        opacity: 0;
        
    }

    to {
        opacity: 1;
        
    }
}


@keyframes slideIn {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes menuIn {

    from {

        opacity: 0;

        transform:
            translateX(-18px);
    }

    to {

        opacity: 1;

        transform:
            translateX(0);
    }
}


@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }
}


@keyframes pulse {

    0%,
    100% {

        transform:
            scale(1);

        opacity: 1;
    }

    50% {

        transform:
            scale(.8);

        opacity: .5;
    }
}


/* =========================================================
   TOPO
========================================================= */

.header {

    position: relative;

    top: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 14px;

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding:
        max(14px, env(safe-area-inset-top))
        18px
        14px;

    
}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;

    min-width: 0;
}


.brand-icon {

    width: 43px;

    height: 43px;

    flex: 0 0 43px;

    display: grid;

    place-items: center;

    border-radius: 15px;

    color: var(--accent);

    background:
        var(--accent-soft);

    border:
        1px solid var(--accent-border);

    box-shadow:
        0 0 25px
        rgba(255,157,183,.08);

    font-size: 20px;
}


.brand-text {

    min-width: 0;
}


.brand-title {

    font-size: 20px;

    font-weight: 700;

    line-height: 1;
}


.brand-subtitle {

    margin-top: 4px;

    font-size: 10px;

    color: var(--muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.header-actions {

    display: flex;

    gap: 7px;
}


.icon-button {

    width: 42px;

    height: 42px;

    display: flex;

    justify-content: center;
    align-items: center;
    border: 1px solid var(--border);

    border-radius: 14px;

    color: white;

    background:
        rgba(255,255,255,.055);

    font-size: 18px;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease;
}


.icon-button:active {

    transform:
        scale(.9);
}


.icon-button:hover {

    background:
        rgba(255,255,255,.10);
}


/* =========================================================
   CONTEÚDO
========================================================= */

.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding:
        8px
        18px
        120px;

    animation:
        pageIn .55s ease both;
}


/* =========================================================
   RESUMO
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 15px;
}


.stat {

    min-width: 0;

    padding: 14px;

    border-radius: 18px;

    background:
        var(--card);

    border:
        1px solid var(--border);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.16);
}


.stat-number {

    font-size: 20px;

    font-weight: 700;

    color: var(--accent);
}


.stat-label {

    margin-top: 2px;

    font-size: 10px;

    color: var(--muted);
}


/* =========================================================
   BARRA DE PESQUISA
========================================================= */

.search {

    display: flex;

    align-items: center;

    gap: 10px;

    height: 52px;

    margin-bottom: 10px;

    padding:
        0 15px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid var(--border);

    transition:
        border .2s ease,
        background .2s ease;
}


.search:focus-within {

    background:
        rgba(255,255,255,.075);

    border-color:
        var(--accent-border);
}


.search svg {

    width: 20px;

    height: 20px;

    color: var(--muted);

    flex: 0 0 auto;
}


.search input {

    width: 100%;

    min-width: 0;

    border: 0;

    outline: 0;

    background: transparent;

    color: white;

    font-size: 14px;
}


.search input::placeholder {

    color:
        rgba(255,255,255,.35);
}


/* =========================================================
   FILTROS
========================================================= */

.filters {

    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding:
        2px
        0
        8px;

    scrollbar-width: none;
}


.filters::-webkit-scrollbar {

    display: none;
}


.filter {

    flex: 0 0 auto;

    padding:
        8px
        13px;

    border:
        1px solid var(--border);

    border-radius: 999px;

    color:
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.04);

    font-size: 11px;

    cursor: pointer;

    transition:
        .18s ease;
}


.filter.active {

    color: #000;

    background:
        var(--accent);

    border-color:
        var(--accent);
}


/* =========================================================
   ORDENAR
========================================================= */

.toolbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin:
        5px
        0
        10px;
}


.result-count {

    color: var(--muted);

    font-size: 10px;
}


.sort {

    width: auto;

    margin: 0;

    padding:
        7px
        10px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    color: white;

    background:
        rgba(255,255,255,.05);

    outline: none;

    font-size: 10px;
}


/* =========================================================
   LISTA
========================================================= */

#list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


/* =========================================================
   TAREFA
========================================================= */

.task {

    position: relative;

    display: flex;

    align-items: center;

    gap: 12px;

    width: 100%;

    min-height: 70px;

    padding:
        11px
        12px;

    border:
        1px solid var(--border);

    border-radius: 18px;

    background:
        var(--card);

    transition:
        transform .18s ease,
        background .18s ease,
        opacity .18s ease;

    animation:
        slideIn .25s ease both;
}


.task:hover {

    background:
        var(--card-hover);

    transform:
        translateY(-1px);
}


.task.high {

    border-left:
        3px solid #ff5d68;
}


.task.medium {

    border-left:
        3px solid #ffd75c;
}


.task.low {

    border-left:
        3px solid #6cff9f;
}


.task.done {

    opacity: .46;
}


.task.done .task-text {

    text-decoration:
        line-through;
}


/* =========================================================
   CHECK
========================================================= */

.check {

    width: 34px;

    height: 34px;

    flex: 0 0 34px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    color: transparent;

    background:
        rgba(255,255,255,.04);

    cursor: pointer;

    transition:
        .2s ease;
}


.task.done .check {

    color: #000;

    background:
        var(--success);

    border-color:
        var(--success);
}


/* =========================================================
   TEXTO
========================================================= */

.task-content {

    min-width: 0;

    flex: 1;
}


.task-text {

    overflow: hidden;

    text-overflow: ellipsis;

    line-height: 1.3;

    font-size: 13px;

    font-weight: 600;

    word-break: break-word;
}


.task-meta {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 5px;

    color: var(--muted);

    font-size: 9px;
}


.priority-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: currentColor;
}


.task.high .priority-dot {

    color: #ff5d68;
}


.task.medium .priority-dot {

    color: #ffd75c;
}


.task.low .priority-dot {

    color: #6cff9f;
}


/* =========================================================
   AÇÕES DA TAREFA
========================================================= */

.task-actions {

    display: flex;

    gap: 5px;

    flex: 0 0 auto;
}


.task-button {

    width: 32px;

    height: 32px;

    display: grid;

    place-items: center;

    border:
        1px solid var(--border);

    border-radius: 10px;

    color:
        rgba(255,255,255,.55);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    transition:
        .18s ease;
}


.task-button:hover {

    color: white;

    background:
        rgba(255,255,255,.09);
}


.task-button.delete:hover {

    color: var(--danger);

    border-color:
        rgba(255,104,120,.25);
}


/* =========================================================
   ESTADO VAZIO
========================================================= */

.empty {

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    min-height: 260px;

    text-align: center;

    color: var(--muted);

    animation:
        slideIn .3s ease both;
}


.empty-icon {

    width: 58px;

    height: 58px;

    display: grid;

    place-items: center;

    margin-bottom: 12px;

    border-radius: 20px;

    color: var(--accent);

    background:
        var(--accent-soft);

    font-size: 25px;
}


.empty-title {

    color:
        rgba(255,255,255,.75);

    font-size: 14px;

    font-weight: 700;
}


.empty-text {

    max-width: 260px;

    margin-top: 5px;

    font-size: 10px;

    line-height: 1.5;
}


/* =========================================================
   BOTÃO FLUTUANTE
========================================================= */

.add-button {

    position: fixed;

    right:
        max(20px, env(safe-area-inset-right));

    bottom:
        max(20px, env(safe-area-inset-bottom));

    z-index: 1500;

    width: 58px;

    height: 58px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 20px;

    color: #000;

    background:
        var(--accent);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4);

    font-size: 25px;

    cursor: pointer;

    transition:
        transform .18s ease;
        
        margin-bottom: 5%;
}


.add-button:active {

    transform:
        scale(.9);
}


/* =========================================================
   MENU LATERAL
========================================================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    z-index: 2500;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    opacity: 0;

    pointer-events: none;

    transition:
        .3s ease;
}


.menu-overlay.open {

    opacity: 1;

    pointer-events: auto;
}


.side-menu {

    position: fixed;

    top: 0;

    left: 0;

    z-index: 3000;

    width: min(310px, 86vw);

    height: 100vh;

    padding:
        max(20px, env(safe-area-inset-top))
        18px
        20px;

    background:
        rgba(12,12,15,.94);

    border-right:
        1px solid var(--border);

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    transform:
        translateX(-105%);

    transition:
        transform .32s
        cubic-bezier(.2,.8,.2,1);
}


.side-menu.open {

    transform:
        translateX(0);
}


.menu-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.menu-title {

    font-size: 20px;

    font-weight: 700;
}


.close-menu {

    width: 38px;

    height: 38px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    color: white;

    background:
        rgba(255,255,255,.05);

    cursor: pointer;
}


.menu-section {

    margin-top: 20px;

    color: var(--muted);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.menu-item {

    display: flex;

    align-items: center;

    gap: 11px;

    width: 100%;

    margin-top: 7px;

    padding: 12px;

    border:
        1px solid transparent;

    border-radius: 14px;

    color:
        rgba(255,255,255,.75);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    transition:
        .18s ease;
}


.menu-item:hover {

    background:
        var(--accent-soft);

    border-color:
        var(--accent-border);

    color: white;

    transform:
        translateX(3px);
}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s ease;
}


.modal.open {

    opacity: 1;

    pointer-events: auto;
}


.modal-card {

    width: min(100%, 480px);

    padding: 20px;

    border:
        1px solid var(--border);

    border-radius: 24px;

    background:
        rgba(15,15,18,.94);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.65);

    transform:
        translateY(12px)
        scale(.97);

    transition:
        transform .25s ease;
}


.modal.open .modal-card {

    transform:
        translateY(0)
        scale(1);
}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}


.modal-title {

    font-size: 18px;

    font-weight: 700;
}


.modal-close {

    width: 35px;

    height: 35px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    color: white;

    background:
        rgba(255,255,255,.05);

    cursor: pointer;
}


/* =========================================================
   FORM
========================================================= */

.field {

    margin-top: 11px;
}


.field label {

    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 10px;
}


.field input,
.field select {

    width: 100%;

    height: 48px;

    padding:
        0 13px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    outline: none;

    color: white;

    background:
        rgba(0,0,0,.45);

    font-size: 13px;
}


.field input:focus,
.field select:focus {

    border-color:
        var(--accent-border);
}


.field select option {

    background: #111;
}


.form-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 15px;
}


.primary-button,
.secondary-button {

    height: 47px;

    border: 0;

    border-radius: 14px;

    font-weight: 700;

    cursor: pointer;
}


.primary-button {

    color: #000;

    background:
        var(--accent);
}


.secondary-button {

    color: white;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid var(--border);
}


/* =========================================================
   POMODORO
========================================================= */

.pomodoro {

    margin-top: 25px;

    padding:
        18px;

    border:
        1px solid var(--border);

    border-radius: 22px;

    background:
        var(--card);
}


.pomodoro-title {

    text-align: center;

    font-size: 12px;

    color: var(--muted);
}


.timer {

    position: relative;

    margin: 12px auto;

    width: 170px;
    height: 170px;

    display: grid;
    place-items: center;

    border-radius: 200px;

    background:
        conic-gradient(
            var(--accent) var(--progress, 0%),
            rgba(255,255,255,.07) 0
        );

    overflow: hidden;

    isolation: isolate;
}


.timer::before {

    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 200px;

    background:
        #0a0a0d;
}


.timer span {

    position: relative;

    z-index: 1;

    font-size: 36px;

    font-weight: 700;

    color: var(--accent);

    text-shadow:
        0 0 18px
        var(--accent-soft);
}


.pomo-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 7px;
}


.pomo-button {

    height: 40px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    color: white;

    background:
        rgba(255,255,255,.055);

    cursor: pointer;

    font-size: 11px;

    font-weight: 600;
}


/* =========================================================
   TEMA
========================================================= */

.theme {

    margin-top: 8px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    background:
        rgba(255,255,255,.035);
}


.theme span {

    color:
        rgba(255,255,255,.65);

    font-size: 11px;
}


/* =========================================================
   SELETOR DE COR — ESTILIZADO
========================================================= */

#colorPicker {

    width: 46px;

    height: 34px;

    padding: 3px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

    cursor: pointer;

    overflow: hidden;

    appearance: none;

    -webkit-appearance: none;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}


#colorPicker:hover {

    border-color:
        var(--accent-border);

    background:
        rgba(255,255,255,.09);
}


#colorPicker:active {

    transform:
        scale(.92);
}


/* Área interna da cor — Chrome / Android WebView */

#colorPicker::-webkit-color-swatch-wrapper {

    padding: 0;

}


#colorPicker::-webkit-color-swatch {

    border: none;

    border-radius: 9px;
}


/* Firefox */

#colorPicker::-moz-color-swatch {

    border: none;

    border-radius: 9px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        max(90px, calc(80px + env(safe-area-inset-bottom)));

    z-index: 6000;

    max-width:
        calc(100% - 40px);

    padding:
        10px
        15px;

    border:
        1px solid var(--border);

    border-radius: 999px;

    color: white;

    background:

<script>

/* =========================================================
   ESTADO
========================================================= */

let tasks = [];

let currentFilter = "Todos";

let editingIndex = -1;

let currentSort = "default";


/* =========================================================
   CRIPTO
========================================================= */

function cryptoLoad(
    key
) {

    try {

        if (
            typeof Cripto === "undefined" ||
            typeof Cripto.carregar !== "function"
        ) {

            return null;

        }


        return Cripto.carregar(
            key
        );

    } catch (error) {

        console.error(
            "Cripto.carregar:",
            error
        );

        return null;

    }

}


function cryptoSave(
    key,
    value
) {

    try {

        if (
            typeof Cripto === "undefined" ||
            typeof Cripto.salvar !== "function"
        ) {

            return false;

        }


        Cripto.salvar(
            key,
            value
        );

        return true;

    } catch (error) {

        console.error(
            "Cripto.salvar:",
            error
        );

        return false;

    }

}


/* =========================================================
   CARREGAR TAREFAS
========================================================= */

function loadTasks() {

    try {

        const data =
            cryptoLoad(
                "tasks"
            );


        if (!data) {

            tasks = [];

            return;

        }


        const parsed =
            typeof data === "string"
                ? JSON.parse(data)
                : data;


        if (
            !Array.isArray(parsed)
        ) {

            tasks = [];

            return;

        }


        tasks =
            parsed
                .filter(task =>
                    task &&
                    typeof task.text === "string"
                )
                .map(task => ({

                    text:
                        task.text.trim(),

                    cat:
                        task.cat || "Pessoal",

                    priority:
                        task.priority || "low",

                    done:
                        Boolean(task.done),

                    created:
                        Number(
                            task.created
                        ) ||
                        Date.now(),

                    updated:
                        Number(
                            task.updated
                        ) ||
                        Date.now()

                }));


    } catch (error) {

        console.error(
            "Erro ao carregar tarefas:",
            error
        );

        tasks = [];

    }

}


/* =========================================================
   SALVAR
========================================================= */

function saveTasks() {

    cryptoSave(
        "tasks",
        JSON.stringify(
            tasks
        )
    );

}


/* =========================================================
   TEMA
========================================================= */

function loadTheme() {

    const saved =
        cryptoLoad(
            "accent"
        );


    if (
        !saved ||
        typeof saved !== "string"
    ) {

        return;

    }


    applyTheme(
        saved
    );


    const picker =
        document.getElementById(
            "colorPicker"
        );


    if (picker) {

        picker.value =
            saved;

    }

}


function applyTheme(
    color
) {

    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    document.documentElement
        .style
        .setProperty(
            "--accent-soft",
            hexToRGBA(
                color,
                .14
            )
        );


    document.documentElement
        .style
        .setProperty(
            "--accent-border",
            hexToRGBA(
                color,
                .25
            )
        );

}


function hexToRGBA(
    hex,
    alpha
) {

    if (
        !/^#[0-9A-F]{6}$/i.test(
            hex
        )
    ) {

        return `rgba(255,157,183,${alpha})`;

    }


    const r =
        parseInt(
            hex.slice(1,3),
            16
        );


    const g =
        parseInt(
            hex.slice(3,5),
            16
        );


    const b =
        parseInt(
            hex.slice(5,7),
            16
        );


    return `rgba(${r},${g},${b},${alpha})`;

}


document
    .getElementById(
        "colorPicker"
    )
    .addEventListener(
        "input",
        event => {

            const color =
                event.target.value;


            applyTheme(
                color
            );


            cryptoSave(
                "accent",
                color
            );

        }
    );


/* =========================================================
   MODAL
========================================================= */

function openTaskModal(index = -1) {

    editingIndex = index;

    const modal =
        document.getElementById("taskModal");

    const title =
        document.getElementById("modalTitle");

    const categorySelect =
        document.getElementById("categorySelect");

    const prioritySelect =
        document.getElementById("prioritySelect");

    const categoryValue =
        categorySelect.querySelector(".site-select-value");

    const priorityValue =
        prioritySelect.querySelector(".site-select-value");

    const categoryOptions =
        categorySelect.querySelectorAll(".site-select-popup button");

    const priorityOptions =
        prioritySelect.querySelectorAll(".site-select-popup button");


    if (index >= 0 && tasks[index]) {

        title.textContent =
            "Editar tarefa";


        document.getElementById("taskInput").value =
            tasks[index].text;


        /*
         * Categoria
         */

        const cat =
            tasks[index].cat || "Pessoal";

        categorySelect.dataset.value =
            cat;

        categoryOptions.forEach(option => {

            const selected =
                option.dataset.value === cat;

            option.classList.toggle(
                "selected",
                selected
            );

            if (selected) {

                categoryValue.textContent =
                    option.textContent.trim();

            }

        });


        /*
         * Prioridade
         */

        const priority =
            tasks[index].priority || "low";

        prioritySelect.dataset.value =
            priority;

        priorityOptions.forEach(option => {

            const selected =
                option.dataset.value === priority;

            option.classList.toggle(
                "selected",
                selected
            );

            if (selected) {

                priorityValue.textContent =
                    option.textContent.trim();

            }

        });

    } else {

        title.textContent =
            "Nova tarefa";


        document.getElementById("taskInput").value =
            "";


        /*
         * Categoria padrão
         */

        categorySelect.dataset.value =
            "Estudos";

        categoryValue.textContent =
            "Estudos";

        categoryOptions.forEach(option => {

            option.classList.toggle(
                "selected",
                option.dataset.value === "Estudos"
            );

        });


        /*
         * Prioridade padrão
         */

        prioritySelect.dataset.value =
            "low";

        priorityValue.textContent =
            "Baixa";

        priorityOptions.forEach(option => {

            option.classList.toggle(
                "selected",
                option.dataset.value === "low"
            );

        });

    }


    /*
     * Fecha qualquer dropdown aberto
     */

    categorySelect.classList.remove("open");
    prioritySelect.classList.remove("open");


    /*
     * ABRE O MODAL
     */

    modal.classList.add("open");


    setTimeout(() => {

        document
            .getElementById("taskInput")
            .focus();

    }, 100);

}


function closeTaskModal() {

    document
        .getElementById(
            "taskModal"
        )
        .classList.remove(
            "open"
        );


    editingIndex =
        -1;

}


/* =========================================================
   SALVAR TAREFA DO MODAL
========================================================= */
function saveTaskFromModal() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        showToast(
            "Digite uma tarefa."
        );

        return;

    }


    const categorySelect =
        document.getElementById("categorySelect");

    const prioritySelect =
        document.getElementById("prioritySelect");


    const cat =
        categorySelect.dataset.value ||
        "Estudos";


    const priority =
        prioritySelect.dataset.value ||
        "low";


    if (
        editingIndex >= 0 &&
        tasks[editingIndex]
    ) {

        tasks[editingIndex].text =
            text;

        tasks[editingIndex].cat =
            cat;

        tasks[editingIndex].priority =
            priority;

        tasks[editingIndex].updated =
            Date.now();


        showToast(
            "Tarefa atualizada."
        );

    } else {

        tasks.unshift({

            text,

            cat,

            priority,

            done: false,

            created:
                Date.now(),

            updated:
                Date.now()

        });


        showToast(
            "Tarefa adicionada."
        );

    }


    saveTasks();

    closeTaskModal();

    render();

}


/* =========================================================
   CONCLUIR
========================================================= */

function toggleTask(
    index
) {

    if (
        !tasks[index]
    ) {

        return;

    }


    tasks[index].done =
        !tasks[index].done;


    tasks[index].updated =
        Date.now();


    saveTasks();

    render();


    showToast(
        tasks[index].done
            ? "Tarefa concluída."
            : "Tarefa reaberta."
    );

}


/* =========================================================
   EXCLUIR
========================================================= */

function deleteTask(
    index
) {

    if (
        !tasks[index]
    ) {

        return;

    }


    const task =
        tasks[index];


    tasks.splice(
        index,
        1
    );


    saveTasks();

    render();


    showToast(
        `"${task.text}" removida.`
    );

}

function toggleSortMenu() {

    const isOpen =
        sortSelect.classList.contains(
            "open"
        );


    sortSelect.classList.toggle(
        "open",
        !isOpen
    );


    sortSelect.setAttribute(
        "aria-expanded",
        String(!isOpen)
    );

}


function closeSortMenu() {

    sortSelect.classList.remove(
        "open"
    );


    sortSelect.setAttribute(
        "aria-expanded",
        "false"
    );

}


sortSelect.addEventListener(
    "click",
    event => {

        const option =
            event.target.closest(
                ".sort-option"
            );


        if (option) {

            event.stopPropagation();

            const value =
                option.dataset.value;


            const label =
                option.textContent.trim();


            currentSort =
                value;


            sortCurrent.textContent =
                label;


            document
                .querySelectorAll(
                    ".sort-option"
                )
                .forEach(item => {

                    const active =
                        item.dataset.value ===
                        value;


                    item.classList.toggle(
                        "active",
                        active
                    );


                    item.setAttribute(
                        "aria-selected",
                        String(active)
                    );

                });


            closeSortMenu();

            render();

            return;

        }


        toggleSortMenu();

    }
);


/* =========================================================
   ACESSIBILIDADE DO DROPDOWN
========================================================= */

sortSelect.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            toggleSortMenu();

        }


        if (
            event.key === "Escape"
        ) {

            closeSortMenu();

            sortSelect.blur();

        }

    }
);


/* =========================================================

document.addEventListener(

/* =========================================================
   FILTRAR + ORDENAR
========================================================= */

function getVisibleTasks() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLocaleLowerCase(
                "pt-BR"
            )
            .trim();


    let result =
        tasks.filter(task => {

            const matchesFilter =
                currentFilter === "Todos" ||
                task.cat === currentFilter;


            const matchesSearch =
                !search ||
                task.text
                    .toLocaleLowerCase(
                        "pt-BR"
                    )
                    .includes(
                        search
                    );


            return (
                matchesFilter &&
                matchesSearch
            );

        });


    if (
        currentSort === "name"
    ) {

        result.sort(
            (a,b) =>
                a.text.localeCompare(
                    b.text,
                    "pt-BR",
                    {
                        sensitivity:
                            "base"
                    }
                )
        );

    }


    if (
        currentSort === "priority"
    ) {

        const weight = {

            high: 3,

            medium: 2,

            low: 1

        };


        result.sort(
            (a,b) =>
                weight[b.priority] -
                weight[a.priority]
        );

    }


    if (
        currentSort === "status"
    ) {

        result.sort(
            (a,b) =>
                Number(a.done) -
                Number(b.done)
        );

    }


    return result;

}


/* =========================================================
   TEXTO DE PRIORIDADE
========================================================= */

function priorityName(
    priority
) {

    if (
        priority === "high"
    ) {

        return "Alta";

    }


    if (
        priority === "medium"
    ) {

        return "Média";

    }


    return "Baixa";

}

edit.title =

        tasks.filter(

    const pending =
        total - done;


    document
        .getElementById(
            "totalCount"

        .textContent =
            total;


    document
        .getElementById(
            "pendingCount"
        )
        .textContent =

    document
        .getElementById(
            "doneCount"
        )
        .textContent =
            done;


    document
        .getElementById(
            "subtitle"

        .textContent =
            pending

let toastTimer = null;

    toast.classList.add(

/* =========================================================
   POMODORO
========================================================= */

const POMO_TOTAL =
    25 * 60;


let pomodoroTime =
    POMO_TOTAL;


let pomodoroInterval =
    null;


function updatePomodoro() {

    const minutes =
        Math.floor(
            pomodoroTime / 60
        );


    const seconds =
        pomodoroTime % 60;


    document
        .getElementById(
            "timer"
        )
        .textContent =
            `${minutes}:${
                seconds < 10
                    ? "0"
                    : ""
            }${seconds}`;


    const progress =
        (
            (POMO_TOTAL -
                pomodoroTime) /
            POMO_TOTAL
        ) * 100;


    document
        .getElementById(
            "timerCircle"
        )
        .style
        .setProperty(
            "--progress",
            `${progress}%`
        );

}


function togglePomodoro() {

    if (
        pomodoroInterval
    ) {

        clearInterval(
            pomodoroInterval
        );


        pomodoroInterval =
            null;


        document
            .getElementById(
                "pomoStart"
            )
            .textContent =
                "Continuar";


        return;

    }


    if (
        pomodoroTime <= 0
    ) {

        pomodoroTime =
            POMO_TOTAL;

    }


    document
        .getElementById(
            "pomoStart"
        )
        .textContent =
            "Pausar";


    pomodoroInterval =
        setInterval(
            () => {

                pomodoroTime--;

                updatePomodoro();


                if (
                    pomodoroTime <= 0
                ) {

                    clearInterval(
                        pomodoroInterval
                    );


                    pomodoroInterval =
                        null;


                    pomodoroTime =
                        POMO_TOTAL;


                    document
                        .getElementById(
                            "pomoStart"
                        )
                        .textContent =
                            "Iniciar";


                    updatePomodoro();


                    showToast(
                        "Pomodoro finalizado!"
                    );

                }

            },
            1000
        );

}


function resetPomodoro() {

    clearInterval(
        pomodoroInterval
    );


    pomodoroInterval =
        null;


    pomodoroTime =
        POMO_TOTAL;


    document
        .getElementById(
            "pomoStart"
        )
        .textContent =
            "Iniciar";


    updatePomodoro();

}


function addMinute() {

    pomodoroTime +=
        60;


    if (
        pomodoroTime >
        POMO_TOTAL
    ) {

        pomodoroTime =
            POMO_TOTAL;

    }


    updatePomodoro();

}

<script>
/* =========================================================
   SELECT PERSONALIZADO
   100% HTML/CSS/JS
========================================================= */

(function () {

    const selects = document.querySelectorAll(".site-select");

    selects.forEach(select => {

        const button = select.querySelector(".site-select-button");
        const valueText = select.querySelector(".site-select-value");
        const options = select.querySelectorAll(".site-select-popup button");

        button.addEventListener("click", function (event) {

            event.stopPropagation();

            // Fecha os outros
            selects.forEach(other => {
                if (other !== select) {
                    other.classList.remove("open");
                }
            });

            // Abre/fecha este
            select.classList.toggle("open");
        });


        options.forEach(option => {

            option.addEventListener("click", function (event) {

                event.stopPropagation();

                const value = option.dataset.value;
                const text = option.textContent.trim();

                // Atualiza texto
                valueText.textContent = text;

                // Marca selecionado
                options.forEach(item => {
                    item.classList.remove("selected");
                });

                option.classList.add("selected");

                // Guarda o valor
                select.dataset.value = value;

                // Fecha popup
                select.classList.remove("open");

                /*
                 * Eventos personalizados para o seu código
                 */

                select.dispatchEvent(
                    new CustomEvent("change", {
                        detail: {
                            value: value,
                            text: text
                        }
                    })
                );
            });

        });

    });


    /*
     * Clicar fora fecha qualquer popup
     */

    document.addEventListener("click", function () {

        selects.forEach(select => {
            select.classList.remove("open");
        });

    });


    /*
     * ESC fecha
     */

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            selects.forEach(select => {
                select.classList.remove("open");
            });

        }

    });

})();
</script>
