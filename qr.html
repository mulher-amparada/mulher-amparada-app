<!DOCTYPE html>
<html lang="pt-BR">

<head>



<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

    <meta
        name="description"
        content="Mulher Amparada é um projeto de tecnologia voltado à proteção, segurança e assistência em situações de emergência."
    >



<title>Mulher Amparada</title>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="stylesheet" href="qr-day.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="qr-night.css" media="(prefers-color-scheme: dark)">

</head>


<body>


<div class="background"></div>


<main class="app">


    <header class="header">

        <div class="logo">
            Mulher Amparada
        </div>

        <h1>
            Crie seu <span>QR Code</span>
        </h1>

        <p>
            Gere códigos QR rapidamente, copie o conteúdo
            ou salve a imagem para usar onde quiser.
        </p>

    </header>


    <!-- GERADOR -->

    <section class="card">

        <label
            class="label"
            for="text"
        >
            Conteúdo
        </label>

        <div class="input-wrap">

            <input
                id="text"
                type="text"
                autocomplete="off"
                placeholder="Digite um link ou texto..."
                onkeydown="handleKey(event)"
            >

        </div>


        <div class="buttons">

            <button
                class="primary"
                onclick="generate()"
            >
                Gerar QR
            </button>

            <button
                class="dark"
                onclick="clearAll()"
            >
                Limpar
            </button>

        </div>


        <div
            id="qrBox"
            class="qr-area"
        ></div>


        <div
            id="qrActions"
            class="qr-actions"
        >

            <button
                class="dark"
                onclick="downloadQR()"
            >
                Baixar QR
            </button>

            <button
                class="dark"
                onclick="copyText()"
            >
                Copiar texto
            </button>

        </div>

    </section>


    <!-- HISTÓRICO -->

    <section class="card">

        <div class="history-header">

            <h2>
                Histórico
            </h2>

            <span
                id="historyCount"
                class="history-count"
            >
                0 itens
            </span>

        </div>


        <div
            id="history"
            class="history"
        ></div>

    </section>


    <footer class="footer">

        Mulher Amparada

    </footer>


</main>


<div
    id="toast"
    class="toast"
></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

/* =========================================================
   ESTADO
========================================================= */

let qr = null;

const input =
    document.getElementById("text");

const qrBox =
    document.getElementById("qrBox");

const qrActions =
    document.getElementById("qrActions");

const historyBox =
    document.getElementById("history");

const historyCount =
    document.getElementById("historyCount");

const toast =
    document.getElementById("toast");


/* =========================================================
   GERAR
========================================================= */

function generate() {

    const text =
        input.value.trim();

    if (!text) {

        showToast("Digite algum conteúdo.");

        input.focus();

        return;
    }


    qrBox.innerHTML = "";

    qrBox.classList.add("visible");


    qr = new QRCode(qrBox, {

        text: text,

        width: 200,

        height: 200,

        colorDark: "#000000",

        colorLight: "#ffffff",

        correctLevel:
            QRCode.CorrectLevel.M

    });


    qrActions.classList.add("active");


    saveHistory(text);

    showToast("QR Code gerado.");
}


/* =========================================================
   ENTER
========================================================= */

function handleKey(event) {

    if (event.key === "Enter") {

        generate();
    }
}


/* =========================================================
   HISTÓRICO
========================================================= */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem("qrHistory") || "[]"
        );

    } catch {

        return [];
    }
}


function saveHistory(text) {

    let data =
        getHistory();


    data =
        data.filter(item => item !== text);


    data.unshift(text);


    data =
        data.slice(0, 20);


    localStorage.setItem(
        "qrHistory",
        JSON.stringify(data)
    );


    renderHistory();
}


function renderHistory() {

    const data =
        getHistory();


    historyBox.innerHTML = "";


    historyCount.textContent =
        `${data.length} ${
            data.length === 1
                ? "item"
                : "itens"
        }`;


    if (!data.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "history-empty";

        empty.textContent =
            "Os QR Codes gerados aparecerão aqui.";

        historyBox.appendChild(empty);

        return;
    }


    data.forEach(text => {

        const item =
            document.createElement("div");

        item.className =
            "item";


        const span =
            document.createElement("span");

        span.className =
            "item-text";

        span.textContent =
            text;


        const button =
            document.createElement("button");

        button.className =
            "smallBtn";

        button.textContent =
            "Usar";


        button.addEventListener(
            "click",
            () => {

                input.value = text;

                generate();

            }
        );


        item.appendChild(span);

        item.appendChild(button);

        historyBox.appendChild(item);

    });
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadQR() {

    const canvas =
        qrBox.querySelector("canvas");

    const img =
        qrBox.querySelector("img");


    if (!canvas && !img) {

        showToast("Gere um QR Code primeiro.");

        return;
    }


    const link =
        document.createElement("a");


    if (canvas) {

        link.href =
            canvas.toDataURL("image/png");

    } else {

        link.href =
            img.src;
    }


    link.download =
        "qr-code.png";


    document.body.appendChild(link);

    link.click();

    link.remove();


    showToast("QR Code salvo.");
}


/* =========================================================
   COPIAR
========================================================= */

async function copyText() {

    const text =
        input.value.trim();


    if (!text) {

        showToast("Não há texto para copiar.");

        return;
    }


    try {

        await navigator.clipboard.writeText(text);

        showToast("Texto copiado.");

    } catch {

        showToast(
            "Não foi possível copiar automaticamente."
        );
    }
}


/* =========================================================
   LIMPAR
========================================================= */

function clearAll() {

    input.value = "";

    qrBox.innerHTML = "";

    qrBox.classList.remove("visible");

    qrActions.classList.remove("active");

    localStorage.removeItem(
        "qrHistory"
    );

    renderHistory();

    input.focus();

    showToast("Tudo foi limpo.");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message) {

    clearTimeout(toastTimer);


    toast.textContent =
        message;


    toast.classList.add("show");


    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2200);
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderHistory();

</script>







</body>
</html>
