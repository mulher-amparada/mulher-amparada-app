name: Simular Safe Woman OS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  simulate:
    name: Android virtual + system.img modificada
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          CMDLINE_TOOLS="$(find "$SDK/cmdline-tools" \
            -mindepth 3 \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$CMDLINE_TOOLS")" >> "$GITHUB_PATH"

          "$CMDLINE_TOOLS" --version

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;aosp_atd;x86_64"

      - name: Encontrar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "Safe Woman Operational System" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Projeto: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Encontrar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          echo "APK: $PWD/$APK"
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"

      - name: Criar AVD
        shell: bash
        run: |
          set -e

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd \
            --force \
            --name SafeWomanOS \
            --package "system-images;android-35;aosp_atd;x86_64" \
            --device "pixel_2"

          emulator -list-avds

          if ! emulator -list-avds | grep -qx "SafeWomanOS"; then
            echo "::error::AVD SafeWomanOS não foi criado."
            exit 1
          fi

      - name: Localizar system.img
        id: system
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SYSTEM_IMAGE_DIR="$SDK/system-images/android-35/aosp_atd/x86_64"

          echo "Diretório:"
          echo "$SYSTEM_IMAGE_DIR"

          if [ ! -d "$SYSTEM_IMAGE_DIR" ]; then
            echo "::error::Diretório da system image não encontrado."
            exit 1
          fi

          echo
          echo "===== CONTEÚDO ====="

          find "$SYSTEM_IMAGE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          SYSTEM_IMG="$SYSTEM_IMAGE_DIR/system.img"

          if [ ! -f "$SYSTEM_IMG" ]; then
            echo "::error::system.img não encontrada."

            find "$SYSTEM_IMAGE_DIR" \
              -type f \
              -name '*.img' \
              -print

            exit 1
          fi

          echo
          echo "system.img:"
          ls -lh "$SYSTEM_IMG"

          echo "path=$SYSTEM_IMG" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas de imagem
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            e2fsprogs \
            android-sdk-libsparse-utils

          command -v debugfs
          command -v file
          command -v simg2img
          command -v img2simg

      - name: Modificar system.img
        shell: bash
        run: |
          set -e

          mkdir -p simulation/image

          ORIGINAL_SYSTEM="${{ steps.system.outputs.path }}"
          APK="${{ steps.apk.outputs.path }}"

          cp "$ORIGINAL_SYSTEM" \
            simulation/image/system-original.img

          echo
          echo "===== TIPO DA SYSTEM IMAGE ====="

          file "$ORIGINAL_SYSTEM"

          echo
          echo "===== TAMANHO ORIGINAL ====="

          ls -lh "$ORIGINAL_SYSTEM"

          echo
          echo "===== PREPARANDO IMAGEM ====="

          if file "$ORIGINAL_SYSTEM" | grep -qi "Android sparse image"; then

            echo "Imagem sparse detectada."

            simg2img \
              "$ORIGINAL_SYSTEM" \
              simulation/image/system.raw.img

          else

            echo "Imagem não-sparse detectada."

            cp \
              "$ORIGINAL_SYSTEM" \
              simulation/image/system.raw.img

          fi

          echo
          echo "===== SISTEMA DE ARQUIVOS ====="

          file simulation/image/system.raw.img

          echo
          echo "===== VERIFICANDO EXT4 ====="

          if ! sudo e2fsck -fn \
            simulation/image/system.raw.img; then

            echo "::warning::e2fsck retornou código diferente de zero."
          fi

          echo
          echo "===== CRIANDO DIRETÓRIOS ====="

          sudo debugfs -w \
            -R "mkdir /priv-app" \
            simulation/image/system.raw.img \
            || true

          sudo debugfs -w \
            -R "mkdir /priv-app/MulherAmparada" \
            simulation/image/system.raw.img

          echo
          echo "===== INSERINDO APK ====="

          sudo debugfs -w \
            -R "write $APK /priv-app/MulherAmparada/MulherAmparada.apk" \
            simulation/image/system.raw.img

          echo
          echo "===== VERIFICANDO APK ====="

          sudo debugfs \
            -R "ls -l /priv-app/MulherAmparada" \
            simulation/image/system.raw.img

          echo
          echo "===== AJUSTANDO PERMISSÕES ====="

          sudo debugfs -w \
            -R "set_inode_field /priv-app/MulherAmparada/MulherAmparada.apk mode 0100644" \
            simulation/image/system.raw.img

          sudo debugfs -w \
            -R "set_inode_field /priv-app/MulherAmparada/MulherAmparada.apk uid 0" \
            simulation/image/system.raw.img

          sudo debugfs -w \
            -R "set_inode_field /priv-app/MulherAmparada/MulherAmparada.apk gid 0" \
            simulation/image/system.raw.img

          echo
          echo "===== VERIFICAÇÃO FINAL DA IMAGEM ====="

          sudo debugfs \
            -R "ls -l /priv-app/MulherAmparada" \
            simulation/image/system.raw.img

          echo
          echo "===== RECRIANDO SYSTEM.IMG ====="

          if file "$ORIGINAL_SYSTEM" | grep -qi "Android sparse image"; then

            img2simg \
              simulation/image/system.raw.img \
              simulation/image/system.img

          else

            cp \
              simulation/image/system.raw.img \
              simulation/image/system.img

          fi

          echo
          echo "===== SYSTEM.IMG MODIFICADA ====="

          ls -lh \
            simulation/image/system.img

      - name: Substituir system.img do AVD
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SYSTEM_IMAGE_DIR="$SDK/system-images/android-35/aosp_atd/x86_64"

          MODIFIED="simulation/image/system.img"

          if [ ! -f "$MODIFIED" ]; then
            echo "::error::system.img modificada não encontrada."
            exit 1
          fi

          echo "Substituindo:"
          echo "$SYSTEM_IMAGE_DIR/system.img"

          cp \
            "$MODIFIED" \
            "$SYSTEM_IMAGE_DIR/system.img"

          echo
          echo "===== SYSTEM IMAGE FINAL ====="

          ls -lh \
            "$SYSTEM_IMAGE_DIR/system.img"

          echo
          echo "===== AVD ====="

          emulator -list-avds

      - name: Configurar aceleração KVM
        shell: bash
        run: |
          set -e

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          ls -l /dev/kvm || true

      - name: Iniciar Safe Woman OS
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          nohup emulator \
            -avd SafeWomanOS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -wipe-data \
            -no-snapshot \
            > simulation/emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "$EMULATOR_PID" > simulation/emulator.pid

          echo "PID: $EMULATOR_PID"

          echo
          echo "===== AGUARDANDO ADB ====="

          ADB_READY=false

          for i in {1..60}; do

            if adb get-state >/dev/null 2>&1; then
              ADB_READY=true
              echo "ADB disponível."
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulador encerrou."

              cat simulation/emulator.log || true

              exit 1
            fi

            echo "ADB aguardando — tentativa $i/60"

            sleep 2

          done

          if [ "$ADB_READY" != "true" ]; then
            echo "::error::ADB não ficou disponível."

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "===== BOOT ====="

          BOOT_COMPLETED=false

          for i in {1..120}; do

            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            echo "Boot: ${BOOT:-aguardando} — tentativa $i/120"

            if [ "$BOOT" = "1" ]; then
              BOOT_COMPLETED=true
              break
            fi

            sleep 2

          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android não terminou o boot."

            echo
            echo "===== LOG ====="

            cat simulation/emulator.log || true

            exit 1
          fi

          echo
          echo "Android iniciou."

          adb devices -l

      - name: Verificar app privilegiado
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          echo "===== UID ====="

          adb shell id

          echo
          echo "===== CAMINHO DO PACOTE ====="

          adb shell pm path com.mulheres \
            | tee simulation/pm-path.txt

          echo
          echo "===== PACOTES DO SISTEMA ====="

          adb shell pm list packages -s \
            | tee simulation/system-packages.txt

          echo
          echo "===== DUMPSYS ====="

          adb shell dumpsys package com.mulheres \
            | tee simulation/package-info.txt

          echo
          echo "===== VERIFICAÇÃO ====="

          if ! grep -q \
            '/system/priv-app/MulherAmparada/' \
            simulation/pm-path.txt; then

            echo "::error::Mulher Amparada não foi reconhecido em /system/priv-app."

            exit 1
          fi

          echo
          echo "=========================================="
          echo " MULHER AMPARADA ESTÁ EM PRIV-APP"
          echo "=========================================="

      - name: Verificar permissões privilegiadas
        shell: bash
        run: |
          set -e

          adb shell dumpsys package com.mulheres \
            > simulation/permissions.txt

          echo "===== PERMISSÕES ====="

          grep -A100 -B10 \
            "requested permissions" \
            simulation/permissions.txt \
            || true

          echo
          echo "===== PRIVILEGIADAS ====="

          grep -Ei \
            "granted=true|privileged|INSTALL|LOCATION|RECORD_AUDIO|READ_CONTACTS|CALL_PHONE" \
            simulation/permissions.txt \
            || true

      - name: Capturar tela
        shell: bash
        run: |
          set -e

          adb exec-out screencap -p \
            > simulation/boot-screenshot.png

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          echo "===== PACOTE ====="

          adb shell dumpsys package com.mulheres \
            || true

          echo
          echo "===== CAMINHO ====="

          adb shell pm path com.mulheres \
            || true

          echo
          echo "===== BOOT ====="

          adb shell getprop sys.boot_completed \
            || true

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            || true

          adb shell getprop ro.debuggable \
            || true

          echo
          echo "===== VERITY ====="

          adb shell getprop ro.boot.verifiedbootstate \
            || true

      - name: Parar emulador
        if: always()
        run: |
          if [ -f simulation/emulator.pid ]; then
            kill "$(cat simulation/emulator.pid)" 2>/dev/null || true
          fi

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Safe-Woman-OS-Simulacao
          path: simulation/
          if-no-files-found: warn