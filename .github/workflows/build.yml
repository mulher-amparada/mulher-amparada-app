
name: Mulher Amparada - Android 17

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Código-fonte do app = Mulher Amparada/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar e assinar APK
    runs-on: ubuntu-latest

    env:
      PROJECT_DIR: 'Código-fonte do app = Mulher Amparada'

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager --install "platforms;android-37" "platform-tools"
          sdkmanager --licenses

      - name: Localizar Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "wrapper=$GITHUB_WORKSPACE/$PROJECT_DIR/gradlew" >> "$GITHUB_OUTPUT"
            echo "project=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "gradlew" ]; then
            echo "wrapper=$GITHUB_WORKSPACE/gradlew" >> "$GITHUB_OUTPUT"
            echo "project=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Gradle Wrapper não encontrado."
            exit 1
          fi

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "${{ steps.gradle.outputs.wrapper }}"

          bash "${{ steps.gradle.outputs.wrapper }}" \
            -p "${{ steps.gradle.outputs.project }}" \
            --no-daemon assembleRelease

      - name: Verificar secrets de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::O secret $name não está configurado."
              exit 1
            fi
          done

      - name: Decodificar keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/mulher-amparada.p12"

          chmod 600 "$RUNNER_TEMP/mulher-amparada.p12"

      - name: Assinar APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*androidTest*' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK Release foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artefatos"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::apksigner não encontrado no Android SDK."
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/mulher-amparada.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk" \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: mulher-amparada-android-17
          path: artefatos/mulher-amparada-release.apk
          if-no-files-found: error
          retention-days: 14
