<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Mulher Amparada é um projeto de tecnologia voltado à proteção, segurança e assistência em situações de emergência."
    >

<title>Mulher Amparada • Fitness</title>

<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-display: swap;
}


/* =========================================================
   VARIÁVEIS — MODO CLARO
========================================================= */

:root {

    --accent: #ff5f91;
    --accent-light: #ff9fbd;

    --surface: rgba(0,0,0,.045);
    --surface-strong: rgba(0,0,0,.065);
    --surface-soft: rgba(0,0,0,.025);

    --border: rgba(0,0,0,.09);
    --border-light: rgba(0,0,0,.14);

    --text: #171717;
    --muted: rgba(0,0,0,.55);
    --muted-strong: rgba(0,0,0,.72);

    --green: #22a866;
    --red: #ef4055;

    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 17px;

    --shadow:
        0 25px 70px rgba(0,0,0,.12);

    --glow:
        0 0 45px rgba(255,95,145,.12);
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        "Quicksand",
        sans-serif;

    -webkit-tap-highlight-color: transparent;

    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}


html {
    scroll-behavior: smooth;
}


body {

    min-height: 100vh;

    color: var(--text);

    background: transparent;

    overflow-x: hidden;

    margin-top: 2.5%;
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes pop {

    from {
        opacity: 0;

        transform:
            scale(.92)
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes glow {

    0%,
    100% {

        box-shadow:
            0 0 25px
            rgba(255,95,145,.08);
    }

    50% {

        box-shadow:
            0 0 45px
            rgba(255,95,145,.17);
    }
}


/* =========================================================
   TOPO
========================================================= */

.topo {

    position: relative;

    width: min(
        100%,
        900px
    );

    margin: auto;

    padding:
        38px
        22px
        20px;

    animation:
        pageIn .55s ease both;
}


.topo::after {

    content: "";

    position: absolute;

    left: 22px;
    right: 22px;
    bottom: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--border-light),
            transparent
        );
}


.logo {

    display: inline-block;

    font-size: 32px;

    font-weight: 700;

    letter-spacing: -.8px;

    background:
        linear-gradient(
            110deg,
            #222 10%,
            var(--accent-light) 55%,
            var(--accent) 100%
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


.sub {

    margin-top: 7px;

    color: var(--muted);

    font-size: 13px;

    letter-spacing: .2px;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: min(
        100%,
        900px
    );

    margin: auto;

    padding:
        22px
        22px
        120px;

    animation:
        pageIn .6s .05s ease both;
}


/* =========================================================
   CARD
========================================================= */

.card {

    position: relative;

    padding: 23px;

    margin-bottom: 16px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-xl);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.96),
            rgba(248,248,248,.88)
        );

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.07);

    overflow: hidden;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}


.card:hover {

    border-color:
        rgba(0,0,0,.14);

    transform:
        translateY(-2px);
}


/* =========================================================
   TÍTULOS
========================================================= */

h2 {

    margin-bottom: 17px;

    font-size: 21px;

    font-weight: 700;

    letter-spacing: -.3px;

    color: var(--text);
}


h3 {

    margin-bottom: 10px;

    font-size: 16px;

    color: var(--text);
}


p {

    color: var(--muted);

    line-height: 1.55;
}


/* =========================================================
   PROGRESSO
========================================================= */

.progress {

    position: relative;

    width: 100%;

    height: 12px;

    margin-top: 17px;

    overflow: hidden;

    border:
        1px solid
        rgba(0,0,0,.08);

    border-radius: 999px;

    background:
        rgba(0,0,0,.065);

    box-shadow:
        inset 0 1px 3px
        rgba(0,0,0,.10);
}


.bar {

    position: relative;

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent-light)
        );

    box-shadow:
        0 0 22px
        rgba(255,95,145,.35);

    transition:
        width .5s
        cubic-bezier(.2,.8,.2,1);
}


.bar::after {

    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 35px;
    height: 100%;

    border-radius: inherit;

    background:
        rgba(255,255,255,.45);

    filter: blur(5px);

    opacity: .7;
}


/* =========================================================
   STATS
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 17px;
}


.stat {

    position: relative;

    padding: 16px 10px;

    text-align: center;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-md);

    background:
        rgba(0,0,0,.025);

    transition:
        .22s ease;
}


.stat:hover {

    background:
        var(--surface);

    transform:
        translateY(-2px);
}


.stat h1 {

    font-size: 22px;

    color: var(--text);

    letter-spacing: -.5px;
}


.stat span {

    display: block;

    margin-top: 4px;

    color: var(--muted);

    font-size: 11px;
}


/* =========================================================
   BOTÕES
========================================================= */

button {

    width: 100%;

    margin-top: 10px;

    padding: 15px 18px;

    border:
        1px solid
        rgba(0,0,0,.06);

    border-radius: 160px;

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent-light)
        );

    box-shadow:
        0 10px 30px
        rgba(255,95,145,.18);

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}


button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 14px 35px
        rgba(255,95,145,.25);

    filter:
        brightness(1.05);
}


button:active {

    transform:
        scale(.97);
}


.btn2 {

    color:
        rgba(0,0,0,.72);

    background:
        rgba(0,0,0,.045);

    border-color:
        var(--border);

    box-shadow: none;
}


.btn2:hover {

    background:
        rgba(0,0,0,.08);

    box-shadow: none;
}


.btn-danger {

    background:
        linear-gradient(
            135deg,
            #ef4055,
            #ff6879
        );

    color: #ffffff;

    box-shadow:
        0 10px 30px
        rgba(239,64,85,.18);
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    margin-top: 11px;

    padding: 15px 16px;

    outline: none;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-md);

    color: #171717;

    background:
        rgba(0,0,0,.035);

    font-size: 14px;

    transition:
        .2s ease;
}


input::placeholder {

    color:
        rgba(0,0,0,.38);
}


input:focus {

    border-color:
        rgba(255,95,145,.45);

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 0 0 4px
        rgba(255,95,145,.07);
}


/* =========================================================
   EXERCÍCIO
========================================================= */

.exercicio {

    position: relative;

    padding: 20px;

    margin-top: 15px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-lg);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.92),
            rgba(245,245,245,.82)
        );

    overflow: hidden;
}


.exercicio::before {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -50px;
    top: -50px;

    border-radius: 50%;

    background:
        var(--accent);

    opacity: .08;

    filter: blur(25px);
}


.timer {

    position: relative;

    margin-top: 15px;

    text-align: center;

    font-size: 54px;

    font-weight: 700;

    letter-spacing: -2px;

    background:
        linear-gradient(
            120deg,
            #222,
            var(--accent)
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 35px
        rgba(255,95,145,.10);
}


/* =========================================================
   CONQUISTAS
========================================================= */

.conquista {

    position: relative;

    padding: 15px 16px;

    margin-top: 9px;

    border:
        1px solid var(--border);

    border-left:
        3px solid var(--accent);

    border-radius:
        15px;

    background:
        rgba(0,0,0,.025);

    transition:
        .2s ease;
}


.conquista:hover {

    background:
        rgba(0,0,0,.055);

    transform:
        translateX(3px);
}


.conquista b {

    color: #171717;
}


/* =========================================================
   POPUP
========================================================= */

.popup {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(245,245,245,.82);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    z-index: 999;
}


.popup-box {

    position: relative;

    width: 100%;

    max-width: 380px;

    padding: 28px 22px;

    text-align: center;

    border:
        1px solid var(--border-light);

    border-radius:
        var(--radius-xl);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(244,244,244,.97)
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.18),
        var(--glow);

    animation:
        pop .28s ease;
}


.popup-box h2 {

    margin-bottom: 8px;

    color: var(--text);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 35px;

    text-align: center;

    color:
        rgba(0,0,0,.32);

    font-size: 11px;

    letter-spacing: .2px;
}


/* =========================================================
   IMAGENS / SVG
========================================================= */

img {

    width: 24px;

    height: 24px;

    object-fit: cover;

    flex-shrink: 0;

    border-radius: 8px;
}


svg {

    width: 22px;

    height: 22px;

    flex-shrink: 0;
}


/* =========================================================
   SELEÇÃO
========================================================= */

::selection {

    color: #ffffff;

    background:
        rgba(255,95,145,.45);
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 600px) {

    .topo {

        padding:
            30px
            16px
            18px;
    }

    .container {

        padding:
            18px
            14px
            110px;
    }

    .logo {

        font-size: 28px;
    }

    .card {

        padding: 18px;

        border-radius: 23px;
    }

    .stats {

        gap: 7px;
    }

    .stat {

        padding:
            14px 7px;
    }

    .stat h1 {

        font-size: 19px;
    }

    .timer {

        font-size: 48px;
    }
}


@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;

        scroll-behavior: auto !important;
    }
}

</style>



</head>

<body>

<div class="bg">
  <div class="bola b1"></div>
  <div class="bola b2"></div>
</div>

<!-- TOPO -->

<div class="topo">

  <div class="logo">


    Rotina gamificada:
  </div>
  
</div>

<!-- CONTAINER -->

<div class="container">

  <!-- PROGRESSO -->

  <div class="card">



    <div class="progress">
      <div class="bar" id="barraXP"></div>
    </div>

    <div class="stats">

      <div class="stat">
        <h1 id="xpTexto">0</h1>
        <span>XP</span>
      </div>

      <div class="stat">
        <h1 id="nivelTexto">1</h1>
        <span>Nível</span>
      </div>

      <div class="stat">
        <h1 id="streakTexto">0</h1>
        <span>Streak</span>
      </div>

    </div>

  </div>

  <!-- TREINO -->

  <div class="card">

    <h2>  <img src="17.svg" alt="icone"/> Treino</h2>

    <button onclick="iniciarTreinoNivel('Iniciante')">
 Iniciante
    </button>

    <button onclick="iniciarTreinoNivel('Intermediário')">
 Intermediário
    </button>

    <button onclick="iniciarTreinoNivel('Avançado')">
 Avançado
    </button>

    <div class="exercicio">

      <h3 id="nomeEx">
        Nenhum exercício iniciado
      </h3>

      <p id="descricaoEx">
        Escolha um nível para começar
      </p>

      <div class="timer" id="tempo">
        30
      </div>

    </div>

  </div>

  <!-- HIDRATAÇÃO -->

  <div class="card">

    <h2>  <img src="18.svg" alt="icone"/> Hidratação</h2>

    <button onclick="beber('agua')">
      Beber água
    </button>

    <button class="btn2" onclick="beber('refri')">
      Refrigerante
    </button>

  </div>

  <!-- ALIMENTAÇÃO -->

  <div class="card">

    <h2>  <img src="19.svg" alt="icone"/> Alimentação</h2>

    <button onclick="comer('saudavel')">
      Comida saudável
    </button>

    <button class="btn2" onclick="comer('fast')">
      Fast food
    </button>

  </div>

  <!-- PESO -->

  <div class="card">

    <h2>  <img src="20.svg" alt="icone"/> Peso</h2>

    <input
      id="peso"
      type="number"
      placeholder="Digite seu peso"
    >

    <button onclick="salvarPeso()">
      Salvar peso
    </button>

    <p id="pesoTexto" style="margin-top:15px;"></p>

  </div>

  <!-- CONQUISTAS -->

  <div class="card">

    <h2>  <img src="21.svg" alt="icone"/>
    Conquistas</h2>

    <div id="conquistas"></div>

  </div>

  <!-- RESET -->

  <button
    class="btn-danger"
    onclick="resetarDados()"
  >
 Resetar tudo
  </button>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

  <div class="popup-box">

    <h2 id="pt"></h2>

    <p id="px"></p>

    <button onclick="fechar()">
      OK
    </button>

  </div>

</div>

<script>

/* ========================= */
/* DADOS */
/* ========================= */

let xp =
parseInt(Cripto.carregar("xp")) || 0;

let nivel =
parseInt(Cripto.carregar("nivel")) || 1;

let streak =
parseInt(Cripto.carregar("streak")) || 0;

let conquistas =
JSON.parse(
  Cripto.carregar("conquistas") || "[]"
);

/* ========================= */
/* CONQUISTAS */
/* ========================= */

let listaConquistas = [

{
id:"nivel2",
nome:"Subindo 🚀",
desc:"Chegou ao nível 2"
},

{
id:"nivel5",
nome:"Focada 🔥",
desc:"Chegou ao nível 5"
},

{
id:"desafio1",
nome:"Primeiro desafio 🎯",
desc:"Concluiu um desafio"
}

];

function ganharConquista(id){

  if(conquistas.includes(id)) return;

  conquistas.push(id);

  Cripto.salvar(
    "conquistas",
    JSON.stringify(conquistas)
);

  let c =
  listaConquistas.find(c=>c.id===id);

  popup(
    "🏆 Nova conquista!",
    c.nome + " • " + c.desc
  );

  renderConquistas();
}

function renderConquistas(){

  let div =
  document.getElementById("conquistas");

  div.innerHTML = "";

  if(conquistas.length === 0){

    div.innerHTML = `
      <p>
        Nenhuma conquista ainda 😢
      </p>
    `;

    return;
  }

  conquistas.forEach(id=>{

    let c =
    listaConquistas.find(x=>x.id===id);

    div.innerHTML += `
      <div class="conquista">
        <b>${c.nome}</b>
        <br>
        <small>${c.desc}</small>
      </div>
    `;
  });
}

/* ========================= */
/* TREINO */
/* ========================= */

let exercicios = {

"Iniciante":[
"Caminhada leve",
"Agachamento",
"Polichinelo"
],

"Intermediário":[
"Corrida",
"Flexão",
"Abdominal"
],

"Avançado":[
"Sprint",
"Burpee",
"HIIT pesado"
]

};

let lista = [];
let atual = 0;
let tempo = 30;
let intervalo;

function iniciarTreinoNivel(nivelEscolhido){

  lista =
  exercicios[nivelEscolhido];

  atual = 0;

  proximo();
}

function proximo(){

  if(atual >= lista.length){

    ganharXP(20);

    streak++;

    salvar();

    popup(
      "Treino concluído 💪",
      "Você foi incrível!"
    );

    atualizarUI();

    return;
  }

  document.getElementById(
    "nomeEx"
  ).innerText = lista[atual];

  document.getElementById(
    "descricaoEx"
  ).innerText =
  "Continue firme ✨";

  iniciarContagem();
}

function iniciarContagem(){

  clearInterval(intervalo);

  tempo = 30;

  document.getElementById(
    "tempo"
  ).innerText = tempo;

  intervalo = setInterval(()=>{

    tempo--;

    document.getElementById(
      "tempo"
    ).innerText = tempo;

    if(tempo <= 0){

      clearInterval(intervalo);

      atual++;

      popup(
        "Boa 🔥",
        "Próximo exercício!"
      );

      setTimeout(proximo,1200);
    }

  },1000);
}

/* ========================= */
/* XP */
/* ========================= */

function ganharXP(q){

  xp += q;

  if(xp >= nivel * 100){

    xp = 0;

    nivel++;

    popup(
      "🚀 Novo nível!",
      "Agora você está no nível " + nivel
    );

    if(nivel === 2)
    ganharConquista("nivel2");

    if(nivel === 5)
    ganharConquista("nivel5");
  }

  salvar();

  atualizarUI();
}

/* ========================= */
/* HIDRATAÇÃO */
/* ========================= */

function beber(tipo){

  if(tipo === "agua"){

    ganharXP(5);

    popup(
      "Boa 💧",
      "Hidratação perfeita!"
    );

  }else{

    popup(
      "Hmm 😅",
      "Evite exageros!"
    );
  }
}

/* ========================= */
/* ALIMENTAÇÃO */
/* ========================= */

function comer(tipo){

  if(tipo === "saudavel"){

    ganharXP(5);

    popup(
      "Perfeito 💚",
      "Ótima escolha!"
    );

  }else{

    popup(
      "Tudo bem 👍",
      "Mas tente equilibrar."
    );
  }
}

/* ========================= */
/* PESO */
/* ========================= */

function salvarPeso(){

  let p =
  document.getElementById("peso").value;

  if(!p){

    popup(
      "Ops 😅",
      "Digite um peso válido!"
    );

    return;
  }

  Cripto.salvar(
    "peso",
    p
);

  document.getElementById(
    "pesoTexto"
  ).innerText =
  "Peso atual: " + p + " kg";

  popup(
    "Peso salvo 💾",
    "Atualizado com sucesso!"
  );
}

/* ========================= */
/* RESET */
/* ========================= */

let confirmarReset = false;

function resetarDados(){

  if(!confirmarReset){

    confirmarReset = true;

    popup(
      "⚠️ Atenção",
      "Clique novamente para confirmar."
    );

    setTimeout(()=>{
      confirmarReset = false;
    },3000);

    return;
  }

  Cripto.limparTudo();

  xp = 0;
  nivel = 1;
  streak = 0;
  conquistas = [];

  atualizarUI();

  renderConquistas();

  document.getElementById(
    "pesoTexto"
  ).innerText = "";

  popup(
    "Dados apagados 🗑️",
    "Tudo foi resetado."
  );
}

/* ========================= */
/* UI */
/* ========================= */

function atualizarUI(){

  document.getElementById(
    "xpTexto"
  ).innerText = xp;

  document.getElementById(
    "nivelTexto"
  ).innerText = nivel;

  document.getElementById(
    "streakTexto"
  ).innerText = streak;

  let porcent =
  (xp / (nivel * 100)) * 100;

  document.getElementById(
    "barraXP"
  ).style.width =
  porcent + "%";
}

/* ========================= */
/* POPUP */
/* ========================= */

function popup(t,x){

  document.getElementById(
    "pt"
  ).innerText = t;

  document.getElementById(
    "px"
  ).innerText = x;

  document.getElementById(
    "popup"
  ).style.display = "flex";
}

function fechar(){

  document.getElementById(
    "popup"
  ).style.display = "none";
}

/* ========================= */
/* SALVAR */
/* ========================= */
function salvar(){

    Cripto.salvar(
        "xp",
        xp
    );

    Cripto.salvar(
        "nivel",
        nivel
    );

    Cripto.salvar(
        "streak",
        streak
    );
}

/* ========================= */
/* LOAD */
/* ========================= */

window.onload = ()=>{

  atualizarUI();

  renderConquistas();

  let p =
Cripto.carregar("peso");

  if(p){

    document.getElementById(
      "pesoTexto"
    ).innerText =
    "Peso atual: " + p + " kg";
  }
};

</script>

</body>
</html>
