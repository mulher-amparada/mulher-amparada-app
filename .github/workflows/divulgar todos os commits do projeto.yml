name: Atualizar total de commits

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-commits:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar todo o histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar total de commits
        run: |
          TOTAL=$(git rev-list --all --count)

          python3 <<PY
          from pathlib import Path
          import re

          arquivo = Path("README.md")
          texto = arquivo.read_text(encoding="utf-8")

          texto = re.sub(
              r"## Commits do projeto =.*",
              f"## Commits do projeto = {TOTAL}",
              texto,
              count=1
          )

          arquivo.write_text(texto, encoding="utf-8")
          PY

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar total de commits"
            git push
          fi