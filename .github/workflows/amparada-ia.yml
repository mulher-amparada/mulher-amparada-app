name: Amparada IA - testes e inferência Python

on:
  push:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
  pull_request:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  test-python:
    name: Testes, treinamento e inferência Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Amparada IA
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Amparada IA/requirements.txt"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Treinar modelo por caracteres
        run: |
          python -m src.amparada_ia.train \
            --steps 5 --block-size 16 --device cpu \
            --output runs/ci-char.pt

      - name: Avaliar checkpoint
        run: |
          python -m src.amparada_ia.evaluate \
            --checkpoint runs/ci-char.pt --batches 2 --device cpu

      - name: Testar geração
        run: |
          python -m src.amparada_ia.generate \
            --checkpoint runs/ci-char.pt --prompt "Respeito" \
            --tokens 8 --device cpu
