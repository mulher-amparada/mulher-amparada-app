name: 🧹 Limpar raiz da branch code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar branch code
        uses: actions/checkout@v4
        with:
          ref: code
          fetch-depth: 1

      - name: 🧹 Apagar arquivos da raiz
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -mindepth 1 -type l -delete

      - name: 💾 Salvar alterações
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "🧹 Limpar arquivos da raiz da branch code"
            git push origin HEAD:code
          else
            echo "A raiz já está limpa."
          fi