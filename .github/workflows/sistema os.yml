name: Baixar envsetup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Baixar build/envsetup.sh
        run: |
          mkdir -p "Safe Woman Operational System/build"

          curl -L \
            https://android.googlesource.com/platform/build/+/refs/heads/main/envsetup.sh?format=TEXT \
            | base64 -d \
            > "Safe Woman Operational System/build/envsetup.sh"

      - name: Salvar na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Safe Woman Operational System/build/envsetup.sh"

          git commit \
            -m "Adicionar build/envsetup.sh do AOSP" \
            || echo "Nenhuma alteração para commit"

          git push origin HEAD:main