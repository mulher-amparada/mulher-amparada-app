name: Importar componentes do Android 17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-componentes-android17
  cancel-in-progress: false

jobs:
  importar:
    name: Importar componentes AOSP Android 17
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar o repositório Safe Woman
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Baixar componentes da branch Android 17
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/aosp-components

          while IFS='|' read -r caminho repositorio; do
            [[ -z "$caminho" ]] && continue

            destino="/tmp/aosp-components/$caminho"
            mkdir -p "$(dirname "$destino")"

            echo "Baixando $caminho ..."
            git clone \
              --depth 1 \
              --branch android17-release \
              "https://android.googlesource.com/$repositorio" \
              "$destino"
          done <<'COMPONENTES'
          device/google/cuttlefish|device/google/cuttlefish
          frameworks/base|platform/frameworks/base
          packages/apps/ManagedProvisioning|platform/packages/apps/ManagedProvisioning
          packages/apps/Settings|platform/packages/apps/Settings
          packages/apps/Launcher3|platform/packages/apps/Launcher3
          packages/modules/Permission|platform/packages/modules/Permission
          packages/modules/NetworkStack|platform/packages/modules/NetworkStack
          packages/modules/HealthFitness|platform/packages/modules/HealthFitness
          system/sepolicy|platform/system/sepolicy
          system/core|platform/system/core
          COMPONENTES

      - name: Copiar todos os arquivos dos componentes
        shell: bash
        run: |
          set -euo pipefail

          destino="Safe Woman Operational System"

          mkdir -p "$destino"

          # Copia o conteúdo dos repositórios, mas não os metadados Git
          # internos de cada clone. Assim, os diretórios serão arquivos
          # normais do repositório Safe Woman, e não submódulos Git.
          rsync -a --exclude='.git' /tmp/aosp-components/ "$destino/"

      - name: Configurar Git LFS para arquivos grandes
        shell: bash
        run: |
          set -euo pipefail

          git lfs install

          while IFS= read -r -d '' arquivo; do
            relativo="${arquivo#Safe Woman Operational System/}"
            git lfs track "Safe Woman Operational System/$relativo"
          done < <(
            find "Safe Woman Operational System" -type f -size +90M -print0
          )

          git add .gitattributes

      - name: Registrar e enviar os componentes para a main
        shell: bash
        run: |
          set -euo pipefail

          git add -- "Safe Woman Operational System"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para registrar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Importa componentes AOSP do Android 17"

          # Integra commits que chegaram à main durante a execução,
          # evitando rejeição por non-fast-forward. Conflitos interrompem
          # o workflow; nenhum arquivo remoto é sobrescrito à força.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
