name: Executar Main Julia

on:
  push:
    branches:
      - main
    paths:
      - 'src/main.jl'
      - 'Project.toml'
      - 'Manifest.toml'
      - '.github/workflows/main-julia.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-julia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-julia:
    name: Executar src/main.jl
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Verificar arquivo principal
        run: |
          set -eu

          if [ ! -f src/main.jl ]; then
            echo "Erro: src/main.jl nao encontrado."
            exit 1
          fi

      - name: Instalar dependencias Julia
        run: |
          julia --startup-file=no -e '
            using Pkg

            Pkg.add([
              "CSV",
              "DataFrames",
              "Plots"
            ])
          '

      - name: Executar programa
        env:
          GKSwstype: "100"
        run: |
          julia --startup-file=no src/main.jl

      - name: Disponibilizar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ligue180-2019
          path: |
            dados/brutos/ligue180-2019.csv
            dados/processados/ligue180-2019-processado.csv
            relatorios/graficos/ligue180-2019.png
          if-no-files-found: warn
          retention-days: 30