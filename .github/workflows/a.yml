name: Simular Safe Woman OS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  simulate:
    name: Android virtual + app privilegiado
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Encontrar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "Safe Woman Operational System" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Projeto: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Encontrar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK: $APK"
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"

      - name: Criar AVD
        shell: bash
        run: |
          set -e

          echo "no" | avdmanager create avd \
            --force \
            --name SafeWomanOS \
            --package "system-images;android-35;default;x86_64" \
            --device "pixel_2"

      - name: Iniciar Android
        shell: bash
        run: |
          mkdir -p simulation

          nohup emulator \
            -avd SafeWomanOS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -wipe-data \
            -no-snapshot \
            > simulation/emulator.log 2>&1 &

          echo $! > simulation/emulator.pid

          adb wait-for-device

          echo "Aguardando boot..."

          for i in {1..90}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            if [ "$BOOT" = "1" ]; then
              echo "Android iniciou."
              break
            fi

            sleep 2
          done

          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "::error::Android não terminou o boot."
            cat simulation/emulator.log || true
            exit 1
          fi

      - name: Obter acesso root
        shell: bash
        run: |
          set -e

          adb root

          sleep 3

          adb wait-for-device

          echo "UID:"
          adb shell id

      - name: Tornar /system gravável
        shell: bash
        run: |
          set -e

          adb disable-verity || true
          adb reboot

          adb wait-for-device

          for i in {1..60}; do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done

          adb root
          sleep 3

          adb remount

          echo "Montagem:"
          adb shell mount | grep system || true

      - name: Instalar como aplicativo privilegiado
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.path }}"

          adb shell mkdir -p /system/priv-app/MulherAmparada

          adb push "$APK" \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          adb shell chmod 755 \
            /system/priv-app/MulherAmparada

          adb shell chmod 644 \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          echo "APK colocado em /system/priv-app."

      - name: Reiniciar Android
        shell: bash
        run: |
          adb reboot

          adb wait-for-device

          for i in {1..90}; do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            if [ "$BOOT" = "1" ]; then
              echo "Android iniciou novamente."
              break
            fi

            sleep 2
          done

          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "::error::Android não terminou o segundo boot."
            exit 1
          fi

      - name: Verificar se é aplicativo do sistema
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          adb shell pm path com.mulheres \
            | tee simulation/pm-path.txt

          adb shell dumpsys package com.mulheres \
            | tee simulation/package-info.txt

          echo
          echo "===== SYSTEM APPS ====="

          adb shell pm list packages -s \
            | tee simulation/system-packages.txt

          echo
          echo "===== PRIV-APP ====="

          adb shell pm path com.mulheres \
            | grep '/system/priv-app/' \
            | tee simulation/priv-app-check.txt

          if ! grep -q '/system/priv-app/' simulation/priv-app-check.txt; then
            echo "::error::Mulher Amparada NÃO está em /system/priv-app."
            exit 1
          fi

          echo "OK: Mulher Amparada é priv-app."

      - name: Verificar permissões
        shell: bash
        run: |
          set -e

          adb shell dumpsys package com.mulheres \
            > simulation/permissions.txt

          echo "===== PERMISSÕES DO APLICATIVO ====="

          grep -A100 -B10 \
            "requested permissions" \
            simulation/permissions.txt \
            || true

          echo
          echo "===== PERMISSÕES PRIVILEGIADAS ====="

          grep -Ei \
            "granted=true|privileged|INSTALL|LOCATION|RECORD_AUDIO|READ_CONTACTS|CALL_PHONE" \
            simulation/permissions.txt \
            || true

      - name: Capturar tela inicial
        shell: bash
        run: |
          mkdir -p simulation

          adb exec-out screencap -p \
            > simulation/boot-screenshot.png

      - name: Abrir gaveta de aplicativos
        shell: bash
        run: |
          # Garante que o launcher esteja na tela.
          adb shell input keyevent KEYCODE_HOME

          sleep 3

          # Desliza de baixo para cima para abrir a gaveta.
          adb shell input swipe \
            540 1800 \
            540 500 \
            700

          sleep 3

          adb exec-out screencap -p \
            > simulation/app-drawer.png

      - name: Verificar presença na gaveta
        shell: bash
        run: |
          adb shell pm list packages \
            | tee simulation/all-packages.txt

          if grep -q "com.mulheres" simulation/all-packages.txt; then
            echo "Mulher Amparada está instalada."
          else
            echo "::error::Mulher Amparada não está instalada."
            exit 1
          fi

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          echo "===== PACOTE ====="
          adb shell dumpsys package com.mulheres || true

          echo
          echo "===== CAMINHO ====="
          adb shell pm path com.mulheres || true

          echo
          echo "===== BOOT ====="
          adb shell getprop sys.boot_completed || true

      - name: Parar emulador
        if: always()
        run: |
          if [ -f simulation/emulator.pid ]; then
            kill "$(cat simulation/emulator.pid)" 2>/dev/null || true
          fi

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Safe-Woman-OS-Simulacao
          path: simulation/
          if-no-files-found: warn