name: Mulher Amparada Agent

on:
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: Ação do agente
        required: true
        type: choice
        options:
          - executar-workflow
          - dependabot
      workflow:
        description: Arquivo do workflow em .github/workflows
        required: false
        default: automations.yml
        type: string
      branch:
        description: Branch de destino
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mulher-amparada-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-openssl-dev libssl-dev

      - name: Preparar chave privada
        env:
          PRIVATE_KEY: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_KEY:-}" ]]; then
            echo "::error::O secret MULHER_AMPARADA_PRIVATE_KEY está vazio ou indisponível."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/private-key.pem"

          if [[ "$PRIVATE_KEY" == *"-----BEGIN"* ]]; then
            printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi

          grep -q -- "-----BEGIN .*PRIVATE KEY-----" "$KEY_FILE"
          grep -q -- "-----END .*PRIVATE KEY-----" "$KEY_FILE"

          echo "MULHER_AMPARADA_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Compilar agente C++
        run: |
          set -euo pipefail

          g++ -std=c++17 -O2 -Wall -Wextra \
            tools/github_agent.cpp \
            -o github_agent \
            -lcurl -lssl -lcrypto

      - name: Executar agente
        env:
          MULHER_AMPARADA_PRIVATE_KEY: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
          MULHER_AMPARADA_PRIVATE_KEY_FILE: ${{ env.MULHER_AMPARADA_PRIVATE_KEY_FILE }}
          MULHER_AMPARADA_APP_ID: ${{ secrets.MULHER_AMPARADA_APP_ID }}
          MULHER_AMPARADA_INSTALLATION_ID: ${{ secrets.MULHER_AMPARADA_INSTALLATION_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${MULHER_AMPARADA_APP_ID:-}" ]]; then
            echo "::error::Secret MULHER_AMPARADA_APP_ID ausente."
            exit 1
          fi

          if [[ -z "${MULHER_AMPARADA_INSTALLATION_ID:-}" ]]; then
            echo "::error::Secret MULHER_AMPARADA_INSTALLATION_ID ausente."
            exit 1
          fi

          if [[ -z "${MULHER_AMPARADA_PRIVATE_KEY:-}" && -z "${MULHER_AMPARADA_PRIVATE_KEY_FILE:-}" ]]; then
            echo "::error::Chave privada não disponibilizada ao agente."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ./github_agent workflow "automations.yml" "main"
          elif [[ "${{ inputs.action }}" == "executar-workflow" ]]; then
            ./github_agent workflow "${{ inputs.workflow }}" "${{ inputs.branch }}"
          elif [[ "${{ inputs.action }}" == "dependabot" ]]; then
            ./github_agent dependabot "${{ inputs.branch }}"
          else
            echo "::error::Ação inválida."
            exit 1
          fi