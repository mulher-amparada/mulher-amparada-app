<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Controle</title>

<style>

/* =========================================================
   ANIMAÇÕES
   SOMENTE OPACITY
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes fadeOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }

}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .42;
    }

}

.mainUI.saindo {

    animation:
        fadeOut
        .65s
        ease
        forwards;

}


/* =========================================================
   ROLAGEM
========================================================= */

html,
body {

    scrollbar-width:
        none;

}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
*::-webkit-scrollbar {

    width:
        0;

    height:
        0;

    background:
        transparent;

}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family:
        "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-weight:
        400 800;

    font-style:
        normal;

    font-display:
        swap;

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg:
        #000000;

    --surface:
        #0b0b0e;

    --surface-2:
        #111115;

    --surface-3:
        #18181d;

    --text:
        #ffffff;

    --soft:
        #b4b4bd;

    --muted:
        #696972;

    --pink:
        #ff3f82;

    --pink-light:
        #ff6b9f;

    --pink-dark:
        #db2c6d;

    --red:
        #ff4358;

    --red-dark:
        #d5253d;

    --purple:
        #8d79ff;

    --purple-light:
        #a395ff;

    --purple-dark:
        #5947d4;

    --blue:
        #173b8f;

    --border:
        #242429;

    --border-light:
        #33333a;

    --radius:
        28px;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    font-family:
        "Quicksand",
        sans-serif;

    font-weight:
        700;

    -webkit-tap-highlight-color:
        transparent;

}

html,
body {

    width:
        100%;

    min-height:
        100%;

    background:
        #000000;

    color:
        #ffffff;

}

body {

    min-height:
        100vh;

    overflow-x:
        hidden;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);

}


/* =========================================================
   LAYOUT PRINCIPAL
========================================================= */

.mainUI {

    width:
        100%;

    max-width:
        700px;

    min-height:
        100vh;

    margin:
        0 auto;

    padding:
        24px
        16px
        100px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        31px;

    animation:
        pageIn
        .55s
        ease
        both;

}


/* =========================================================
   HERO
   PRIMEIRO TÍTULO LIMPO
========================================================= */

.hero {

    width:
        100%;

    padding:
        4px
        4px
        0;

}

.heroTopLine {

    width:
        43px;

    height:
        3px;

    margin-bottom:
        18px;

    border-radius:
        999px;

    background:
        var(--pink);

}

.heroTitle {

    color:
        #ffffff;

    font-size:
        clamp(
            32px,
            9vw,
            48px
        );

    font-weight:
        800;

    line-height:
        .98;

    letter-spacing:
        -1.6px;

}

.heroSubtitle {

    max-width:
        410px;

    margin-top:
        14px;

    color:
        #85858e;

    font-size:
        11px;

    font-weight:
        600;

    line-height:
        1.5;

    letter-spacing:
        .15px;

}


/* =========================================================
   SEÇÕES
========================================================= */

.section {

    width:
        100%;

}


/* =========================================================
   LABEL
========================================================= */

.label {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    margin:
        0
        0
        13px
        4px;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        800;

    letter-spacing:
        2px;

    line-height:
        1;

    text-transform:
        uppercase;

}

.label::before {

    content:
        "";

    width:
        5px;

    height:
        5px;

    flex:
        0 0 5px;

    border-radius:
        50%;

    background:
        var(--pink);

}


/* =========================================================
   SOS
========================================================= */

.panic {

    width:
        100%;

    height:
        260px;

    position:
        relative;

    overflow:
        hidden;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        14px;

    border:
        1px solid
        #ff6470;

    border-radius:
        32px;

    color:
        #ffffff;

    background:

        radial-gradient(
            circle at 50% 0%,
            #ffffff30,
            transparent 34%
        ),

        radial-gradient(
            circle at 50% 100%,
            #82001940,
            transparent 55%
        ),

        linear-gradient(
            145deg,
            #ff4a5e,
            #dc263d
        );

    cursor:
        pointer;

    box-shadow:
        0 22px 52px
        #ff344838;

    transition:
        filter
        .18s
        ease,

        box-shadow
        .2s
        ease,

        border-color
        .18s
        ease;

    -webkit-appearance:
        none;

    appearance:
        none;

}

.panic::before {

    content:
        "";

    position:
        absolute;

    width:
        410px;

    height:
        410px;

    top:
        -300px;

    right:
        -135px;

    border-radius:
        50%;

    background:
        #ffffff13;

    pointer-events:
        none;

}


.panic span {

    position:
        relative;

    z-index:
        2;

    color:
        #ffffff;

    font-size:
        clamp(
            64px,
            18vw,
            94px
        );

    font-weight:
        800;

    line-height:
        .85;

    letter-spacing:
        6px;

    text-shadow:
        0 7px 24px
        #00000033;

}

.panic small {

    position:
        relative;

    z-index:
        2;

    color:
        #ffffffc2;

    font-size:
        11px;

    font-weight:
        600;

    letter-spacing:
        .6px;

}

.panic:hover {

    filter:
        brightness(1.045);

    border-color:
        #ffffff9e;

}

.panic:active {

    filter:
        brightness(1.10);

}

.panic:focus-visible {

    outline:
        2px solid
        #ffffff;

    outline-offset:
        4px;

}


/* =========================================================
   ATALHOS
========================================================= */

.navigationButtons {

    width:
        100%;

    display:
        flex;

    flex-direction:
        column;

}


/* =========================================================
   BOTÃO DE NAVEGAÇÃO
========================================================= */

.navigationButton {

    width:
        100%;

    min-height:
        116px;

    margin-bottom:
        13px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    gap:
        15px;

    padding:
        17px
        17px
        17px
        20px;

    overflow:
        hidden;

    color:
        #ffffff;

    background:
        linear-gradient(
            145deg,
            #111115,
            #09090b
        );

    border:
        1px solid
        #25252b;

    border-radius:
        26px;

    text-align:
        left;

    cursor:
        pointer;

    box-shadow:
        0 12px 30px
        #0000006e;

    transition:
        background
        .18s
        ease,

        border-color
        .18s
        ease,

        filter
        .18s
        ease;

    -webkit-appearance:
        none;

    appearance:
        none;

}


.navigationButton::before {

    content:
        "";

    position:
        absolute;

    width:
        180px;

    height:
        180px;

    top:
        -105px;

    right:
        -60px;

    border-radius:
        50%;

    background:
        #7b68ee28;

    pointer-events:
        none;

}


/* =========================================================
   ÍCONE DOS ATALHOS
========================================================= */

.navigationIcon {

    width:
        53px;

    height:
        53px;

    flex:
        0 0 53px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

    color:
        var(--pink);

    background:
        #18181d;

    border:
        1px solid
        #303038;

    border-radius:
        17px;

}

.navigationIcon svg {

    width:
        26px;

    height:
        26px;

    display:
        block;

    fill:
        #fff;

}


/* =========================================================
   CONTEÚDO DOS ATALHOS
========================================================= */

.navigationContent {

    min-width:
        0;

    flex:
        1;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    gap:
        5px;

    position:
        relative;

    z-index:
        2;

}

.navigationTitle {

    color:
        #f4f4f6;

    font-size:
        14px;

    font-weight:
        800;

    line-height:
        1.2;

}

.navigationDescription {

    color:
        #77777f;

    font-size:
        9px;

    font-weight:
        600;

    line-height:
        1.45;

}

.navigationMeta {

    display:
        flex;

    align-items:
        center;

    margin-top:
        3px;

}

.navigationStatus {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    color:
        #575760;

    font-size:
        7px;

    font-weight:
        800;

    letter-spacing:
        1px;

    text-transform:
        uppercase;

}

.navigationStatus::before {

    content:
        "";

    width:
        4px;

    height:
        4px;

    border-radius:
        50%;

    background:
        var(--pink);

}


/* =========================================================
   SETA
========================================================= */

.navigationArrow {

    width:
        41px;

    height:
        41px;

    flex:
        0 0 41px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

    color:
        #73737b;

    background:
        #18181d;

    border:
        1px solid
        #303038;

    border-radius:
        14px;

}

.navigationArrow svg {

    width:
        19px;

    height:
        19px;

    display:
        block;

    stroke:
        currentColor;

}


/* =========================================================
   ÁREA PROTEGIDA — BIG BUTTON
========================================================= */

.bigButton {

    width:
        100%;

    min-height:
        138px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    gap:
        16px;

    padding:
        18px;

    overflow:
        hidden;

    color:
        #ffffff;

    background:
        linear-gradient(
            145deg,
            #211c48,
            #151329 58%,
            #0d0c16
        );

    /*
       SOMENTE BORDER
       SEM BOX-SHADOW
    */

    border:
        1px solid
        #8d79ff;

    border-radius:
        30px;

    text-align:
        left;

    cursor:
        pointer;

    -webkit-appearance:
        none;

    appearance:
        none;

    transition:
        background
        .18s
        ease,

        border-color
        .18s
        ease,

        filter
        .18s
        ease;

}


/* =========================================================
   BIG BUTTON — BEFORE
   COR SÓLIDA
========================================================= */

.bigButton::before {

    content:
        "";

    position:
        absolute;

    width:
        250px;

    height:
        250px;

    top:
        -175px;

    right:
        -95px;

    border-radius:
        50%;

    background:
        #38286d;

    pointer-events:
        none;

}


/* =========================================================
   BIG BUTTON — AFTER
   COR SÓLIDA
========================================================= */

.bigButton::after {

    content:
        "";

    position:
        absolute;

    width:
        115px;

    height:
        115px;

    bottom:
        -78px;

    left:
        -38px;

    border-radius:
        50%;

    background:
        #552052;

    pointer-events:
        none;

}


/* =========================================================
   ÍCONE PROTEGIDO
========================================================= */

.protectIcon {

    width:
        64px;

    height:
        64px;

    flex:
        0 0 64px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    z-index:
        2;

    background:
        #30245a;

    border:
        1px solid
        #6252a8;

    border-radius:
        21px;

}

.protectIcon img {

    width:
        32px;

    height:
        32px;

    display:
        block;

    object-fit:
        contain;

}


/* =========================================================
   CONTEÚDO PROTEGIDO
========================================================= */

.protectContent {

    min-width:
        0;

    flex:
        1;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        flex-start;

    justify-content:
        center;

    gap:
        6px;

    position:
        relative;

    z-index:
        2;

}

.protectTitle {

    color:
        #ffffff;

    font-size:
        clamp(
            19px,
            5vw,
            25px
        );

    font-weight:
        800;

    line-height:
        1.1;

    letter-spacing:
        -.35px;

}

.protectSubtitle {

    color:
        #a49caf;

    font-size:
        10px;

    font-weight:
        600;

    line-height:
        1.4;

}


/* =========================================================
   META
========================================================= */

.protectMeta {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    margin-top:
        3px;

    color:
        #756d7d;

    font-size:
        7px;

    font-weight:
        800;

    letter-spacing:
        1.2px;

    text-transform:
        uppercase;

}

.protectMeta::before {

    content:
        "";

    width:
        5px;

    height:
        5px;

    border-radius:
        50%;

    background:
        var(--pink);

}


/* =========================================================
   SETA DO BIG BUTTON
========================================================= */

.bigButton .navigationArrow {

    width:
        43px;

    height:
        43px;

    flex:
        0 0 43px;

    color:
        #a395ff;

    background:
        #211b3b;

    border:
        1px solid
        #493d78;

}


/* =========================================================
   ESTADOS DO BIG BUTTON
========================================================= */

.bigButton:hover {

    filter:
        brightness(1.06);

    border-color:
        #a395ff;

}

.bigButton:hover .protectIcon {

    background:
        #382b68;

    border-color:
        #7968c9;

}

.bigButton:hover .navigationArrow {

    color:
        #ffffff;

    background:
        #2b2450;

    border-color:
        #6557a1;

}

.bigButton:active {

    filter:
        brightness(1.10);

}

.bigButton:focus-visible {

    outline:
        2px solid
        var(--purple-light);

    outline-offset:
        4px;

}



</style>

</head>


<body>

<main class="mainUI">


    <!-- ===================================================
         HERO
    ==================================================== -->

    <header class="hero">

        <div class="heroTopLine"></div>

        <h1 class="heroTitle">
            Mulher <br> Amparada
        </h1>

        <p class="heroSubtitle">
            Proteção, assistência e recursos reunidos em um só lugar.
        </p>

    </header>


    <!-- ===================================================
         EMERGÊNCIA
    ==================================================== -->

    <section class="section">

        <div class="label">
            Emergência
        </div>

        <button
            class="panic"
            id="panic"
            type="button"
            aria-label="Pedir ajuda"
        >

            <span>
                SOS
            </span>

            <small>
                toque para pedir ajuda
            </small>

        </button>

    </section>


    <!-- ===================================================
         ATALHOS
    ==================================================== -->

    <section class="navigationButtons">

        <div class="label">
            Atalhos
        </div>


        <button
            class="navigationButton"
            type="button"
            onclick="window.location.href='index3.html'"
            aria-label="Abrir proteção por sensores"
        >

            <span
                class="navigationIcon"
                aria-hidden="true"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 -960 960 960"
                >

                    <path
                        d="M480-514ZM160-705q0-25 14.5-45t37.5-29l240-90q14-5 28-5t28 5l240 90q23 9 37.5 29t14.5 45v68q0 17-11.5 28.5T760-597q-17 0-28.5-11.5T720-637v-68l-240-90-240 90v189q0 80 32 154.5T363-233q12 11 13 28t-10 29q-11 12-27.5 12.5T310-174q-71-66-110.5-155.5T160-516v-189Zm692 597q-12 12-28.5 12T795-108l-94-95q-3 1-21 3-33 0-56.5-23.5T600-280q0-33 23.5-56.5T680-360q33 0 56.5 23.5T760-280q0 3-3 21l95 95q12 12 12 28t-12 28ZM440-280q0-100 70-170t170-70q100 0 170 70t70 170q0 17-11.5 28.5T880-240q-17 0-28.5-11.5T840-280q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47q17 0 28.5 11.5T720-80q0 17-11.5 28.5T680-40q-100 0-170-70t-70-170Z"
                    />

                </svg>

            </span>


            <span class="navigationContent">

                <span class="navigationTitle">
                    Proteção por sensores
                </span>

                <span class="navigationDescription">
                    Recursos de proteção acionados pelos sensores do dispositivo.
                </span>

                <span class="navigationMeta">

                    <span class="navigationStatus">
                        Proteção
                    </span>

                </span>

            </span>


            <span
                class="navigationArrow"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M9 18L15 12L9 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

        </button>


        <button
            class="navigationButton"
            type="button"
            onclick="window.location.href='index4.html'"
            aria-label="Abrir ajuda rápida"
        >

            <span
                class="navigationIcon"
                aria-hidden="true"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 -960 960 960"
                >

                    <path
                        d="M700-480q0-21 4-40.5t10-39.5h46q10 0 18-4t14-12l27-36q9-12 8-27t-12-26l-28-28q-11-11-27-11.5T732-694q-43 40-67.5 97.5T640-480q0 59 24.5 116.5T732-266q12 11 28 10.5t27-11.5l28-28q11-11 12-26t-8-27l-27-36q-6-8-14-12t-18-4h-46q-6-18-10-38.5t-4-41.5ZM80-120q-33 0-56.5-23.5T0-200v-560q0-33 23.5-56.5T80-840h800q33 0 56.5 23.5T960-760v560q0 33-23.5 56.5T880-120H80Zm556-80h244v-560H80v560h4q42-75 116-117.5T360-360q86 0 160 42.5T636-200ZM445-435q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM182-200h356q-34-38-80.5-59T360-280q-51 0-97 21t-81 59Zm149.5-291.5Q320-503 320-520t11.5-28.5Q343-560 360-560t28.5 11.5Q400-537 400-520t-11.5 28.5Q377-480 360-480t-28.5-11.5ZM480-480Z"
                    />

                </svg>

            </span>


            <span class="navigationContent">

                <span class="navigationTitle">
                    Ajuda rápida
                </span>

                <span class="navigationDescription">
                    Localização, compartilhamento e contatos de confiança em um só lugar.
                </span>

                <span class="navigationMeta">

                    <span class="navigationStatus">
                        Assistência
                    </span>

                </span>

            </span>


            <span
                class="navigationArrow"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M9 18L15 12L9 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

        </button>

    </section>


    <!-- ===================================================
         ÁREA PROTEGIDA
    ==================================================== -->

    <section class="section">

        <div class="label">
            Área protegida
        </div>


        <button
            class="bigButton"
            id="areaProtegida"
            type="button"
            aria-label="Abrir área protegida"
        >

            <span
                class="protectIcon"
                aria-hidden="true"
            >

                <img
                    src="lock.svg"
                    alt=""
                >

            </span>


            <span class="protectContent">

                <span class="protectTitle">
                    Área protegida
                </span>

                <span class="protectSubtitle">
                    Acesso protegido por senha
                </span>

                <span class="protectMeta">
                    Proteção ativa
                </span>

            </span>


            <span
                class="navigationArrow"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M9 18L15 12L9 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

        </button>

    </section>


</main>


<script>

/* =========================================================
   VIBRAÇÃO
========================================================= */

function vibrar(
    duracao = 100
) {

    try {

        if (
            navigator.vibrate &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(
                duracao
            );

        }

    } catch (e) {}

}


/* =========================================================
   SOS
========================================================= */

const panic =
    document.getElementById(
        "panic"
    );


if (panic) {

    panic.addEventListener(
        "click",
        function () {

            vibrar(300);

            try {

                if (
                    window.Android &&
                    typeof Android.ligarDireto === "function"
                ) {

                    Android.ligarDireto(
                        "180"
                    );

                    return;

                }

            } catch (e) {}

            window.location.href =
                "tel:180";

        }
    );

}


/* =========================================================
   ÁREA PROTEGIDA
========================================================= */

const areaProtegida =
    document.getElementById(
        "areaProtegida"
    );


if (areaProtegida) {

    areaProtegida.addEventListener(
        "click",
        function () {

            vibrar(70);

            try {

                if (
                    window.Android &&
                    typeof Android.iniciarBiometriaMusica === "function"
                ) {

                    Android.iniciarBiometriaMusica();

                }

            } catch (e) {

                console.warn(e);

            }

        }
    );

}


/* =========================================================
   VIBRAÇÃO DOS ATALHOS
========================================================= */

document
    .querySelectorAll(
        ".navigationButton"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    vibrar(45);

                }
            );

        }
    );

</script>


</body>

</html>
