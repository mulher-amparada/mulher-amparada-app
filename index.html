/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family:
        "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-weight:
        400 800;

    font-display:
        swap;

}


/* =========================================================
   VARIÁVEIS
========================================================= */
:root {

    --bg: #000000;

    --surface: #0d0d0f;
    --surface-2: #121216;
    --surface-3: #18181d;

    --text: #ffffff;

    --soft: #858791;
    --muted: #62646d;
    --muted-2: #484a52;

    --text-soft: #a6a6ae;
    --text-muted: #707078;

    --pink:
        #ff3f82;
        
    --pink-light: #ff9bc5;

    --purple: #a855f7;

    --blue: #7c6cff;
    --blue-2: #9589ff;
    --blue-dark: #5548d8;

    --red: #ff4054;
    --red-dark: #d9273d;

    --danger: #ff4f67;

    --line: #24242a;
    --line-light: #303038;

    --ease: cubic-bezier(.22,1,.36,1);

    --radius: 24px;

}

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {

    margin:
        0;

    padding:
        0;

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;

    -webkit-transform: translateZ(0);
    transform: translateZ(0);
}


html {

    width:
        100%;

    min-height:
        100%;

    background:
        var(--bg);

    color:
        var(--text);

    color-scheme:
        dark;

    scroll-behavior:
        smooth;

    scrollbar-width:
        none;

}


html::-webkit-scrollbar {

    display:
        none;

}


body {

    width:
        100%;

    min-height:
        100dvh;

    margin:
        0;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        "Quicksand",
        Arial,
        sans-serif;

    overflow-x:
        hidden;

    -webkit-font-smoothing:
        antialiased;

    padding-bottom:
        calc(
            30px +
            env(safe-area-inset-bottom)
        );

    opacity:
        1;

    transition:
        opacity .3s
        var(--ease);

}


body.fade-out {

    opacity:
        0;

    pointer-events:
        none;

}


/* =========================================================
   SELEÇÃO
========================================================= */

::selection {

    color:
        #ffffff;

    background:
        rgba(255,63,159,.35);

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button,
a {

    -webkit-tap-highlight-color:
        transparent;

}


button:focus-visible,
a:focus-visible {

    outline:
        2px solid
        rgba(255,121,176,.8);

    outline-offset:
        3px;

}


/* =========================================================
   ENTRADA
========================================================= */

@keyframes pageIn {

    from {

        opacity:
            0;

        transform:
            translateY(8px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


.page {

    width:
        100%;

    max-width:
        680px;

    min-height:
        100dvh;

    margin:
        0 auto;

    padding:
        calc(
            22px +
            env(safe-area-inset-top)
        )
        5%
        calc(
            35px +
            env(safe-area-inset-bottom)
        );

    animation:
        pageIn
        .55s
        var(--ease)

}

<script>

/* =========================================================
   CONTROLE DE NAVEGAÇÃO
========================================================= */

let navegando =
    false;


/* =========================================================
   VIBRAÇÃO
========================================================= */

function vibrar(
    duracao = 40
) {

    try {

        if (
            "vibrate" in navigator &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(
                duracao
            );

        }

    } catch (erro) {

        console.warn(
            "Vibração indisponível.",
            erro
        );

    }

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function ir(
    page
) {

    if (
        typeof page !== "string" ||
        !page.trim()
    ) {

        return;

    }

    sairDaPagina(
        page
    );

}


function navigate(
    page
) {

    if (
        typeof page !== "string" ||
        !page.trim()
    ) {

        return;

    }

    sairDaPagina(
        page
    );

}


/* =========================================================
   SAÍDA COM FADE
========================================================= */

function sairDaPagina(
    destino
) {

    if (
        navegando ||
        typeof destino !== "string" ||
        !destino.trim()
    ) {

        return;

    }

    navegando =
        true;

    vibrar(
        40
    );

    document.body.classList.add(
        "fade-out"
    );

    window.setTimeout(
        function() {

            window.location.href =
                destino;

        },
        300
    );

}


/* =========================================================
   LIGAÇÕES
========================================================= */

function ligar(
    numero
) {

    if (
        typeof numero !== "string" ||
        !numero.trim()
    ) {

        return;

    }

    vibrar(
        50
    );

    try {

        window.location.href =
            "tel:" + numero;

    } catch (erro) {

        console.warn(
            "Não foi possível iniciar a ligação.",
            erro
        );

    }

}


/* =========================================================
   CARDS DOS APLICATIVOS
========================================================= */

document
    .querySelectorAll(".app-card")
    .forEach(
        function(card) {

            const destino =
                card.dataset.page ||
                card.getAttribute("href");

            card.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    sairDaPagina(
                        destino
                    );

                }
            );

        }
    );


/* =========================================================
   REPOSITÓRIO
========================================================= */

const repoButton =
    document.querySelector(
        ".repo-button"
    );

if (repoButton) {

    repoButton.addEventListener(
        "click",
        function() {

            vibrar(
                40
            );

        }
    );

}


/* =========================================================
   RESTAURAÇÃO
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        navegando =
            false;

        document.body.classList.remove(
            "fade-out"
        );

        document.body.style.pointerEvents =
            "auto";

    }
);

</script>
