/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-weight: 400 800;

    font-display: swap;

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #000000;

    --surface: #101218;
    --surface-2: #151720;
    --surface-3: #1b1d25;

    --line: rgba(255,255,255,.075);
    --line-light: rgba(255,255,255,.14);

    --text: #f7f7fa;
    --soft: #969baa;
    --muted: #626877;

    --pink: #ff3f9f;
    --pink-light: #ff6db5;

    --red: #ff4054;
    --red-dark: #d9273d;

    --radius: 24px;

    --ease:
        cubic-bezier(.22,1,.36,1);

}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


html {

    width: 100%;

    min-height: 100%;

    background:
        var(--bg);

    color:
        var(--text);

    scroll-behavior: smooth;

    scrollbar-width: none;

}


html::-webkit-scrollbar {

    display: none;

}


body {

    width: 100%;

    min-height: 100vh;

    margin: 0;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        "Quicksand",
        Arial,
        sans-serif;

    overflow-x: hidden;

    padding-bottom:
        calc(
            24px +
            env(safe-area-inset-bottom)
        );

    opacity: 1;

    transition:
        opacity .42s
        var(--ease);

}


body.fade-out {

    opacity: 0;

    pointer-events: none;

}


/* =========================================================
   SELEÇÃO
========================================================= */

::selection {

    color:
        #ffffff;

    background:
        rgba(255,63,159,.35);

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button,
a {

    -webkit-tap-highlight-color:
        transparent;

}


button:focus-visible,
a:focus-visible {

    outline:
        2px solid
        rgba(255,63,159,.85);

    outline-offset:
        3px;

}


/* =========================================================
   REDUÇÃO DE MOVIMENTO
========================================================= */

@media (prefers-reduced-motion: reduce) {

    html {

        scroll-behavior:
            auto;

    }

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

    }

}


/* =========================================================
   ENTRADA DA PÁGINA
========================================================= */

@keyframes pageIn {

    from {

        opacity:
            0;

    }

    to {

        opacity:
            1;

    }

}


.mainUI {

    max-width: 720px;

<body>


<!-- =======================================================
     INTERFACE PRINCIPAL
======================================================== -->

<main
    class="mainUI"
    id="mainUI"
>


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <header class="hero">

        <h1>
            Mulher <br>
            Amparada
        </h1>

        <p>
            Acesse rapidamente os serviços de emergência
            e os aplicativos do projeto.
        </p>

    </header>


    <!-- =================================================
         EMERGÊNCIA
    ================================================== -->

    <section class="section">

        <div class="section-label">
            Emergência
        </div>

        <div class="emergency-list">


            <!-- 180 -->

            <button
                class="emergency-button"
                type="button"
                onclick="ligar('180')"
                aria-label="Ligar para a Central de Atendimento à Mulher, 180"
            >

                <span class="emergency-icon">
                    180
                </span>

                <span class="emergency-info">

                    <span class="emergency-title">
                        Violência contra a mulher
                    </span>

                    <span class="emergency-subtitle">
                        Central de Atendimento à Mulher
                    </span>

                </span>



            </button>


            <!-- 190 -->

            <button
                class="emergency-button"
                type="button"
                onclick="ligar('190')"
                aria-label="Ligar para a Polícia, 190"
            >

                <span class="emergency-icon">
                    190
                </span>

                <span class="emergency-info">

                    <span class="emergency-title">
                        Polícia
                    </span>

                    <span class="emergency-subtitle">
                        Ligue para 190
                    </span>

                </span>



            </button>


            <!-- 192 -->

            <button
                class="emergency-button"
                type="button"
                onclick="ligar('192')"
                aria-label="Ligar para o SAMU, 192"
            >

                <span class="emergency-icon">
                    192
                </span>

                <span class="emergency-info">

                    <span class="emergency-title">
                        SAMU
                    </span>

                    <span class="emergency-subtitle">
                        Ligue para 192
                    </span>

                </span>

<script>

/* =========================================================
   NAVEGAÇÃO SIMPLES
========================================================= */

function ir(pagina) {

    if (
        typeof pagina !== "string" ||
        pagina.trim() === ""
    ) {

        return false;

    }

    try {

        window.location.href =
            pagina;

        return true;

    } catch (erro) {

        console.error(
            "Erro ao navegar para:",
            pagina,
            erro
        );

        return false;

    }

}


/* =========================================================
   VIBRAÇÃO
========================================================= */

function vibrar(duracao = 40) {

    try {

        if (
            "vibrate" in navigator &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(
                duracao
            );

        }

    } catch (erro) {

        /* Alguns WebViews podem não permitir vibração. */

    }

}


/* =========================================================
   LIGAÇÕES
========================================================= */

function ligar(numero) {

    if (
        typeof numero !== "string" ||
        numero.trim() === ""
    ) {

        return;

    }

    vibrar(50);

    try {

        window.location.href =
            "tel:" + numero;

    } catch (erro) {

        console.warn(
            "Não foi possível iniciar a ligação.",
            erro
        );

    }

}


/* =========================================================
   CONTROLE DE NAVEGAÇÃO
========================================================= */

let navegando = false;


/* =========================================================
   SAÍDA COM FADE
========================================================= */

function sairDaPagina(destino) {

    if (
        navegando ||
        typeof destino !== "string" ||
        destino.trim() === ""
    ) {

        return;

    }

    navegando = true;

    vibrar(40);

    document.body.classList.add(
        "fade-out"
    );

    window.setTimeout(
        function() {

            window.location.href =
                destino;

        },
        420
    );

}


/* =========================================================
   CARDS DOS APLICATIVOS
========================================================= */

document
    .querySelectorAll(".app-card")
    .forEach(
        function(card) {

            const destino =
                card.dataset.page ||
                card.getAttribute("href");

            card.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    sairDaPagina(
                        destino
                    );

                }
            );

        }
    );


/* =========================================================
   REPOSITÓRIO
========================================================= */

const repoButton =
    document.querySelector(
        ".repo-button"
    );

if (repoButton) {

    repoButton.addEventListener(
        "click",
        function() {

            vibrar(40);

        }
    );

}


/* =========================================================
   BOTÃO FLUTUANTE
========================================================= */

const toggle =
    document.getElementById(
        "toggle"
    );

if (toggle) {

    toggle.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            sairDaPagina(
                "home.html"
            );

        }
    );

}


/* =========================================================
   BOTÕES DE MENSAGEM
========================================================= */

document
    .querySelectorAll(".btn")
    .forEach(
        function(botao) {

            botao.addEventListener(
                "click",
                function() {

                    vibrar(40);

                }
            );

        }
    );


/* =========================================================
   RESTAURAÇÃO DA PÁGINA
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        navegando = false;

        document.body.classList.remove(
            "fade-out"
        );

        document.body.style.pointerEvents =
            "auto";

    }
);

</script>
