<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Calc</title>

<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

/* Chrome, Edge, Safari, Android WebView */
*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

/* Firefox */
* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

/* Página */
html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html.launcher-loading,
html.launcher-loading body {
    background: #000;
}


/* Remove qualquer fundo da área de rolagem */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}

:root {
    --bg: #000;
    --button: #151515;
    --button-hover: #202020;
    --action: #6F7AFF;
    --action-hover: #686DFF;
    --operator: #3DA7FF;
    --operator-hover: #61B7FF;
    --text: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

@keyframes transformar {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}


@keyframes Opacity {
    0% {
        opacity: 0;
    }

    

    100% {
        opacity: 1;
    }
}


body {
    animation: Opacity .55s ease both;
width: 90%;
    display: flex;
    align-items: center;
    justify-content: center;

    margin-left: 5%;
    margin-right: 5%;
margin-top: 30%;

    overflow-x: hidden;
}


/* =====================================================
   CALCULADORA
===================================================== */

.calculadora {
    width: min(100%, 430px);

    display: flex;
    flex-direction: column;

    gap: clamp(12px, 3vw, 22px);
}


/* =====================================================
   VISOR
===================================================== */

.tela {
    width: 100%;
    max-width: 430px;

    /*
     * Altura controlada.
     * O conteúdo NÃO pode aumentar o visor.
     */
    height: clamp(
        125px,
        24dvh,
        220px
    );


    min-height: 125px;
    max-height: 220px;

    /*
     * Sem margin-bottom.
     * O body centraliza a calculadora inteira.
     */
    margin: 0;

    padding: clamp(
        18px,
        5vw,
        30px
    );

    display: block;

    position: relative;

    min-width: 0;

    background: var(--bg);

    color: var(--text);

    border-radius: 20px;

    font-size: clamp(
        38px,
        11vw,
        64px
    );

    font-weight: 600;

    line-height: 1.05;

    text-align: right;

    /*
     * ROLAGEM NOS DOIS EIXOS
     */
    overflow-x: auto;
    overflow-y: auto;

    /*
     * Permite arrastar horizontal
     * e verticalmente no Android.
     */
    touch-action: pan-x pan-y;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    /*
     * QUEBRA DE LINHA
     */
    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;

    /*
     * Scrollbar invisível
     */
    scrollbar-width: none;

    -ms-overflow-style: none;

    /*
     * Impede seleção
     */
    user-select: none;

    -webkit-user-select: none;
    
    margin-bottom: 5%;
}

/* =====================================================
   GRID DOS BOTÕES
===================================================== */

.botoes {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: clamp(8px, 2.5vw, 14px);
    margin-top: 3%:
    
}


/* =====================================================
   BOTÕES
===================================================== */

button {
    width: 100%;

    aspect-ratio: 1 / 1;

    min-width: 0;
    min-height: 0;

    border: 0;
    outline: 0;

    border-radius: 200px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--button);
    color: var(--text);

    font-size: clamp(20px, 6vw, 27px);
    font-weight: 600;

    padding: 0;
    margin: 0;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


/* =====================================================
   ZERO
===================================================== */

.zero {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;
    margin: 0;

    border-radius: 200px;
}


/* =====================================================
   HOVER
===================================================== */

button:hover {
    background: var(--button-hover);
}


/* =====================================================
   CLIQUE
===================================================== */

button:active {
    transform: scale(.90);
}


/* =====================================================
   BOTÕES DE AÇÃO
===================================================== */

.acao {
    background: var(--action);
}

.acao:hover {
    background: var(--action-hover);
}


/* =====================================================
   OPERADORES
===================================================== */

.operador,
.igual {
    background: var(--operator);
}

.operador:hover,
.igual:hover {
    background: var(--operator-hover);
}

.operador:active,
.igual:active {
    background: var(--operator-hover);
}


/* =====================================================
   SVG
===================================================== */

svg {
    width: clamp(23px, 7vw, 31px);
    height: clamp(23px, 7vw, 31px);

    pointer-events: none;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .calculadora {
        gap: 10px;
    }

    .botoes {
        gap: 7px;
    }

    .tela {
        min-height: 100px;

        padding: 15px;

        font-size: 34px;
    }

    button {
        font-size: 19px;
    }

    svg {
        width: 23px;
        height: 23px;
    }
}


/* =====================================================
   TELAS GRANDES
===================================================== */

@media (min-width: 600px) {

    .calculadora {
        width: min(90vw, 430px);
    }
}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media (max-height: 700px) {

    body {
        align-items: flex-start;

        padding-top: 8px;
        padding-bottom: 8px;
    }

    .calculadora {
        margin-top: 0;
    }

    .tela {
        min-height: 105px;
    }
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) and (max-height: 600px) {

    body {
        align-items: center;

        overflow-y: auto;
    }

    .calculadora {
        width: min(90vw, 650px);

        display: grid;

        grid-template-columns: .9fr 1.4fr;

        align-items: center;

        gap: 25px;
    }

    .tela {
        min-height: 260px;

        font-size: clamp(36px, 7vw, 58px);
    }

    .botoes {
        gap: 8px;
    }

    button {
        font-size: clamp(18px, 4vw, 25px);
    }
}



</style>

</head>

<body>

<div class="calculadora">

    <!-- =================================================
         VISOR
    ================================================== -->
<div
        class="tela"
        id="display"
        tabindex="0"
        role="status"
        aria-live="polite"
        aria-label="Visor da calculadora"
    >

        <span id="displayTexto">
            0
        </span>

    </div>



    <!-- =================================================
         TECLADO
    ================================================== -->

    <div class="botoes">

        <!-- ================= LINHA 1 ================= -->

        <button
            type="button"
            class="acao"
            onclick="limpar()"
            aria-label="Limpar calculadora"
        >
            AC
        </button>

        <button
            type="button"
            class="acao"
            onclick="apagar()"
            aria-label="Apagar último caractere"
        >
<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="m560-424 76 76q11 11 28 11t28-11q11-11 11-28t-11-28l-76-76 76-76q11-11 11-28t-11-28q-11-11-28-11t-28 11l-76 76-76-76q-11-11-28-11t-28 11q-11 11-11 28t11 28l76 76-76 76q-11 11-11 28t11 28q11 11 28 11t28-11l76-76ZM360-160q-19 0-36-8.5T296-192L116-432q-16-21-16-48t16-48l180-240q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360Zm0-80h440v-480H360L180-480l180 240Zm130-240Z"/></svg>
        </button>

        <button
            type="button"
            class="acao"
            onclick="porcentagem()"
            aria-label="Porcentagem"
        >
            %
        </button>

        <button
            type="button"
            class="operador"
            onclick="operacao('/')"
            aria-label="Divisão"
        >
            ÷
        </button>


        <!-- ================= LINHA 2 ================= -->

        <button
            type="button"
            onclick="add('7')"
            aria-label="7"
        >7</button>

        <button
            type="button"
            onclick="add('8')"
            aria-label="8"
        >8</button>

        <button
            type="button"
            onclick="add('9')"
            aria-label="9"
        >9</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('*')"
            aria-label="Multiplicação"
        >
            ×
        </button>


        <!-- ================= LINHA 3 ================= -->

        <button
            type="button"
            onclick="add('4')"
            aria-label="4"
        >4</button>

        <button
            type="button"
            onclick="add('5')"
            aria-label="5"
        >5</button>

        <button
            type="button"
            onclick="add('6')"
            aria-label="6"
        >6</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('-')"
            aria-label="Subtração"
        >
            −
        </button>


        <!-- ================= LINHA 4 ================= -->

        <button
            type="button"
            onclick="add('1')"
            aria-label="1"
        >1</button>

        <button
            type="button"
            onclick="add('2')"
            aria-label="2"
        >2</button>

        <button
            type="button"
            onclick="add('3')"
            aria-label="3"
        >3</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('+')"
            aria-label="Adição"
        >
            +
        </button>


        <!-- ================= LINHA 5 ================= -->

        <button
            type="button"
            class="especial"
            onclick="add('(')"
            aria-label="Parêntese esquerdo"
        >
            ()
        </button>

<button
    type="button"
    class="zero"
    onclick="add('0')"
    aria-label="0"
>
    0
</button>

        <button
            type="button"
            onclick="add('.')"
            aria-label="Ponto decimal"
        >
            .
        </button>

        <button
            type="button"
            class="igual"
            onclick="calcular()"
            aria-label="Calcular resultado"
        >
            =
        </button>

    </div>

</div>
<script>

/* =====================================================
   CHAVES
===================================================== */

const CHAVE_SENHA =
    "senha";

const CHAVE_RECUPERACAO =
    "nome_recuperacao";


/* =====================================================
   ELEMENTOS
===================================================== */

const display =
    document.getElementById(
        "display"
    );


const displayTexto =
    document.getElementById(
        "displayTexto"
    );


/* =====================================================
   ESTADO
===================================================== */

let expr = "";

let contadorToques = 0;

let timerToques = null;


/* =====================================================
   ROLAGEM DO VISOR
===================================================== */

function rolarVisor() {

    requestAnimationFrame(() => {

        /*
         * Mantém o final da expressão
         * visível horizontalmente.
         */

        display.scrollLeft =
            display.scrollWidth -
            display.clientWidth;


        /*
         * Mantém a última linha
         * visível verticalmente.
         */

        display.scrollTop =
            display.scrollHeight -
            display.clientHeight;

    });
}


/* =====================================================
   SENHA
===================================================== */

function inicializarSenha() {

    let senhaSalva = "";


    try {

        senhaSalva =
            String(
                Cripto.carregar(
                    CHAVE_SENHA
                ) || ""
            ).trim();

    } catch (e) {

        senhaSalva = "";
    }


    if (senhaSalva) {

        atualizar();

        return;
    }


    const novaSenha =
        prompt(
            "Crie uma senha"
        );


    if (
        !novaSenha ||
        !novaSenha.trim()
    ) {

        location.reload();

        return;
    }


    const resposta =
        prompt(
            "Como você gosta de ser chamada?"
        );


    if (
        !resposta ||
        !resposta.trim()
    ) {

        location.reload();

        return;
    }


    try {

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );


        Cripto.salvar(
            CHAVE_RECUPERACAO,
            resposta
                .trim()
                .toLowerCase()
        );

    } catch (e) {

        alert(
            "Não foi possível salvar os dados."
        );

        return;
    }


    location.reload();
}


/* =====================================================
   VISOR
===================================================== */

function atualizar() {

    displayTexto.textContent =
        expr.length
            ? expr
            : "0";


    rolarVisor();
}


/* =====================================================
   ADICIONAR
===================================================== */

function add(valor) {


    if (valor === ".") {

        /*
         * Procura somente a parte
         * atual da expressão.
         */

        const partes =
            expr.split(
                /[+\-*/()]/
            );


        const parteAtual =
            partes[
                partes.length - 1
            ];


        if (
            parteAtual.includes(".")
        ) {

            return;
        }
    }


    expr += valor;


    atualizar();
}


/* =====================================================
   OPERAÇÃO
===================================================== */

function operacao(op) {


    if (!expr) {

        if (op === "-") {

            expr = "-";

            atualizar();
        }

        return;
    }


    if (
        /[+\-*/]$/.test(expr)
    ) {

        expr =
            expr.slice(0, -1) +
            op;

    } else {

        expr += op;
    }


    atualizar();
}


/* =====================================================
   PORCENTAGEM
===================================================== */

function porcentagem() {

    if (!expr) {

        return;
    }


    expr =
        expr.replace(
            /(\d+(?:\.\d+)?)$/,
            "($1/100)"
        );


    atualizar();
}


/* =====================================================
   LIMPAR
===================================================== */

function limpar() {

    expr = "";

    atualizar();
}


/* =====================================================
   APAGAR
===================================================== */

function apagar() {

    expr =
        expr.slice(0, -1);

    atualizar();
}


/* =====================================================
   CALCULAR
===================================================== */

function calcular() {


    const senha =
        String(
            Cripto.carregar(
                CHAVE_SENHA
            ) || ""
        ).trim();


    /*
     * Senha especial
     */

    if (
        expr.trim() !== "" &&
        expr.trim() === senha
    ) {

        window.location.href =
            "file:///android_asset/user1/index2.html";

        return;
    }


    /*
     * Expressão vazia
     */

    if (!expr.trim()) {

        return;
    }


    try {

        const resultado =
            Function(
                '"use strict";return (' +
                expr +
                ')'
            )();


        if (
            typeof resultado ===
                "number" &&

            Number.isFinite(
                resultado
            )
        ) {

            expr =
                String(resultado);


            displayTexto.textContent =
                expr;


            rolarVisor();


            return;
        }

    } catch (e) {}


    mostrarMensagem(
        "Erro"
    );


    expr = "";
}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tempo = 1000
) {


    displayTexto.textContent =
        texto;


    rolarVisor();


    clearTimeout(
        mostrarMensagem.timer
    );


    mostrarMensagem.timer =
        setTimeout(
            atualizar,
            tempo
        );
}


/* =====================================================
   RECUPERAÇÃO DE SENHA
===================================================== */

function recuperarSenha() {


    let respostaSalva = "";


    try {

        respostaSalva =
            String(
                Cripto.carregar(
                    CHAVE_RECUPERACAO
                ) || ""
            )
            .toLowerCase()
            .trim();

    } catch (e) {

        mostrarMensagem(
            "Erro",
            1500
        );

        return;
    }


    const resposta =
        prompt(
            "Como você gosta de ser chamada?"
        );


    if (
        !resposta ||

        resposta
            .toLowerCase()
            .trim() !==
        respostaSalva
    ) {

        mostrarMensagem(
            "Resposta incorreta",
            1500
        );

        return;
    }


    const novaSenha =
        prompt(
            "Digite a nova senha"
        );


    if (
        !novaSenha ||
        !novaSenha.trim()
    ) {

        return;
    }


    const confirmarSenha =
        prompt(
            "Confirme a nova senha"
        );


    if (
        confirmarSenha !==
        novaSenha
    ) {

        mostrarMensagem(
            "Senhas diferentes",
            1500
        );

        return;
    }


    try {

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );

    } catch (e) {

        mostrarMensagem(
            "Erro ao salvar",
            1500
        );

        return;
    }


    const trocarResposta =
        confirm(
            "Deseja alterar a resposta de recuperação?"
        );


    if (trocarResposta) {

        const novaResposta =
            prompt(
                "Como você gosta de ser chamada?"
            );


        if (
            novaResposta &&
            novaResposta.trim()
        ) {

            try {

                Cripto.salvar(
                    CHAVE_RECUPERACAO,
                    novaResposta
                        .trim()
                        .toLowerCase()
                );

            } catch (e) {

                mostrarMensagem(
                    "Erro ao salvar",
                    1500
                );

                return;
            }
        }
    }


    expr = "";


    mostrarMensagem(
        "Senha alterada",
        1500
    );
}


/* =====================================================
   CINCO TOQUES
===================================================== */

function registrarToque() {


    contadorToques++;


    clearTimeout(
        timerToques
    );


    if (
        contadorToques >= 5
    ) {

        contadorToques = 0;

        recuperarSenha();

        return;
    }


    timerToques =
        setTimeout(
            () => {

                contadorToques = 0;

            },
            2000
        );
}


display.addEventListener(
    "click",
    registrarToque
);


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
    "keydown",
    e => {


        if (
            /^\d$/.test(
                e.key
            )
        ) {

            add(e.key);


        } else if (
            [
                "+",
                "-",
                "*",
                "/"
            ].includes(e.key)
        ) {

            operacao(e.key);


        } else if (
            e.key === "."
        ) {

            add(".");


        } else if (
            e.key === "Backspace"
        ) {

            apagar();


        } else if (
            e.key === "Escape"
        ) {

            limpar();


        } else if (
            e.key === "Enter" ||
            e.key === "="
        ) {

            calcular();


        } else if (
            e.key === "%"
        ) {

            porcentagem();
        }

    }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

inicializarSenha();

atualizar();

</script>


</body>
</html>
