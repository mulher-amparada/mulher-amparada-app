<style>

body.fade-out {

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .26s
        ease;

}

@media (prefers-reduced-motion: reduce) {
    /* Procura por QUALQUER elemento que use a sua animação e a desativa */

    * {
        animation-name: none !important;
    }
}
</style>


<script>

let navegando = false;

function sairDaPagina(destino) {

    if (navegando || !destino) {
        return;
    }

    navegando = true;

    document.body.classList.add("fade-out");

    setTimeout(function() {
        window.location.href = destino;
    }, 260);

}

window.addEventListener("pageshow", function() {

    navegando = false;

    document.body.classList.remove("fade-out");

});

</script>
