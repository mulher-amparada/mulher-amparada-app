name: ⚙️Executar todos os workflows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  build:
    name: "1 - Build"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: write

  jekyll:
    name: "2 - Jekyll GitHub Pages"
    needs: build
    uses: ./.github/workflows/jekyll-gh-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  sincronizar_app:
    name: "3 - Sincronizar app"
    needs: jekyll
    uses: ./.github/workflows/sincronizar-app.yml
    permissions:
      contents: write

  validar_qrs:
    name: "4 - Validar QR Codes"
    needs: sincronizar_app
    uses: ./.github/workflows/validar-qrs.yml
    permissions:
      contents: write

  pesquisar_projeto:
    name: "5 - Pesquisar projeto"
    needs: validar_qrs
    uses: ./.github/workflows/pesquisar-projeto.yml
    permissions:
      contents: write

  linguagens:
    name: "6 - Atualizar linguagens"
    needs: pesquisar_projeto
    uses: ./.github/workflows/linguagens.yml
    permissions:
      contents: write

  main_julia:
    name: "7 - Executar Julia"
    needs: linguagens
    uses: ./.github/workflows/main-julia.yml
    permissions:
      contents: read

  observatorio:
    name: "8 - Gerar observatório"
    needs: main_julia
    uses: ./.github/workflows/observatorio.yml
    permissions:
      contents: write

  atualizar_footer:
    name: "9 - Atualizar footer"
    needs: observatorio
    uses: ./.github/workflows/atualizar-footer.yml
    permissions:
      contents: write

  gerar_commits:
    name: "10 - Gerar commits"
    needs: atualizar_footer
    uses: ./.github/workflows/gerar-commits.yml
    permissions:
      contents: write

  atualizar-total-commits:
    name: Atualizar total de commits
    needs: gerar_commits
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Atualizar total de commits
        shell: bash
        run: |
          set -euo pipefail

          ARQUIVO="README.md"
          BASE=6385

          if [ ! -f "$ARQUIVO" ]; then
            echo "Erro: README.md não encontrado."
            exit 1
          fi

          TOTAL_ATUAL=$(git rev-list --count HEAD)
          TOTAL=$((BASE + TOTAL_ATUAL))

          export TOTAL

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          arquivo = Path("README.md")
          conteudo = arquivo.read_text(encoding="utf-8")

          padrao = r"(?m)^(\*\*Commits totais de toda a história do projeto\s*=\s*)\d+(\*\*)$"

          atualizado, quantidade = re.subn(
              padrao,
              lambda m: f"{m.group(1)}{os.environ['TOTAL']}{m.group(2)}",
              conteudo,
          )

          if quantidade == 0:
              raise SystemExit(
                  "Erro: a linha de total de commits não foi encontrada no README.md."
              )

          arquivo.write_text(atualizado, encoding="utf-8")
          PY

          git add "$ARQUIVO"

          if git diff --cached --quiet; then
            echo "O total de commits já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "docs: atualizar total de commits"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

  publicar:
    name: Publicar pacote npm
    runs-on: ubuntu-26.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mulher-amparada"
          package-manager-cache: false

      - name: Configurar autenticação
        working-directory: divulgacao
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular próxima versão
        id: versao
        working-directory: divulgacao
        shell: bash
        run: |
          NOME=$(node -p "require('./package.json').name")
          ATUAL=$(node -p "require('./package.json').version")

          PUBLICADA=$(npm view "$NOME" version \
            --registry=https://npm.pkg.github.com 2>/dev/null || true)

          if [ -n "$PUBLICADA" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PUBLICADA"
            NOVA="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            NOVA="$ATUAL"
          fi

          echo "version=$NOVA" >> "$GITHUB_OUTPUT"

      - name: Atualizar versão
        working-directory: divulgacao
        shell: bash
        env:
          NOVA_VERSAO: ${{ steps.versao.outputs.version }}
        run: |
          npm pkg set version="$NOVA_VERSAO"


      - name: Publicar pacote
        working-directory: divulgacao
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}