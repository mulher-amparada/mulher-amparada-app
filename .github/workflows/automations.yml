name: Automações do Mulher Amparada

on:
  push:
    branches:
      - '**'

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}


jobs:

  # =========================================================
  # COMPILAR APK
  # =========================================================

  build:

    name: Compilar APK Kotlin

    runs-on: ubuntu-24.04

    env:
      App1_DIR: "Código-fonte do app = Mulher Amparada"
      RELEASE_TAG: "app"
      RELEASE_APK_NAME: "app-debug-assinado.apk"

    steps:

      # =========================================================
      # BAIXAR CÓDIGO
      # =========================================================

      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      # =========================================================
      # VERIFICAR PROJETO
      # =========================================================

      - name: Verificar projeto
        run: |

          if [ ! -d "$App1_DIR" ]; then
            echo "ERRO: pasta não encontrada:"
            echo "$App1_DIR"
            exit 1
          fi

          if [ ! -f "$App1_DIR/gradlew" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi


      # =========================================================
      # JAVA
      # =========================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # VERIFICAR ANDROID SDK 37
      # =========================================================

      - name: Verificar Android SDK 37
        run: |

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Plataformas Android instaladas:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Plataformas 37 disponíveis:"
          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -name "android-37*"

          if ! find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -name "android-37*" \
            | grep -q .; then

            echo "ERRO: nenhuma plataforma Android 37 encontrada."
            exit 1
          fi


      # =========================================================
      # PERMISSÃO DO GRADLE
      # =========================================================

      - name: Dar permissão ao Gradle
        working-directory: ${{ env.App1_DIR }}
        run: chmod +x gradlew


      # =========================================================
      # COMPILAR APK
      # =========================================================

      - name: Compilar APK
        id: compilar_apk
        working-directory: ${{ env.App1_DIR }}
        run: |

          set -o pipefail

          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            {
              echo ""
              echo "# ❌ ERRO NA COMPILAÇÃO"
              echo ""
              echo "## 🔴 Etapa"
              echo ""
              echo "**Compilar APK**"
              echo ""
              echo "## 💥 O que aconteceu"
              echo ""
              echo "O Gradle não conseguiu compilar o APK."
              echo ""
              echo "## 📋 Erro do Gradle"
              echo ""
              echo '```text'
              tail -n 100 "$GITHUB_WORKSPACE/gradle-build.log"
              echo '```'
              echo ""
              echo "**Código de saída:** \`$STATUS\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$STATUS"
          fi


      # =========================================================
      # LOCALIZAR APK
      # =========================================================

      - name: Localizar APK
        id: apk
        working-directory: ${{ env.App1_DIR }}
        run: |

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # =========================================================
      # ASSINAR APK
      # =========================================================

      - name: Assinar APK
        working-directory: ${{ env.App1_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERRO: KEYSTORE_BASE64 não configurado."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERRO: KEYSTORE_PASSWORD não configurado."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERRO: KEY_ALIAS não configurado."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: KEY_PASSWORD não configurado."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > mulher-amparada.jks

          APK="${{ steps.apk.outputs.apk }}"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado:"
            echo "$APK"
            rm -f mulher-amparada.jks
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado."
            rm -f mulher-amparada.jks
            exit 1
          fi

          echo "Assinando APK..."

          "$APKSIGNER" sign \
            --ks mulher-amparada.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-assinado.apk \
            "$APK"

          mv app-assinado.apk "$APK"

          echo "Verificando assinatura..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          rm -f mulher-amparada.jks

          echo "APK assinado e verificado com sucesso."


      # =========================================================
      # PREPARAR APK DA RELEASE
      # =========================================================

      - name: Preparar APK da Release
        working-directory: ${{ env.App1_DIR }}
        run: |

          APK="${{ steps.apk.outputs.apk }}"

          cp "$APK" "$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

          echo "APK preparado:"
          echo "$GITHUB_WORKSPACE/$RELEASE_APK_NAME"


      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v6
        with:
          name: APK-Kotlin-Assinado
          path: "${{ github.workspace }}/${{ env.RELEASE_APK_NAME }}"
          if-no-files-found: error


      # =========================================================
      # TAMANHO REAL
      # =========================================================

      - name: Calcular tamanho real do APK
        id: apk_size
        run: |

          APK="$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          BYTES=$(stat -c%s "$APK")

          SIZE_MB=$(awk "BEGIN {
            printf \"%.2f\", $BYTES / 1024 / 1024
          }")

          SIZE_FORMATADO="${SIZE_MB} MB"

          echo "========================================"
          echo "TAMANHO REAL DO APK ASSINADO"
          echo "========================================"
          echo "Arquivo: $APK"
          echo "Bytes: $BYTES"
          echo "MB: $SIZE_FORMATADO"
          echo "========================================"

          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "size_formatado=$SIZE_FORMATADO" >> "$GITHUB_OUTPUT"


      # =========================================================
      # SHA-256
      # =========================================================

      - name: Calcular SHA-256
        id: sha256
        run: |

          APK="$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          echo "SHA-256:"
          echo "$SHA256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"


      # =========================================================
      # ATUALIZAR APK NO MAIN
      # =========================================================

      - name: Atualizar APK no main
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="${App1_DIR}/app-release.apk"

          cp "$GITHUB_WORKSPACE/$RELEASE_APK_NAME" "$TARGET"

          git fetch origin main

          git reset --hard origin/main

          cp "$GITHUB_WORKSPACE/$RELEASE_APK_NAME" "$TARGET"

          git add "$TARGET"

          if git diff --cached --quiet; then
            echo "APK já está atualizado."
          else
            git commit -m "Atualizar APK assinado [skip ci]"
            git push origin main
          fi


      # =========================================================
      # VERIFICAR RELEASE
      # =========================================================

      - name: Verificar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "ERRO: A Release '$RELEASE_TAG' não existe."
            exit 1
          fi

          echo "Release encontrada."


      # =========================================================
      # EXCLUIR APK ANTIGO
      # =========================================================

      - name: Excluir APK antigo da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          ASSET_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq ".assets[] | select(.name == \"$RELEASE_APK_NAME\") | .id" \
            | head -n 1)

          if [ -n "$ASSET_ID" ]; then

            echo "Excluindo APK antigo..."

            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"

            echo "APK antigo excluído."

          else

            echo "Nenhum APK antigo encontrado."

          fi


      # =========================================================
      # ENVIAR APK PARA RELEASE
      # =========================================================

      - name: Enviar APK para a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          gh release upload \
            "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/$RELEASE_APK_NAME" \
            --repo "$GITHUB_REPOSITORY"

          echo "Novo APK enviado para a Release."


      # =========================================================
      # ATUALIZAR SHA-256 DA RELEASE
      # =========================================================

      - name: Atualizar SHA-256 da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          SHA256="${{ steps.sha256.outputs.sha256 }}"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > release-notes.txt

          if grep -q "SHA-256 gerado nesta compilação:" release-notes.txt; then

            sed -i \
              "s/^SHA-256 gerado nesta compilação:.*$/SHA-256 gerado nesta compilação: $SHA256/" \
              release-notes.txt

          else

            printf '\n\nSHA-256 gerado nesta compilação: %s\n' "$SHA256" \
              >> release-notes.txt

          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.txt

          echo "SHA-256 atualizado:"
          echo "$SHA256"


      # =========================================================
      # ATUALIZAR download.html
      # =========================================================

      - name: Atualizar link, tamanho e SHA-256 no download.html
        working-directory: ${{ github.workspace }}
        run: |

          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$RELEASE_APK_NAME"

          APK_SIZE="${{ steps.apk_size.outputs.size_formatado }}"

          SHA256="${{ steps.sha256.outputs.sha256 }}"

          echo "Novo link:"
          echo "$ASSET_URL"

          echo "Tamanho REAL do APK:"
          echo "$APK_SIZE"

          echo "SHA-256:"
          echo "$SHA256"

          python3 - <<PY

          from pathlib import Path
          import re

          arquivo = Path("download.html")

          if not arquivo.exists():
              raise SystemExit(
                  "ERRO: download.html não encontrado."
              )

          texto = arquivo.read_text(
              encoding="utf-8"
          )

          novo_url = """$ASSET_URL"""
          novo_tamanho = """$APK_SIZE"""
          novo_sha256 = """$SHA256"""

          padrao_url = (
              r'(<a\s+class="download"\s+href=")'
              r'[^"]*'
              r'(")'
          )

          texto, quantidade_url = re.subn(
              padrao_url,
              lambda m:
                  m.group(1)
                  + novo_url
                  + m.group(2),
              texto,
              count=1
          )

          if quantidade_url == 0:
              raise SystemExit(
                  'ERRO: <a class="download" ...> não encontrado.'
              )

          padrao_resumo = (
              r'(<strong\s+class="summary-value">\s*)'
              r'(?:[0-9]+(?:[.,][0-9]+)?\s*MB)'
              r'(\s*</strong>)'
          )

          texto, quantidade_resumo = re.subn(
              padrao_resumo,
              lambda m:
                  m.group(1)
                  + novo_tamanho
                  + m.group(2),
              texto,
              count=1
          )

          if quantidade_resumo == 0:
              raise SystemExit(
                  "ERRO: tamanho no resumo não encontrado."
              )

          padrao_detalhe = (
              r'(<strong\s+class="detail-value">\s*)'
              r'≈?\s*[0-9]+(?:[.,][0-9]+)?\s*MB'
              r'(\s*</strong>)'
          )

          texto, quantidade_detalhe = re.subn(
              padrao_detalhe,
              lambda m:
                  m.group(1)
                  + "≈ "
                  + novo_tamanho
                  + m.group(2),
              texto,
              count=1
          )

          if quantidade_detalhe == 0:
              raise SystemExit(
                  "ERRO: tamanho nas informações do app não encontrado."
              )

          padrao_sha256 = (
              r'(<span\s+class="detail-title">\s*'
              r'Código SHA-256\s*'
              r'</span>\s*'
              r'<strong\s+class="detail-value">\s*)'
              r'[^<]*'
              r'(\s*</strong>)'
          )

          texto, quantidade_sha256 = re.subn(
              padrao_sha256,
              lambda m:
                  m.group(1)
                  + novo_sha256
                  + m.group(2),
              texto,
              count=1
          )

          if quantidade_sha256 == 0:
              raise SystemExit(
                  "ERRO: campo Código SHA-256 não encontrado."
              )

          arquivo.write_text(
              texto,
              encoding="utf-8"
          )

          print("download.html atualizado.")
          print("Novo link:", novo_url)
          print("Novo tamanho REAL do APK:", novo_tamanho)
          print("Novo SHA-256:", novo_sha256)

          PY


      # =========================================================
      # ENVIAR download.html PARA MAIN
      # =========================================================

      - name: Enviar download.html atualizado para o main
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add download.html

          if git diff --cached --quiet; then

            echo "download.html já está atualizado."

          else

            git commit -m "Atualizar link, tamanho e SHA-256 do APK [skip ci]"

            git push origin main

          fi


      # =========================================================
      # RESUMO
      # =========================================================

      - name: Mostrar resumo
        run: |

          echo "## Compilação concluída" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Release:** $RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** main" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Release recebe:** $RELEASE_APK_NAME" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Tamanho REAL do APK assinado:** ${{ steps.apk_size.outputs.size_formatado }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "**Tamanho em bytes:** ${{ steps.apk_size.outputs.bytes }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**SHA-256 do APK:**" \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

          echo "${{ steps.sha256.outputs.sha256 }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' \
            >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # ANALISAR TODAS AS LINGUAGENS DE PROGRAMAÇÃO
  # =========================================================

  linguagens:
    name: Analisar todas as linguagens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: publicar-divulgacao
    
    steps:
      - name: Baixar repositório completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar cloc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Analisar arquivos e linguagens
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p relatorios

          echo "Listando arquivos rastreados pelo Git..."

          git ls-files > /tmp/arquivos-repositorio.txt

          if [ ! -s /tmp/arquivos-repositorio.txt ]; then
            echo "::error::Nenhum arquivo rastreado pelo Git foi encontrado."
            exit 1
          fi

          echo "Quantidade de caminhos listados:"
          wc -l < /tmp/arquivos-repositorio.txt

          echo "Gerando relatório JSON..."

          cloc \
            --list-file=/tmp/arquivos-repositorio.txt \
            --json \
            --out=relatorios/linguagens.json

          echo "Gerando relatório Markdown..."

          cloc \
            --list-file=/tmp/arquivos-repositorio.txt \
            --md \
            --out=relatorios/linguagens.md

          test -s relatorios/linguagens.json
          test -s relatorios/linguagens.md

          python3 -m json.tool \
            relatorios/linguagens.json \
            > /dev/null

          echo "Relatórios gerados com sucesso."

      - name: Exibir relatório
        run: |
          cat relatorios/linguagens.md

      - name: Enviar relatórios como artifact
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-linguagens
          path: |
            relatorios/linguagens.json
            relatorios/linguagens.md
          if-no-files-found: error
          retention-days: 7
          
  # =========================================================
  # JEKYLL / GITHUB PAGES
  # =========================================================

  bot:
    name: Bot e análise de dados em Julia
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ================================================
      # BAIXAR REPOSITÓRIO
      # ================================================

      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ================================================
      # INSTALAR DEPENDÊNCIAS DO BOT C++
      # ================================================

      - name: Instalar dependências do bot
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libcurl4-openssl-dev \
            libssl-dev

      # ================================================
      # COMPILAR BOT
      # ================================================

      - name: Compilar bot
        run: |
          set -euo pipefail

          g++ \
            tools/automation_bot.cpp \
            -o automation-bot \
            -std=c++17 \
            -lcurl \
            -lssl \
            -lcrypto

      # ================================================
      # EXECUTAR MULHER AMPARADA BOT
      # ================================================

      - name: Executar Mulher Amparada Bot
        env:
          MULHER_AMPARADA_APP_ID: ${{ secrets.MULHER_AMPARADA_APP_ID }}
          MULHER_AMPARADA_INSTALLATION_ID: ${{ secrets.MULHER_AMPARADA_INSTALLATION_ID }}
          MULHER_AMPARADA_PRIVATE_KEY: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          chmod +x automation-bot
          ./automation-bot

      # ================================================
      # INSTALAR JULIA
      # ================================================

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      # ================================================
      # INSTALAR DEPENDÊNCIAS JULIA
      # ================================================

      - name: Instalar dependências Julia
        run: |
          set -euo pipefail

          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
          '

      # ================================================
      # EXECUTAR ANÁLISE DE DADOS
      # ================================================

      - name: Executar análise de dados em Julia
        run: |
          set -euo pipefail

          julia --project=. src/main.jl

      # ================================================
      # VALIDAR E PREPARAR RESULTADOS
      # ================================================

      - name: Preparar resultados do Mulher Amparada Bot
        shell: bash
        run: |
          set -euo pipefail

          CSV_ORIGINAL="dados/processados/ligue180-2019-processado.csv"
          PNG_ORIGINAL="relatorios/graficos/ligue180-2019.png"

          echo "========================================"
          echo "VALIDANDO RESULTADOS DA ANÁLISE JULIA"
          echo "========================================"

          if [ ! -s "$CSV_ORIGINAL" ]; then
            echo "::error::CSV processado não foi gerado ou está vazio: $CSV_ORIGINAL"
            exit 1
          fi

          if [ ! -s "$PNG_ORIGINAL" ]; then
            echo "::error::Gráfico não foi gerado ou está vazio: $PNG_ORIGINAL"
            exit 1
          fi

          mkdir -p \
            pacote-resultados/dados/processados \
            pacote-resultados/relatorios/graficos

          cp "$CSV_ORIGINAL" \
            pacote-resultados/dados/processados/

          cp "$PNG_ORIGINAL" \
            pacote-resultados/relatorios/graficos/

          echo ""
          echo "Resultados preparados:"
          ls -lh \
            pacote-resultados/dados/processados/ligue180-2019-processado.csv \
            pacote-resultados/relatorios/graficos/ligue180-2019.png

      # ================================================
      # PUBLICAR ARTEFATO PARA salvar-na-main
      # ================================================

      - name: Enviar resultados como artifact
        uses: actions/upload-artifact@v6
        with:
          name: resultados-ligue180
          path: pacote-resultados/
          if-no-files-found: error
          retention-days: 1
          
  build-site:

    runs-on: ubuntu-24.04

    needs: build

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # =========================================================
  # DEPLOY GITHUB PAGES
  # =========================================================

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    needs: build-site

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        
  # =========================================================
  # ATUALIZAR TOTAL DE COMMITS
  # =========================================================

  atualizar-commits:
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Baixar todo o histórico
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Atualizar total de commits
        run: |
          TOTAL=$(git rev-list --all --count)

          python3 - "$TOTAL" <<'PY'
          from pathlib import Path
          import re
          import sys

          total = sys.argv[1]
          arquivo = Path("README.md")
          texto = arquivo.read_text(encoding="utf-8")

          texto = re.sub(
              r"\*\*Commits totais de toda a história do projeto, \(feitos por mim e pelos workflows do github actions!\) =.*\*\*",
              f"**Commits totais de toda a história do projeto, (feitos por mim e pelos workflows do github actions!) = {total}**",
              texto,
              count=1
          )

          arquivo.write_text(texto, encoding="utf-8")
          PY

      - name: Enviar README atualizado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-readme
          path: README.md
          if-no-files-found: error


  # =========================================================
  # SINCRONIZAR README COM DEV.TO
  # =========================================================

  sincronizar-devto:
    name: Sincronizar README com DEV.to
    runs-on: ubuntu-24.04
    needs: salvar-na-main

    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Atualizar artigo no DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("README.md", "r", encoding="utf-8") as arquivo:
              markdown = arquivo.read()

          dados = json.dumps({
              "article": {
                  "body_markdown": markdown
              }
          }).encode("utf-8")

          requisicao = urllib.request.Request(
              "https://dev.to/api/articles/4771914",
              data=dados,
              method="PUT",
              headers={
                  "Content-Type": "application/json",
                  "api-key": os.environ["DEVTO_API_KEY"],
                  "User-Agent": "Mulher-Amparada-GitHub-Action"
              }
          )

          try:
              with urllib.request.urlopen(requisicao) as resposta:
                  print(resposta.read().decode("utf-8"))
                  print("DEV.to atualizado com sucesso.")
          except urllib.error.HTTPError as erro:
              print(f"HTTP {erro.code}")
              print(erro.read().decode("utf-8", errors="replace"))
              raise
          PY


  
  # =========================================================
  # GERAR SITEMAP
  # =========================================================

  sitemap:
    name: Gerar Sitemap
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Gerar Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://mulher-amparada.github.io/mulher-amparada-app/

      - name: Enviar Sitemap gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-sitemap
          path: sitemap.xml
          if-no-files-found: error


  # =========================================================
  # INDEXNOW
  # =========================================================

  indexnow:
    name: IndexNow
    runs-on: ubuntu-24.04
    needs:
      - deploy
      - bot
      - linguagens
      - publicar-divulgacao

    steps:
      - name: Enviar Sitemap ao IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: https://mulher-amparada.github.io/mulher-amparada-app/sitemap.xml
          key: ${{ secrets.INDEXNOW_KEY }}



  # =========================================================
  # LIGHTHOUSE
  # =========================================================

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://mulher-amparada.github.io/mulher-amparada-app/
          uploadArtifacts: true




  # =========================================================
  # PUBLICAR KIT DE DIVULGAÇÃO
  # =========================================================

  publicar-divulgacao:
    name: Publicar Kit de Divulgação
    runs-on: ubuntu-24.04
    

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Criar pacote de divulgação
        working-directory: divulgacao
        run: npm pack

      - name: Publicar pacote no GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: divulgacao
          name: Kit de Divulgação
          files: divulgacao/*.tgz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
# =========================================================
  # OBSERVATÓRIO — PNGs SEQUENCIAIS
  # =========================================================

  observatorio:
    name: Observatório
    runs-on: ubuntu-24.04
    needs: atualizar-commits

    steps:
      - name: Baixar repositório completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar dependências do Observatório
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y gcc libcairo2-dev

      - name: Compilar observatório
        run: |
          set -e

          gcc -O2 -Wall -Wextra \
            tools/observatorio.c \
            -o observatorio \
            $(pkg-config --cflags --libs cairo) \
            -lm

      - name: Executar observatório
        run: |
          set -e

          chmod +x observatorio

          # Remover somente os arquivos antigos do padrão
          # sequencial e o PNG legado, evitando artefatos obsoletos.
          mkdir -p docs/observatorio
          rm -f docs/observatorio/observatorio.png
          rm -f docs/observatorio/observatorio-[0-9]*.png

          ./observatorio

      - name: Verificar todos os mapas gerados
        run: |
          set -e

          DIR="docs/observatorio"

          COUNT=$(find "$DIR" -maxdepth 1 -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum PNG sequencial foi gerado."
            exit 1
          fi

          echo "Imagens encontradas: $COUNT"

          find "$DIR" -maxdepth 1 -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            -print | sort -V

          while IFS= read -r -d '' FILE; do
            if [ ! -s "$FILE" ]; then
              echo "ERRO: arquivo vazio: $FILE"
              exit 1
            fi

            file "$FILE"
          done < <(
            find "$DIR" -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex '.*/observatorio-[0-9]+\.png' \
              -print0
          )

          echo "Todos os PNGs sequenciais foram verificados."

      - name: Disponibilizar todos os mapas
        uses: actions/upload-artifact@v6
        with:
          name: observatorio
          path: docs/observatorio/observatorio-*.png
          if-no-files-found: error
          retention-days: 30

  # =========================================================
  # ATUALIZAR FOOTER COM README
  # =========================================================

  atualizar-footer:
    name: Atualizar Footer com README
    runs-on: ubuntu-24.04
    needs: atualizar-commits

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instalar dependência Python
        run: pip install Markdown

      - name: Atualizar footer com README
        run: python3 scripts/atualizar_footer.py

      - name: Enviar footer gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-footer
          path: index.html
          if-no-files-found: error


  # =========================================================
  # ATUALIZAR RELATÓRIO DE COMMITS
  # =========================================================

  atualizar-relatorio-commits:
    name: Atualizar relatório de commits
    runs-on: ubuntu-24.04
    needs: atualizar-commits

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Instalar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Gerar relatório de commits
        run: ruby scripts/commits.rb

      - name: Enviar relatório gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivos-relatorio-commits
          path: commits/
          if-no-files-found: error


  

# =========================================================
  # DOCUMENTAR WORKFLOW YAML
  # =========================================================

  pesquisar-projeto:
    name: Documentar workflow YAML
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Instalar PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Gerar documentação do workflow
        run: |
          set -e

          mkdir -p pesquisas

          php -l scripts/pesquisar_projeto.php
          php scripts/pesquisar_projeto.php

          if [ -f ".github/workflows/workflow.md" ]; then
            mv .github/workflows/workflow.md pesquisas/workflow.md
          fi

          test -s pesquisas/workflow.md

          echo "Documentação gerada:"
          ls -lh pesquisas/workflow.md

      - name: Enviar documentação do workflow como artifact
        uses: actions/upload-artifact@v6
        with:
          name: arquivos-pesquisas
          path: pesquisas/workflow.md
          if-no-files-found: error
          retention-days: 30
          

          

  
  salvar-na-main:
    name: Salvar todos os arquivos na main
    runs-on: ubuntu-24.04

    needs:
      - atualizar-commits
      - sitemap
      - atualizar-footer
      - atualizar-relatorio-commits
      - pesquisar-projeto
      - observatorio
      - bot
      - linguagens

    permissions:
      contents: write

    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Baixar README atualizado
        uses: actions/download-artifact@v7
        with:
          name: arquivo-readme
          path: artefatos/readme

      - name: Baixar Sitemap
        uses: actions/download-artifact@v7
        with:
          name: arquivo-sitemap
          path: artefatos/sitemap

      - name: Baixar Footer
        uses: actions/download-artifact@v7
        with:
          name: arquivo-footer
          path: artefatos/footer

      - name: Baixar relatório de commits
        uses: actions/download-artifact@v7
        with:
          name: arquivos-relatorio-commits
          path: artefatos/commits

      - name: Baixar pesquisas
        uses: actions/download-artifact@v7
        with:
          name: arquivos-pesquisas
          path: artefatos/pesquisas

      - name: Baixar Observatório
        uses: actions/download-artifact@v7
        with:
          name: observatorio
          path: artefatos/observatorio

      - name: Baixar resultados do bot
        uses: actions/download-artifact@v7
        with:
          name: resultados-ligue180
          path: artefatos/resultados

      - name: Baixar relatório de linguagens
        uses: actions/download-artifact@v7
        with:
          name: relatorio-linguagens
          path: artefatos/linguagens

      - name: Reunir arquivos gerados
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "REUNINDO ARQUIVOS GERADOS"
          echo "========================================"

          # README
          cp artefatos/readme/README.md README.md

          # SITEMAP
          cp artefatos/sitemap/sitemap.xml sitemap.xml

          # FOOTER
          cp artefatos/footer/index.html index.html

          # DIRETÓRIOS
          mkdir -p commits pesquisas docs/observatorio
          mkdir -p dados/processados relatorios/graficos relatorios

          # RELATÓRIO DE COMMITS
          cp -a artefatos/commits/. commits/

          # PESQUISAS
          cp -a artefatos/pesquisas/. pesquisas/

          # OBSERVATÓRIO
          rm -f docs/observatorio/observatorio.png
          rm -f docs/observatorio/observatorio-[0-9]*.png

          COUNT=$(find artefatos/observatorio \
            -maxdepth 1 \
            -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Nenhum PNG sequencial recebido."
            find artefatos/observatorio -maxdepth 2 -type f -print || true
            exit 1
          fi

          find artefatos/observatorio \
            -maxdepth 1 \
            -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            -exec cp -f {} docs/observatorio/ \;

          COPIED=$(find docs/observatorio \
            -maxdepth 1 \
            -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            | wc -l)

          echo "Mapas recebidos: $COUNT"
          echo "Mapas copiados: $COPIED"

          if [ "$COPIED" -ne "$COUNT" ]; then
            echo "::error::A quantidade de PNGs copiados diverge."
            exit 1
          fi

          # VALIDAR TODOS OS PNGs
          while IFS= read -r -d '' FILE; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Arquivo vazio: $FILE"
              exit 1
            fi

            file "$FILE"
          done < <(
            find docs/observatorio \
              -maxdepth 1 \
              -type f \
              -regextype posix-extended \
              -regex '.*/observatorio-[0-9]+\.png' \
              -print0
          )

          # CORRIGIR LOCALIZAÇÃO DA DOCUMENTAÇÃO
          if [ -f "pesquisas/.github/workflows/workflow.md" ]; then
            mv \
              "pesquisas/.github/workflows/workflow.md" \
              "pesquisas/workflow.md"
          fi

          # RESULTADOS DO BOT E DA ANÁLISE EM JULIA
          BOT_CSV="artefatos/resultados/dados/processados/ligue180-2019-processado.csv"
          BOT_PNG="artefatos/resultados/relatorios/graficos/ligue180-2019.png"

          if [ ! -s "$BOT_CSV" ]; then
            echo "::error::CSV processado do Ligue 180 ausente ou vazio."
            exit 1
          fi

          if [ ! -s "$BOT_PNG" ]; then
            echo "::error::Gráfico do Ligue 180 ausente ou vazio."
            exit 1
          fi

          cp "$BOT_CSV" \
            dados/processados/ligue180-2019-processado.csv

          cp "$BOT_PNG" \
            relatorios/graficos/ligue180-2019.png

          # RELATÓRIOS DE LINGUAGENS
          LANG_JSON="artefatos/linguagens/linguagens.json"
          LANG_MD="artefatos/linguagens/linguagens.md"

          if [ ! -s "$LANG_JSON" ]; then
            echo "::error::Relatório JSON de linguagens ausente ou vazio."
            exit 1
          fi

          if [ ! -s "$LANG_MD" ]; then
            echo "::error::Relatório Markdown de linguagens ausente ou vazio."
            exit 1
          fi

          python3 -m json.tool "$LANG_JSON" > /dev/null

          cp "$LANG_JSON" relatorios/linguagens.json
          cp "$LANG_MD" relatorios/linguagens.md

          # VALIDAR ARQUIVOS PRINCIPAIS
          test -s README.md
          test -s sitemap.xml
          test -s index.html
          test -s pesquisas/workflow.md
          test -s dados/processados/ligue180-2019-processado.csv
          test -s relatorios/graficos/ligue180-2019.png
          test -s relatorios/linguagens.json
          test -s relatorios/linguagens.md

          if ! find docs/observatorio \
            -maxdepth 1 \
            -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            -print -quit | grep -q .; then
            echo "::error::Nenhum PNG sequencial válido encontrado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "ARQUIVOS REUNIDOS"
          echo "========================================"

          echo "README:"
          ls -lh README.md

          echo "Sitemap:"
          ls -lh sitemap.xml

          echo "Footer:"
          ls -lh index.html

          echo "Relatórios de commits:"
          find commits -maxdepth 1 \
            -type f \
            -name "commits_*.md" \
            -print | sort

          echo "Pesquisas:"
          ls -lh pesquisas/workflow.md

          echo "Observatório:"
          find docs/observatorio \
            -maxdepth 1 \
            -type f \
            -regextype posix-extended \
            -regex '.*/observatorio-[0-9]+\.png' \
            -print | sort -V

          echo "Resultados do bot:"
          ls -lh dados/processados/ligue180-2019-processado.csv
          ls -lh relatorios/graficos/ligue180-2019.png

          echo "Relatórios de linguagens:"
          ls -lh relatorios/linguagens.json
          ls -lh relatorios/linguagens.md

          echo "Quantidade de mapas: $COPIED"
          echo "Todos os arquivos foram reunidos."

      - name: Salvar todas as alterações em um commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "PREPARANDO COMMIT"
          echo "========================================"

          git add \
            README.md \
            index.html \
            sitemap.xml \
            commits/ \
            pesquisas/ \
            docs/observatorio/ \
            dados/processados/ligue180-2019-processado.csv \
            relatorios/graficos/ligue180-2019.png \
            relatorios/linguagens.json \
            relatorios/linguagens.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          echo ""
          echo "Arquivos que serão salvos:"
          git diff --cached --name-status

          git commit -m "Atualizar arquivos gerados [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo "TODOS OS ARQUIVOS FORAM SALVOS NA MAIN"
          echo "========================================"

          echo "- README.md"
          echo "- index.html"
          echo "- sitemap.xml"
          echo "- commits/"
          echo "- pesquisas/"
          echo "- docs/observatorio/observatorio-*.png"
          echo "- dados/processados/ligue180-2019-processado.csv"
          echo "- relatorios/graficos/ligue180-2019.png"
          echo "- relatorios/linguagens.json"
          echo "- relatorios/linguagens.md"
