name: Apagar tudo da branch A

on:
  workflow_dispatch:
  push:
    branches:
      - A

permissions:
  contents: write

jobs:
  apagar:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/A'

    steps:
      - name: Apagar todos os arquivos
        uses: actions/checkout@v4
        with:
          ref: A
          fetch-depth: 0

      - name: Remover tudo
        run: |
          git rm -r -f --ignore-unmatch .
          git clean -fdx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Apagar tudo da branch A"
          git push origin HEAD:A
