name: Pesquisar projeto

on:
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/workflow.md"

permissions:
  contents: write
  
concurrency:
  group: pesquisar-projeto
  cancel-in-progress: false

jobs:
  pesquisar-projeto:
    name: Gerar documentação dos workflows
    runs-on: ubuntu-26.04

    steps:
      - name: Baixar repositório completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: none
          coverage: none

      - name: Verificar arquivos necessários
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "scripts/pesquisar_projeto.php" ]; then
            echo "Erro: scripts/pesquisar_projeto.php não encontrado."
            exit 1
          fi

          if [ ! -f ".github/workflows/automations.yml" ]; then
            echo "Erro: .github/workflows/automations.yml não encontrado."
            exit 1
          fi

      - name: Executar pesquisar_projeto.php
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs
          php -l scripts/pesquisar_projeto.php
          php scripts/pesquisar_projeto.php

          if [ ! -s "pesquisas/workflow.md" ]; then
            echo "Erro: pesquisas/workflow.md não foi gerado corretamente."
            exit 1
          fi

      - name: Salvar documentação no GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pesquisas/workflow.md

          if git diff --cached --quiet; then
            echo "A documentação já está atualizada."
            exit 0
          fi

          git commit -m "docs: atualizar documentação dos workflows"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main