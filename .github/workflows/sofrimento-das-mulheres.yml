name: Executar Main Julia

on:
  push:
    branches:
      - main
    paths:
      - 'src/main.jl'
      - '.github/workflows/main-julia.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-julia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-julia:
    name: Executar src/main.jl
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Verificar versao do Julia
        run: julia --version

      - name: Verificar arquivo principal
        run: |
          if [ ! -f src/main.jl ]; then
            echo "Erro: src/main.jl nao encontrado."
            exit 1
          fi

      - name: Executar programa
        run: julia --startup-file=no src/main.jl