name: Integrar Mulher Amparada ao Safe Woman Operational System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clonar projeto do Mulher Amparada
        run: |
          git clone --depth=1 \
            https://github.com/mulher-amparada/mulher-amparada-app.git \
            /tmp/mulher-amparada

      - name: Copiar código-fonte
        run: |
          SOURCE="/tmp/mulher-amparada/Código-fonte do app = Mulher Amparada"
          DEST="Safe Woman Operational System/packages/apps/MulherAmparada"

          mkdir -p "$DEST"

          rsync -a \
            --exclude='*.apk' \
            --exclude='**/*.apk' \
            --exclude='.gradle/' \
            --exclude='build/' \
            --exclude='**/build/' \
            "$SOURCE/" \
            "$DEST/"

      - name: Remover APKs restantes
        run: |
          find "Safe Woman Operational System/packages/apps/MulherAmparada" \
            -type f \
            \( -iname "*.apk" -o -iname "*.aab" \) \
            -delete

      - name: Salvar na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Safe Woman Operational System/packages/apps/MulherAmparada"

          git commit \
            -m "Adicionar código-fonte do Mulher Amparada ao Safe Woman Operational System" \
            || echo "Nenhuma alteração para commit"

          git push origin HEAD:main