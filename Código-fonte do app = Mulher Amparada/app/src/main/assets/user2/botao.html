<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

        name="description"
        content="Mulher Amparada é um projeto de tecnologia voltado à proteção, segurança e assistência em situações de emergência."

<title>Meus Acessos</title>

<style>
/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("file:///android_asset/font.ttf") format("truetype");
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: transparent;

    --surface: #E8E8E8;
    --surface-hover: #f8f8fb;
    --surface-active: #f0f0f5;

    --surface-soft: #f5f5f8;

    --border: rgba(20,20,35,.075);
    --border-strong: rgba(20,20,35,.14);

    --text: #18181d;
    --text-soft: #62626d;
    --text-muted: #888894;

    --purple: #7040e8;
    --purple-light: #8b5cf6;
    --purple-soft: rgba(112,64,232,.10);

    --pink: #e73576;
    --pink-soft: rgba(231,53,118,.10);

    --red: #e94359;
    --red-soft: rgba(233,67,89,.08);
    --red-border: rgba(233,67,89,.20);

    --shadow:
        0 18px 45px rgba(30,30,50,.08);

    --shadow-soft:
        0 8px 25px rgba(30,30,50,.065);

    --radius-large: 28px;
    --radius: 21px;
    --radius-small: 16px;

}

/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;

    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;

}

html {

    width: 100%;
    min-height: 100%;

    scroll-behavior: smooth;

}

body {

    width: 100%;
    min-height: 100vh;

    position: relative;

    color: var(--text);

    font-family: "Quicksand", sans-serif;

    overflow-x: hidden;

    background:
 
        var(--bg);

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;

}


/* =========================================================
   TEXTURA DE SEGURANÇA
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .035;

    background-image:
        linear-gradient(
            rgba(255,255,255,.5) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.5) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 70%
        );

    z-index: -1;

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    padding:
        clamp(22px, 5vw, 36px)
        clamp(18px, 5vw, 34px)
        70px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    width: 100%;

    min-height: 310px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        20px
        0
        70px;

    position: relative;

}


/* =========================================================
   LINHA DECORATIVA DO HERO
========================================================= */

.hero::before {

    content: "";

    position: absolute;

    top: 10px;

    left: 50%;

    transform: translateX(-50%);

    width: 42px;
    height: 3px;

    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--purple-light),
            transparent
        );

    opacity: .8;

}


/* =========================================================
   ÍCONE PRINCIPAL
========================================================= */

.heroIcon {

    width: 104px;
    height: 104px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    margin: 0 auto 24px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            #8b5cf6,
            #6425d9
        );

    border: 1px solid rgba(255,255,255,.16);

    box-shadow:
        0 20px 45px rgba(124,58,237,.25),
        inset 0 1px 0 rgba(255,255,255,.18);

}


/* brilho externo */

.heroIcon::before {

    content: "";

    position: absolute;

    inset: -9px;

    border-radius: 38px;

    border: 1px solid rgba(167,139,250,.14);

}


/* segundo brilho */

.heroIcon::after {

    content: "";

    position: absolute;

    inset: -17px;

    border-radius: 46px;

    border: 1px solid rgba(167,139,250,.055);

}


.heroIcon img {

    width: 50px;
    height: 50px;

    display: block;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 10px rgba(0,0,0,.25)
        );

}


/* =========================================================
   TÍTULO
========================================================= */

.heroTag {

    width: 100%;

    min-height: auto;

    color: #000;

    font-family: "Quicksand", sans-serif;

    font-size:
        clamp(30px, 8vw, 44px);

    font-weight: 800;

    line-height: 1.05;

    letter-spacing: -1.2px;

    text-align: center;

    text-shadow:
        0 8px 30px rgba(0,0,0,.35);

}


/* =========================================================
   SUBTÍTULO
========================================================= */

.heroSubtitle {

    max-width: 460px;

    margin-top: 15px;

    color: var(--text-soft);

    font-size:
        clamp(14px, 3.8vw, 16px);

    font-weight: 500;

    line-height: 1.55;

    text-align: center;

}


/* =========================================================
   INDICADOR DE PROTEÇÃO
========================================================= */

.heroSubtitle::after {

    content: "•  Área protegida";

    display: block;

    margin-top: 16px;

    color: #91889f;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.7px;

    text-transform: uppercase;

}


/* =========================================================
   SEÇÕES
========================================================= */

.section {

    width: 100%;

    margin-bottom: 42px;

}


/* =========================================================
   CABEÇALHO DA SEÇÃO
========================================================= */

.sectionHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

    padding:
        0
        4px;

}


/* =========================================================
   TÍTULO DA SEÇÃO
========================================================= */

.sectionTitle {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #000;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.8px;

    line-height: 1;

    text-transform: uppercase;

}


/* indicador */

.sectionTitle::before {

    content: "";

    width: 6px;
    height: 6px;

    flex: 0 0 6px;

    border-radius: 50%;

    background: var(--pink);

    box-shadow:
        0 0 0 4px var(--pink-soft),
        0 0 12px rgba(255,63,130,.25);

}


/* =========================================================
   LISTA
========================================================= */

.list {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 10px;

}


/* =========================================================
   CARTÕES / BOTÕES
========================================================= */

.btn {

    width: 100%;

    min-height: 82px;

    display: flex;

    align-items: center;

    position: relative;

    padding:
        15px
        16px;

    gap: 15px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        ),
        var(--surface);

    color: var(--text);

    font-family: "Quicksand", sans-serif;

    text-align: left;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        var(--shadow-soft);

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;

}


/* brilho interno */

.btn::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.035),
            transparent 40%
        );

    opacity: .8;

}


/* linha lateral */

.btn::after {

    content: "";

    position: absolute;

    left: 0;
    top: 17px;
    bottom: 17px;

    width: 2px;

    border-radius: 10px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(167,139,250,.45),
            transparent
        );

    opacity: 0;

    transition:
        opacity .18s ease;

}


/* =========================================================
   HOVER
========================================================= */

.btn:hover {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        ),
        var(--surface-hover);

    border-color:
        var(--border-strong);

    box-shadow:
        0 14px 35px rgba(0,0,0,.28);

}


.btn:hover::after {

    opacity: 1;

}


/* =========================================================
   TOQUE
========================================================= */

.btn:active {

    transform:
        scale(.985);

    background:
        var(--surface-active);

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);

}


/* =========================================================
   ÍCONE
========================================================= */

.emoji {

    width: 50px;
    height: 50px;

    flex: 0 0 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

    border-radius: 0;

    overflow: visible;

}




.emoji img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

}

.section:last-child .emoji svg {
    width: 38px !important;
    height: 38px !important;
    min-width: 38px !important;
    min-height: 38px !important;
    max-width: 38px !important;
    max-height: 38px !important;
    display: block !important;
    margin: auto !important;
}   

/* =========================================================
   CONTEÚDO
========================================================= */

.content {

    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 5px;

}


/* =========================================================
   TÍTULO
========================================================= */

.title {

    color: #000;

    font-size: 15px;

    font-weight: 750;

    line-height: 1.25;

    white-space: normal;

    overflow: hidden;

    text-overflow: clip;

}


/* =========================================================
   DESCRIÇÃO
========================================================= */

.description {

    color: var(--text-muted);

    font-size: 12px;

    font-weight: 500;

    line-height: 1.35;

    white-space: normal;

    overflow: hidden;

    text-overflow: clip;

}


/* =========================================================
   SETA
========================================================= */

.arrow {

    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #666671;

    background:
        rgba(255,255,255,.025);

    transition:
        transform .18s ease,
        color .18s ease,
        background .18s ease;

}


.arrow svg {

    width: 17px;
    height: 17px;

}


.btn:hover .arrow {

    color: #aaaab5;

    background:
        rgba(255,255,255,.055);

    transform:
        translateX(2px);

}


/* =========================================================
   CARTÕES DE APLICATIVO
========================================================= */

.appCard {

    min-height: 84px;

}


.appCard .emoji {

    width: 50px;
    height: 50px;

    flex-basis: 50px;

    border-radius: 16px;

}


/* =========================================================
   EMERGÊNCIA
========================================================= */

.section:has(.emergency) {

    margin-top: 4px;

    padding-top: 8px;

}


/* separador visual */

.section:has(.emergency)::before {

    content: "";

    display: block;

    width: 100%;

    height: 1px;

    margin:
        0
        0
        27px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,83,104,.18),
            transparent
        );

}


/* cartão */

.emergency {

    min-height: 88px;

    border:
        1px solid var(--red-border);

    background:
        linear-gradient(
            135deg,
            rgba(255,83,104,.085),
            rgba(255,83,104,.025)
        ),
        #100a0d;

    box-shadow:
        0 14px 35px rgba(255,40,65,.055);

}


/* faixa vermelha */

.emergency::after {

    content: "";

    position: absolute;

    left: 0;

    top: 15px;
    bottom: 15px;

    width: 3px;

    border-radius: 0 8px 8px 0;

    background:
        linear-gradient(
            to bottom,
            #ff5368,
            #ff304d
        );

    opacity: 1;

}


/* ícone emergência */

.emergency .emoji {

    background:
        rgba(255,83,104,.09);

    border-color:
        rgba(255,83,104,.16);

}


/* título */

.emergency .title {

    color:
        #ff6c7d;

}


/* descrição */

.emergency .description {

    color:
        #a7656e;

}


/* seta */

.emergency .arrow {

    color:
        #b64b5b;

    background:
        #642020;

}


.emergency:hover {

    border-color:
        rgba(255,83,104,.35);

    background:
        linear-gradient(
            135deg,
            rgba(255,83,104,.12),
            rgba(255,83,104,.035)
        ),
        #110a0d;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.emptyState {

    display: none;

    width: 100%;

    padding:
        38px
        20px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:
        var(--surface);

    text-align: center;

    box-shadow:
        var(--shadow-soft);

}


.emptyIcon {

    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin:
        0 auto 14px;

    border-radius:
        16px;

    background:
        rgba(255,255,255,.045);

    color:
        #8b8b94;

}


.emptyIcon svg {

    width: 23px;
    height: 23px;

}


/* =========================================================
   ÚLTIMA SEÇÃO
========================================================= */

.section:last-child {

    margin-bottom: 10px;

}


/* =========================================================
   RESPONSIVIDADE
========================================================= */

@media (max-width: 380px) {

    .container {

        padding-left: 15px;
        padding-right: 15px;

    }

    .btn {

        padding:
            13px;

        gap: 12px;

    }

    .emoji {

        width: 46px;
        height: 46px;

        flex-basis: 46px;

    }

    .arrow {

        width: 30px;
        height: 30px;

        flex-basis: 30px;

    }

    .title {

        font-size: 14px;

    }

    .description {

        font-size: 11px;

    }

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

.btn:focus-visible {

    outline:
        2px solid
        rgba(167,139,250,.8);

    outline-offset:
        3px;

}

/* =========================================================
   TODOS OS SVGs — PRETO
========================================================= */

svg {
    color: #000000 !important;
    stroke: #000000 !important;
}

/* Elementos desenhados */
svg path,
svg circle,
svg ellipse,
svg line,
svg polyline,
svg polygon,
svg rect {
    stroke: #000000 !important;
}

/* SVGs preenchidos */
.section:last-child .emoji svg path,
.section:last-child .emoji svg circle,
.section:last-child .emoji svg ellipse,
.section:last-child .emoji svg line,
.section:last-child .emoji svg polyline,
.section:last-child .emoji svg polygon,
.section:last-child .emoji svg rect {
    fill: #000000 !important;
}

/* SVGs carregados por <img> — preto */
.emoji img[src$=".svg"] {
    filter: brightness(0) saturate(100%) !important;
}

@media (prefers-reduced-motion: reduce) {

    html {

        scroll-behavior: auto;

    }

    *,
    *::before,
    *::after {

        animation:
            none !important;

        transition:
            none !important;

    }

}

</style>



</head>

<script>

/* =========================================================
   NAVEGAÇÃO ENTRE PÁGINAS HTML
========================================================= */

function ir(pagina) {

    if (
        typeof pagina !== "string" ||
        pagina.trim() === ""
    ) {
        return false;
    }

    try {

        window.location.href = pagina;

        return true;

    } catch (erro) {

        console.error(
            "Erro ao navegar para:",
            pagina,
            erro
        );

        return false;

    }

}


/* =========================================================
   ANDROID BRIDGE
========================================================= */

function androidCall(metodo) {

    if (
        typeof metodo !== "string" ||
        metodo.trim() === ""
    ) {
        console.warn("Método Android inválido.");
        return false;
    }


    try {

        /*
         * Verifica se a interface Android existe.
         */

        if (
            typeof Android === "undefined" ||
            Android === null
        ) {

            console.warn(
                "Interface Android não disponível."
            );

            return false;

        }


        /*
         * Verifica se o método realmente existe
         * no WebAppInterface.
         */

        if (
            typeof Android[metodo] !== "function"
        ) {

            console.warn(
                "Método Android não encontrado:",
                metodo
            );

            return false;

        }


        /*
         * Executa o método.
         */

        Android[metodo]();

        return true;

    } catch (erro) {

        console.error(
            "Erro ao executar método Android:",
            metodo,
            erro
        );

        return false;

    }

}



/* =========================================================
   DESATIVAR MENU DE CONTEXTO
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    },
    false
);



</script>
