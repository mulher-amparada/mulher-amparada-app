
name: Mulher Amparada - Android 17

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Código-fonte do app = Mulher Amparada/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar e assinar APK
    runs-on: ubuntu-26.04

    env:
      PROJECT_DIR: 'Código-fonte do app = Mulher Amparada'

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar SDK Android 17 e Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --channel=3 --install \
            "platforms;android-37" \
            "platform-tools"

          PACKAGE_LIST="$RUNNER_TEMP/sdk-packages.txt"

          sdkmanager --channel=3 --list > "$PACKAGE_LIST"

          BUILD_TOOLS_VERSION="$(
            grep -oE 'build-tools;37\.[0-9.]+' "$PACKAGE_LIST" \
              | sort -Vu \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "::error::Não foi encontrada uma versão dos Build Tools 37."
            exit 1
          fi

          sdkmanager --channel=3 --install "$BUILD_TOOLS_VERSION"

          echo "BUILD_TOOLS_VERSION=${BUILD_TOOLS_VERSION#build-tools;}" \
            >> "$GITHUB_ENV"

      - name: Localizar Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            WRAPPER="$GITHUB_WORKSPACE/$PROJECT_DIR/gradlew"
            PROJECT_ROOT="$GITHUB_WORKSPACE/$PROJECT_DIR"
          elif [ -f "$GITHUB_WORKSPACE/gradlew" ]; then
            WRAPPER="$GITHUB_WORKSPACE/gradlew"
            PROJECT_ROOT="$GITHUB_WORKSPACE"
          else
            echo "::error::Gradle Wrapper não encontrado."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          bash "${{ steps.gradle.outputs.wrapper }}" \
            -p "${{ steps.gradle.outputs.project }}" \
            --no-daemon \
            assembleRelease

      - name: Verificar secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for NAME in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Configure o secret $NAME nas configurações do repositório."
              exit 1
            fi
          done

      - name: Preparar keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/mulher-amparada.p12"

          chmod 600 "$RUNNER_TEMP/mulher-amparada.p12"

      - name: Localizar APK e ferramentas
        id: files
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"

          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::apksigner não encontrado."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS/zipalign" ]; then
            echo "::error::zipalign não encontrado."
            exit 1
          fi

          APK="$(
            find "${{ steps.gradle.outputs.project }}" \
              -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              ! -name '*androidTest*' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK Release foi encontrado."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Alinhar e assinar APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artefatos"

          "${{ steps.files.outputs.build_tools }}/zipalign" \
            -f -p 4 \
            "${{ steps.files.outputs.apk }}" \
            "$RUNNER_TEMP/aligned.apk"

          "${{ steps.files.outputs.build_tools }}/apksigner" sign \
            --ks "$RUNNER_TEMP/mulher-amparada.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Verificar assinatura
        shell: bash
        run: |
          set -euo pipefail

          "${{ steps.files.outputs.build_tools }}/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: mulher-amparada-android-17
          path: artefatos/mulher-amparada-release.apk
          if-no-files-found: error
          retention-days: 14
