<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Calc</title>

<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

/* Chrome, Edge, Safari, Android WebView */
*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

/* Firefox */
* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
    
        -webkit-backface-visibility: hidden;
    backface-visibility: hidden;

    -webkit-transform: translateZ(0);
    transform: translateZ(0);
}

/* Página */
html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html.launcher-loading,
html.launcher-loading body {
    background: #000;
}


/* Remove qualquer fundo da área de rolagem */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}

:root {
    --bg: #000;
    --button: #151515;
    --button-hover: #202020;
    --action: #6F7AFF;
    --action-hover: #686DFF;
    --operator: #3DA7FF;
    --operator-hover: #61B7FF;
    --text: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

@keyframes transformar {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes elementPopIn {
    0% {
        opacity: 0;
        transform: scale(.9);
    }

    55% {
        opacity: 1;
        transform: scale(1.025);
    }
    
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}



body {
    
    
width: 90%;
    display: flex;
    align-items: center;
    justify-content: center;

    margin-left: 5%;
    margin-right: 5%;
margin-top: 30%;

    overflow-x: hidden;
}


/* =====================================================
   CALCULADORA
===================================================== */

.calculadora {
    width: min(100%, 430px);

    display: flex;
    flex-direction: column;

    gap: clamp(12px, 3vw, 22px);
}


/* =====================================================
   VISOR
===================================================== */

.tela {
    width: 100%;
    max-width: 430px;

    /*
     * Altura controlada.
     * O conteúdo NÃO pode aumentar o visor.
     */
    height: clamp(
        125px,
        24dvh,
        220px
    );


    min-height: 125px;
    max-height: 220px;

    /*
     * Sem margin-bottom.
     * O body centraliza a calculadora inteira.
     */
    margin: 0;

    padding: clamp(
        18px,
        5vw,
        30px
    );

    display: block;

    position: relative;

    min-width: 0;

    background: var(--bg);

    color: var(--text);

    border-radius: 20px;

    font-size: clamp(
        38px,
        11vw,
        64px
    );

    font-weight: 600;

    line-height: 1.05;

    text-align: right;

    /*
     * ROLAGEM NOS DOIS EIXOS
     */
    overflow-x: auto;
    overflow-y: auto;

    /*
     * Permite arrastar horizontal
     * e verticalmente no Android.
     */
    touch-action: pan-x pan-y;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    /*
     * QUEBRA DE LINHA
     */
    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;

    /*
     * Scrollbar invisível
     */
    scrollbar-width: none;

    -ms-overflow-style: none;

    /*
     * Impede seleção
     */
    user-select: none;

    -webkit-user-select: none;
    
    margin-bottom: 5%;
}

/* =====================================================
   GRID DOS BOTÕES
===================================================== */

.botoes {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: clamp(8px, 2.5vw, 14px);
    margin-top: 3%:
    
}


/* =====================================================
   BOTÕES
===================================================== */

button {
    width: 100%;

    aspect-ratio: 1 / 1;

    min-width: 0;
    min-height: 0;

    border: 0;
    outline: 0;

    border-radius: 200px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--button);
    color: var(--text);

    font-size: clamp(20px, 6vw, 27px);
    font-weight: 600;

    padding: 0;
    margin: 0;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


/* =====================================================
   ZERO
===================================================== */

.zero {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;
    margin: 0;

    border-radius: 200px;
}


/* =====================================================
   HOVER
===================================================== */

button:hover {
    background: var(--button-hover);
}


/* =====================================================
   CLIQUE
===================================================== */

button:active {
    transform: scale(.90);
}


/* =====================================================
   BOTÕES DE AÇÃO
===================================================== */

.acao {
    background: var(--action);
}

.acao:hover {
    background: var(--action-hover);
}


/* =====================================================
   OPERADORES
===================================================== */

.operador,
.igual {
    background: var(--operator);
}

.operador:hover,
.igual:hover {
    background: var(--operator-hover);
}

.operador:active,
.igual:active {
    background: var(--operator-hover);
}


/* =====================================================
   SVG
===================================================== */

svg {
    width: clamp(23px, 7vw, 31px);
    height: clamp(23px, 7vw, 31px);

    pointer-events: none;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .calculadora {
        gap: 10px;
    }

    .botoes {
        gap: 7px;
    }

    .tela {
        min-height: 100px;

        padding: 15px;

        font-size: 34px;
    }

    button {
        font-size: 19px;
    }

    svg {
        width: 23px;
        height: 23px;
    }
}


/* =====================================================
   TELAS GRANDES
===================================================== */

@media (min-width: 600px) {

    .calculadora {
        width: min(90vw, 430px);
    }
}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media (max-height: 700px) {

    body {
        align-items: flex-start;

        padding-top: 8px;
        padding-bottom: 8px;
    }

    .calculadora {
        margin-top: 0;
    }

    .tela {
        min-height: 105px;
    }
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) and (max-height: 600px) {

    body {
        align-items: center;

        overflow-y: auto;
    }

    .calculadora {
        width: min(90vw, 650px);

        display: grid;

        grid-template-columns: .9fr 1.4fr;

        align-items: center;

        gap: 25px;
    }

    .tela {
        min-height: 260px;

        font-size: clamp(36px, 7vw, 58px);
    }

    .botoes {
        gap: 8px;
    }

    button {
        font-size: clamp(18px, 4vw, 25px);
    }
}

/* =====================================================
   POP-UP PERSONALIZADO
===================================================== */

.modal-overlay {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 24px;

    background: #000;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .18s ease,
        visibility .18s ease;


}


.modal-overlay.aberto {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.modal {

    width: min(100%, 360px);

    padding: 24px;

    border-radius: 26px;

    background: #151515;

    color: #fff;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, .65);

    transform:
        scale(.92)
        translateY(8px);

    transition:
        transform .18s ease;
}


.modal-overlay.aberto .modal {

    transform:
        scale(1)
        translateY(0);
}


.modal-titulo {

    margin-bottom: 10px;

    color: #fff;

    font-size: 22px;

    font-weight: 700;

    text-align: left;
}


.modal-mensagem {

    color: #d0d0d0;

    font-size: 16px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;
}


.modal-input {

    display: none;

    width: 100%;

    height: 52px;

    margin-top: 18px;

    padding: 0 16px;

    border: 1px solid #353535;

    outline: none;

    border-radius: 16px;

    background: #080808;

    color: #fff;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 17px;

    font-weight: 600;

    transition:
        border-color .15s ease;
}


.modal-input:focus {

    border-color:
        #6F7AFF;
}


.modal-botoes {

    display: flex;

    gap: 10px;

    margin-top: 22px;
}


.modal-botoes button {

    width: 100%;

    height: 48px;

    aspect-ratio: auto;

    border: 0;

    border-radius: 16px;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


.modal-botoes button:active {

    transform:
        scale(.94);
}


.modal-cancelar {

    background:
        #252525;

    color:
        #fff;
}


.modal-cancelar:hover {

    background:
        #303030;
}


.modal-confirmar {

    background:
        #6F7AFF;

    color:
        #fff;
}


.modal-confirmar:hover {

    background:
        #686DFF;
}


@media (max-width: 360px) {

    .modal {

        padding: 20px;

        border-radius: 22px;
    }

    .modal-titulo {

        font-size: 20px;
    }

    .modal-mensagem {

        font-size: 15px;
    }

}

</style>

</head>

<body>

<div class="calculadora">

    <!-- =================================================
         VISOR
    ================================================== -->
<div
        class="tela"
        id="display"
        tabindex="0"
        role="status"
        aria-live="polite"
        aria-label="Visor da calculadora"
    >

        <span id="displayTexto">
            0
        </span>

    </div>



    <!-- =================================================
         TECLADO
    ================================================== -->

    <div class="botoes">

        <!-- ================= LINHA 1 ================= -->

        <button
            type="button"
            class="acao"
            onclick="limpar()"
            aria-label="Limpar calculadora"
        >
            AC
        </button>

        <button
            type="button"
            class="acao"
            onclick="apagar()"
            aria-label="Apagar último caractere"
        >
<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="m560-424 76 76q11 11 28 11t28-11q11-11 11-28t-11-28l-76-76 76-76q11-11 11-28t-11-28q-11-11-28-11t-28 11l-76 76-76-76q-11-11-28-11t-28 11q-11 11-11 28t11 28l76 76-76 76q-11 11-11 28t11 28q11 11 28 11t28-11l76-76ZM360-160q-19 0-36-8.5T296-192L116-432q-16-21-16-48t16-48l180-240q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360Zm0-80h440v-480H360L180-480l180 240Zm130-240Z"/></svg>
        </button>

        <button
            type="button"
            class="acao"
            onclick="porcentagem()"
            aria-label="Porcentagem"
        >
            %
        </button>

        <button
            type="button"
            class="operador"
            onclick="operacao('/')"
            aria-label="Divisão"
        >
            ÷
        </button>


        <!-- ================= LINHA 2 ================= -->

        <button
            type="button"
            onclick="add('7')"
            aria-label="7"
        >7</button>

        <button
            type="button"
            onclick="add('8')"
            aria-label="8"
        >8</button>

        <button
            type="button"
            onclick="add('9')"
            aria-label="9"
        >9</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('*')"
            aria-label="Multiplicação"
        >
            ×
        </button>


        <!-- ================= LINHA 3 ================= -->

        <button
            type="button"
            onclick="add('4')"
            aria-label="4"
        >4</button>

        <button
            type="button"
            onclick="add('5')"
            aria-label="5"
        >5</button>

        <button
            type="button"
            onclick="add('6')"
            aria-label="6"
        >6</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('-')"
            aria-label="Subtração"
        >
            −
        </button>


        <!-- ================= LINHA 4 ================= -->

        <button
            type="button"
            onclick="add('1')"
            aria-label="1"
        >1</button>

        <button
            type="button"
            onclick="add('2')"
            aria-label="2"
        >2</button>

        <button
            type="button"
            onclick="add('3')"
            aria-label="3"
        >3</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('+')"
            aria-label="Adição"
        >
            +
        </button>


        <!-- ================= LINHA 5 ================= -->

        <button
            type="button"
            class="especial"
            onclick="add('(')"
            aria-label="Parêntese esquerdo"
        >
            ()
        </button>

<button
    type="button"
    class="zero"
    onclick="add('0')"
    aria-label="0"
>
    0
</button>

        <button
            type="button"
            onclick="add('.')"
            aria-label="Ponto decimal"
        >
            .
        </button>

        <button
            type="button"
            class="igual"
            onclick="calcular()"
            aria-label="Calcular resultado"
        >
            =
        </button>

    </div>

</div>

<!-- =====================================================
     POP-UP PERSONALIZADO
===================================================== -->

<div
    class="modal-overlay"
    id="modalOverlay"
    aria-hidden="true"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitulo"
    >

        <div
            class="modal-titulo"
            id="modalTitulo"
        >
            Aviso
        </div>

        <div
            class="modal-mensagem"
            id="modalMensagem"
        ></div>

        <input
            id="modalInput"
            class="modal-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
        >

        <div class="modal-botoes">

            <button
                type="button"
                class="modal-cancelar"
                id="modalCancelar"
            >
                Cancelar
            </button>

            <button
                type="button"
                class="modal-confirmar"
                id="modalConfirmar"
            >
                OK
            </button>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const elementos = document.querySelectorAll("button, .tela");

    elementos.forEach((elemento, index) => {

        elemento.style.opacity = "0";

        requestAnimationFrame(() => {

            elemento.style.animation =
                "elementPopIn .65s ease forwards";

        });

    });

});
</script>

</body>
</html>
