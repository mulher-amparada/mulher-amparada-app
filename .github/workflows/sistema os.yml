name: Preparar Safe Woman Operational System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar-os:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Criar estrutura do OS
        run: |
          mkdir -p \
            "Safe Woman Operational System/packages/apps/MulherAmparada" \
            "Safe Woman Operational System/device/cuttlefish" \
            "Safe Woman Operational System/product/etc/permissions"

      - name: Baixar configuração do Cuttlefish
        run: |
          git clone \
            --depth=1 \
            https://android.googlesource.com/device/google/cuttlefish \
            /tmp/cuttlefish

          cp -a /tmp/cuttlefish/. \
            "Safe Woman Operational System/device/cuttlefish/"

          rm -rf /tmp/cuttlefish

      - name: Criar Android.bp do Mulher Amparada
        run: |
          cat > \
            "Safe Woman Operational System/packages/apps/MulherAmparada/Android.bp" <<'EOF'
          android_app {
              name: "MulherAmparada",
              privileged: true,
              srcs: [
                  "src/**/*.kt",
                  "src/**/*.java",
              ],
              manifest: "AndroidManifest.xml",
          }
          EOF

      - name: Criar allowlist de permissões privilegiadas
        run: |
          cat > \
            "Safe Woman Operational System/product/etc/permissions/privapp-permissions-mulher-amparada.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="com.mulheres">
              </privapp-permissions>
          </permissions>
          EOF

      - name: Criar AndroidManifest inicial
        run: |
          cat > \
            "Safe Woman Operational System/packages/apps/MulherAmparada/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mulheres">

              <application
                  android:label="Mulher Amparada"
                  android:hasCode="true">
              </application>

          </manifest>
          EOF

      - name: Salvar na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Safe Woman Operational System"

          git commit \
            -m "Preparar integração do Mulher Amparada ao Safe Woman Operational System" \
            || echo "Nenhuma alteração para commit"

          git push origin HEAD:main