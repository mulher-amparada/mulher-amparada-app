<title>Neo Calc</title>

<style>
/* =========================================================
   BARRAS DE ROLAGEM — TOTALMENTE TRANSPARENTES
========================================================= */

/* Chrome, Edge, Safari, Android WebView */
*::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: transparent;
    border: none;
}

/* Firefox */
* {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
    
        -webkit-backface-visibility: hidden;
    backface-visibility: hidden;

    -webkit-transform: translateZ(0);
    transform: translateZ(0);
}

/* Página */
html,
body {
    scrollbar-width: none;
    scrollbar-color: transparent transparent;
}

html.launcher-loading,
html.launcher-loading body {
    background: #000;
}


/* Remove qualquer fundo da área de rolagem */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    height: 0;
    background: transparent;
}

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}

:root {

    --button: #151515;
    --button-hover: #202020;
    --action: #6F7AFF;
    --action-hover: #686DFF;
    --operator: #3DA7FF;
    --operator-hover: #61B7FF;
    --text: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

@keyframes transformar {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}



html,
body {
    width: 100%;
    min-height: 100%;
    
}



body {
    
    
width: 90%;
    display: flex;
    align-items: center;
    justify-content: center;

    margin-left: 5%;
    margin-right: 5%;
margin-top: 30%;

    overflow-x: hidden;
}


/* =====================================================
   CALCULADORA
===================================================== */

.calculadora {
    width: min(100%, 430px);

    display: flex;
    flex-direction: column;

    gap: clamp(12px, 3vw, 22px);
}


/* =====================================================
   VISOR
===================================================== */

.tela {
    width: 100%;
    max-width: 430px;

    /*
     * Altura controlada.
     * O conteúdo NÃO pode aumentar o visor.
     */
    height: clamp(
        125px,
        24dvh,
        220px
    );


    min-height: 125px;
    max-height: 220px;

    /*
     * Sem margin-bottom.
     * O body centraliza a calculadora inteira.
     */
    margin: 0;

    padding: clamp(
        18px,
        5vw,
        30px
    );

    display: block;

    position: relative;

    min-width: 0;

    background: var(--bg);

    color: var(--text);

    border-radius: 20px;

    font-size: clamp(
        38px,
        11vw,
        64px
    );

    font-weight: 600;

    line-height: 1.05;

    text-align: right;

    /*
     * ROLAGEM NOS DOIS EIXOS
     */
    overflow-x: auto;
    overflow-y: auto;

    /*
     * Permite arrastar horizontal
     * e verticalmente no Android.
     */
    touch-action: pan-x pan-y;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    /*
     * QUEBRA DE LINHA
     */
    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;

    /*
     * Scrollbar invisível
     */
    scrollbar-width: none;

    -ms-overflow-style: none;

    /*
     * Impede seleção
     */
    user-select: none;

    -webkit-user-select: none;
    
    margin-bottom: 5%;
}

/* =====================================================
   GRID DOS BOTÕES
===================================================== */

.botoes {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: clamp(8px, 2.5vw, 14px);
    margin-top: 3%:
    
}


/* =====================================================
   BOTÕES
===================================================== */

button {
    width: 100%;

    aspect-ratio: 1 / 1;

    min-width: 0;
    min-height: 0;

    border: 0;
    outline: 0;

    border-radius: 200px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--button);
    color: var(--text);

    font-size: clamp(20px, 6vw, 27px);
    font-weight: 600;

    padding: 0;
    margin: 0;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


/* =====================================================
   ZERO
===================================================== */

.zero {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;
    margin: 0;

    border-radius: 200px;
}


/* =====================================================
   HOVER
===================================================== */

button:hover {
    background: var(--button-hover);
}


/* =====================================================
   CLIQUE
===================================================== */

button:active {
    transform: scale(.90);
}


/* =====================================================
   BOTÕES DE AÇÃO
===================================================== */

.acao {
    background: var(--action);
}

.acao:hover {
    background: var(--action-hover);
}


/* =====================================================
   OPERADORES
===================================================== */

.operador,
.igual {
    background: var(--operator);
}

.operador:hover,
.igual:hover {
    background: var(--operator-hover);
}

.operador:active,
.igual:active {
    background: var(--operator-hover);
}


/* =====================================================
   SVG
===================================================== */

svg {
    width: clamp(23px, 7vw, 31px);
    height: clamp(23px, 7vw, 31px);

    pointer-events: none;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .calculadora {
        gap: 10px;
    }

    .botoes {
        gap: 7px;
    }

    .tela {
        min-height: 100px;

        padding: 15px;

        font-size: 34px;
    }

    button {
        font-size: 19px;
    }

    svg {
        width: 23px;
        height: 23px;
    }
}


/* =====================================================
   TELAS GRANDES
===================================================== */

@media (min-width: 600px) {

    .calculadora {
        width: min(90vw, 430px);
    }
}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media (max-height: 700px) {

    body {
        align-items: flex-start;

        padding-top: 8px;
        padding-bottom: 8px;
    }

    .calculadora {
        margin-top: 0;
    }

    .tela {
        min-height: 105px;
    }
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) and (max-height: 600px) {

    body {
        align-items: center;

        overflow-y: auto;
    }

    .calculadora {
        width: min(90vw, 650px);

        display: grid;

        grid-template-columns: .9fr 1.4fr;

        align-items: center;

        gap: 25px;
    }

    .tela {
        min-height: 260px;

        font-size: clamp(36px, 7vw, 58px);
    }

    .botoes {
        gap: 8px;
    }

    button {
        font-size: clamp(18px, 4vw, 25px);
    }
}

/* =====================================================
   POP-UP PERSONALIZADO
===================================================== */

.modal-overlay {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 24px;

    background: #000;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .18s ease,
        visibility .18s ease;


}


.modal-overlay.aberto {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.modal {

    width: min(100%, 360px);

    padding: 24px;

    border-radius: 26px;

    background: #151515;

    color: #fff;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, .65);

    transform:
        scale(.92)
        translateY(8px);

    transition:
        transform .18s ease;
}


.modal-overlay.aberto .modal {

    transform:
        scale(1)
        translateY(0);
}


.modal-titulo {

    margin-bottom: 10px;

    color: #fff;

    font-size: 22px;

    font-weight: 700;

    text-align: left;
}


.modal-mensagem {

    color: #d0d0d0;

    font-size: 16px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;
}


.modal-input {

    display: none;

    height: 52px;

    padding: 0 16px;

    border: 1px solid #353535;

    outline: none;

    border-radius: 16px;

    background: #080808;

    color: #fff;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 17px;

    font-weight: 600;

    transition:
        border-color .15s ease;
}


.modal-input:focus {

    border-color:
        #6F7AFF;
}


.modal-botoes {

    display: flex;

    gap: 10px;

    margin-top: 22px;
}


.modal-botoes button {

    width: 100%;

    height: 48px;

    aspect-ratio: auto;

    border: 0;

    border-radius: 16px;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


.modal-botoes button:active {

    transform:
        scale(.94);
}


.modal-cancelar {

    background:
        #252525;

    color:
        #fff;
}


.modal-cancelar:hover {

    background:
        #303030;
}


.modal-confirmar {

    background:
        #6F7AFF;

    color:
        #fff;
}


.modal-confirmar:hover {

    background:
        #686DFF;
}


@media (max-width: 360px) {

    .modal {

        padding: 20px;

        border-radius: 22px;
    }

    .modal-titulo {

        font-size: 20px;
    }

    .modal-mensagem {

        font-size: 15px;
    }

}

@media (prefers-reduced-motion: reduce) {
    /* Procura por QUALQUER elemento que use a sua animação e a desativa */

    * {
        animation-name: none !important;
    }
}


</style>



</head>

<script>

/* =====================================================
   POP-UP PERSONALIZADO
===================================================== */

const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );

const modalTitulo =
    document.getElementById(
        "modalTitulo"
    );

const modalMensagem =
    document.getElementById(
        "modalMensagem"
    );

const modalInput =
    document.getElementById(
        "modalInput"
    );

const modalCancelar =
    document.getElementById(
        "modalCancelar"
    );

const modalConfirmar =
    document.getElementById(
        "modalConfirmar"
    );


let modalResolve = null;


/* =====================================================
   ABRIR MODAL
===================================================== */

function abrirModal({
    titulo = "Aviso",
    mensagem = "",
    input = false,
    valor = "",
    cancelar = true,
    confirmarTexto = "OK"
}) {

    return new Promise(resolve => {

        modalResolve = resolve;

        modalTitulo.textContent =
            titulo;

        modalMensagem.textContent =
            mensagem;

        modalInput.style.display =
            input
                ? "block"
                : "none";

        modalInput.value =
            valor;

        modalCancelar.style.display =
            cancelar
                ? "flex"
                : "none";

        modalConfirmar.textContent =
            confirmarTexto;

        modalOverlay.classList.add(
            "aberto"
        );

        modalOverlay.setAttribute(
            "aria-hidden",
            "false"
        );


        if (input) {

            setTimeout(() => {

                modalInput.focus();

            }, 180);

        } else {

            setTimeout(() => {

                modalConfirmar.focus();

            }, 180);

        }

    });
}


/* =====================================================
   FECHAR MODAL
===================================================== */

function fecharModal(resultado) {

    modalOverlay.classList.remove(
        "aberto"
    );

    modalOverlay.setAttribute(
        "aria-hidden",
        "true"
    );


    if (modalResolve) {

        const resolver =
            modalResolve;

        modalResolve = null;

        resolver(resultado);
    }
}


/* =====================================================
   BOTÃO CONFIRMAR
===================================================== */

modalConfirmar.addEventListener(
    "click",
    () => {

        fecharModal({

            confirmado: true,

            valor:
                modalInput.value

        });

    }
);


/* =====================================================
   BOTÃO CANCELAR
===================================================== */

modalCancelar.addEventListener(
    "click",
    () => {

        fecharModal({

            confirmado: false,

            valor: null

        });

    }
);


/* =====================================================
   ENTER NO INPUT
===================================================== */

modalInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            fecharModal({

                confirmado: true,

                valor:
                    modalInput.value

            });

        }

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            !modalOverlay.classList.contains(
                "aberto"
            )
        ) {

            return;
        }


        if (
            event.key === "Escape"
        ) {

            event.preventDefault();

            fecharModal({

                confirmado: false,

                valor: null

            });

        }

    }
);


/* =====================================================
   PROMPT PERSONALIZADO
===================================================== */

async function promptPersonalizado(
    mensagem,
    valorInicial = "",
    titulo = "Digite"
) {

    const resultado =
        await abrirModal({

            titulo:
                titulo,

            mensagem:
                mensagem,

            input:
                true,

            valor:
                valorInicial,

            cancelar:
                true,

            confirmarTexto:
                "OK"

        });


    if (
        !resultado.confirmado
    ) {

        return null;
    }


    return resultado.valor;
}


/* =====================================================
   ALERT PERSONALIZADO
===================================================== */

async function alertPersonalizado(
    mensagem,
    titulo = "Aviso"
) {

    await abrirModal({

        titulo:
            titulo,

        mensagem:
            mensagem,

        input:
            false,

        cancelar:
            false,

        confirmarTexto:
            "OK"

    });

}


/* =====================================================
   CONFIRM PERSONALIZADO
===================================================== */

async function confirmPersonalizado(
    mensagem,
    titulo = "Confirmação"
) {

    const resultado =
        await abrirModal({

            titulo:
                titulo,

            mensagem:
                mensagem,

            input:
                false,

            cancelar:
                true,

            confirmarTexto:
                "Confirmar"

        });


    return resultado.confirmado;
}


/* =====================================================
   CHAVES
===================================================== */

const CHAVE_SENHA =
    "senha";

const CHAVE_RECUPERACAO =
    "nome_recuperacao";


/* =====================================================
   ELEMENTOS
===================================================== */

const display =
    document.getElementById(
        "display"
    );


const displayTexto =
    document.getElementById(
        "displayTexto"
    );


/* =====================================================
   ESTADO
===================================================== */

let expr = "";

let contadorToques = 0;

let timerToques = null;


/* =====================================================
   ROLAGEM DO VISOR
===================================================== */

function rolarVisor() {

    requestAnimationFrame(() => {

        display.scrollLeft =
            display.scrollWidth -
            display.clientWidth;


        display.scrollTop =
            display.scrollHeight -
            display.clientHeight;

    });
}


/* =====================================================
   SENHA
===================================================== */

async function inicializarSenha() {

    let senhaSalva = "";


    try {

        senhaSalva =
            String(
                Cripto.carregar(
                    CHAVE_SENHA
                ) || ""
            ).trim();

    } catch (e) {

        senhaSalva = "";
    }


    if (senhaSalva) {

        atualizar();

        return;
    }


    const novaSenha =
        await promptPersonalizado(
            "Crie uma senha",
            "",
            "Criar senha"
        );


    if (
        !novaSenha ||
        !novaSenha.trim()
    ) {

        location.reload();

        return;
    }


    const resposta =
        await promptPersonalizado(
            "Como você gosta de ser chamada?",
            "",
            "Recuperação"
        );


    if (
        !resposta ||
        !resposta.trim()
    ) {

        location.reload();

        return;
    }


    try {

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );


        Cripto.salvar(
            CHAVE_RECUPERACAO,
            resposta
                .trim()
                .toLowerCase()
        );

    } catch (e) {

        await alertPersonalizado(
            "Não foi possível salvar os dados."
        );

        return;
    }


    location.reload();
}


/* =====================================================
   VISOR
===================================================== */

function atualizar() {

    displayTexto.textContent =
        expr.length
            ? expr
            : "0";


    rolarVisor();
}


/* =====================================================
   ADICIONAR
===================================================== */

function add(valor) {

    if (valor === ".") {

        const partes =
            expr.split(
                /[+\-*/()]/
            );


        const parteAtual =
            partes[
                partes.length - 1
            ];


        if (
            parteAtual.includes(".")
        ) {

            return;
        }
    }


    expr += valor;

    atualizar();
}


/* =====================================================
   OPERAÇÃO
===================================================== */

function operacao(op) {

    if (!expr) {

        if (op === "-") {

            expr = "-";

            atualizar();
        }

        return;
    }


    if (
        /[+\-*/]$/.test(expr)
    ) {

        expr =
            expr.slice(0, -1) +
            op;

    } else {

        expr += op;
    }


    atualizar();
}


/* =====================================================
   PORCENTAGEM
===================================================== */

function porcentagem() {

    if (!expr) {

        return;
    }


    expr =
        expr.replace(
            /(\d+(?:\.\d+)?)$/,
            "($1/100)"
        );


    atualizar();
}


/* =====================================================
   LIMPAR
===================================================== */

function limpar() {

    expr = "";

    atualizar();
}


/* =====================================================
   APAGAR
===================================================== */

function apagar() {

    expr =
        expr.slice(0, -1);

    atualizar();
}


/* =====================================================
   CALCULAR
===================================================== */

function calcular() {

    const senha =
        String(
            Cripto.carregar(
                CHAVE_SENHA
            ) || ""
        ).trim();


    /*
     * Senha especial
     */

    if (
        expr.trim() !== "" &&
        expr.trim() === senha
    ) {

        window.location.href =
            "file:///android_asset/user1/index2.html";

        return;
    }


    if (!expr.trim()) {

        return;
    }


    try {

        const resultado =
            Function(
                '"use strict";return (' +
                expr +
                ')'
            )();


        if (
            typeof resultado ===
                "number" &&

            Number.isFinite(
                resultado
            )
        ) {

            expr =
                String(resultado);


            displayTexto.textContent =
                expr;


            rolarVisor();

            return;
        }

    } catch (e) {}


    mostrarMensagem(
        "Erro"
    );

    expr = "";
}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tempo = 1000
) {

    displayTexto.textContent =
        texto;


    rolarVisor();


    clearTimeout(
        mostrarMensagem.timer
    );


    mostrarMensagem.timer =
        setTimeout(
            atualizar,
            tempo
        );
}


/* =====================================================
   RECUPERAÇÃO DE SENHA
===================================================== */

async function recuperarSenha() {

    let respostaSalva = "";


    try {

        respostaSalva =
            String(
                Cripto.carregar(
                    CHAVE_RECUPERACAO
                ) || ""
            )
            .toLowerCase()
            .trim();

    } catch (e) {

        mostrarMensagem(
            "Erro",
            1500
        );

        return;
    }


    const resposta =
        await promptPersonalizado(
            "Como você gosta de ser chamada?",
            "",
            "Recuperar senha"
        );


    if (
        !resposta ||

        resposta
            .toLowerCase()
            .trim() !==
        respostaSalva
    ) {

        mostrarMensagem(
            "Resposta incorreta",
            1500
        );

        return;
    }


    const novaSenha =
        await promptPersonalizado(
            "Digite a nova senha",
            "",
            "Nova senha"
        );


    if (
        !novaSenha ||
        !novaSenha.trim()
    ) {

        return;
    }


    const confirmarSenha =
        await promptPersonalizado(
            "Confirme a nova senha",
            "",
            "Confirmar senha"
        );


    if (
        confirmarSenha !==
        novaSenha
    ) {

        mostrarMensagem(
            "Senhas diferentes",
            1500
        );

        return;
    }


    try {

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );

    } catch (e) {

        mostrarMensagem(
            "Erro ao salvar",
            1500
        );

        return;
    }


    const trocarResposta =
        await confirmPersonalizado(
            "Deseja alterar a resposta de recuperação?"
        );


    if (trocarResposta) {

        const novaResposta =
            await promptPersonalizado(
                "Como você gosta de ser chamada?",
                "",
                "Nova resposta"
            );


        if (
            novaResposta &&
            novaResposta.trim()
        ) {

            try {

                Cripto.salvar(
                    CHAVE_RECUPERACAO,
                    novaResposta
                        .trim()
                        .toLowerCase()
                );

            } catch (e) {

                mostrarMensagem(
                    "Erro ao salvar",
                    1500
                );

                return;
            }
        }
    }


    expr = "";


    mostrarMensagem(
        "Senha alterada",
        1500
    );
}


/* =====================================================
   CINCO TOQUES
===================================================== */

function registrarToque() {

    contadorToques++;


    clearTimeout(
        timerToques
    );


    if (
        contadorToques >= 5
    ) {

        contadorToques = 0;

        recuperarSenha();

        return;
    }


    timerToques =
        setTimeout(
            () => {

                contadorToques = 0;

            },
            2000
        );
}


display.addEventListener(
    "click",
    registrarToque
);


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
    "keydown",
    e => {

        if (
            /^\d$/.test(
                e.key
            )
        ) {

            add(e.key);

        } else if (
            [
                "+",
                "-",
                "*",
                "/"
            ].includes(e.key)
        ) {

            operacao(e.key);

        } else if (
            e.key === "."
        ) {

            add(".");

        } else if (
            e.key === "Backspace"
        ) {

            apagar();

        } else if (
            e.key === "Escape"
        ) {

            limpar();

        } else if (
            e.key === "Enter" ||
            e.key === "="
        ) {

            calcular();

        } else if (
            e.key === "%"
        ) {

            porcentagem();
        }

    }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

inicializarSenha();

atualizar();

</script>
