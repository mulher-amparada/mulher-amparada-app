name: Amparada IA - testes e C
on:
  push:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
  pull_request:
    paths:
      - "Amparada IA/**"
      - ".github/workflows/amparada-ia.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Amparada IA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Compilar runtime C
        run: cc -O2 -std=c11 -Wall -Wextra -pedantic c_runtime/amparada.c -lm -o /tmp/amparada-c
