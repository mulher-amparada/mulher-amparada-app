<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Controle</title>

<style>

/* =========================================================
   FADE OUT
========================================================= */

@keyframes fadeOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }

}

.mainUI.saindo {

    animation:
        fadeOut .65s ease
        forwards;

}


/* =========================================================
   ENTRADA
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================================
   ROLAGEM
========================================================= */

*::-webkit-scrollbar {

    width: 0;
    height: 0;
    background: transparent;

}

* {

    scrollbar-width: none;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family:
        "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-weight:
        400 800;

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg:
        #000000;

    --white:
        #ffffff;

    --text:
        #f7f7fa;

    --muted:
        #676c78;

    --pink:
        #ff3f82;

    --pink-light:
        #ff6b9f;

    --blue:
        #4f8cff;

    --blue-light:
        #8eb4ff;

    --orange:
        #ff9f43;

    --orange-light:
        #ffc071;

    --purple:
        #8b5cf6;

    --purple-light:
        #b79aff;

    --red:
        #ff4054;

    --red-light:
        #ff7180;

    --cyan:
        #27c9c1;

    --cyan-light:
        #6ee9e2;

    --border:
        #ffffff12;

    --radius:
        26px;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    font-family:
        "Quicksand",
        sans-serif;

    font-weight:
        700;

}


html,
body {

    width:
        100%;

    min-height:
        100%;

    background:
        #000000;

    color:
        var(--text);

}


html {

    background:
        #000000;

}


body {

    min-height:
        100vh;

    overflow-x:
        hidden;

    background:
        #000000;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);

}


/* =========================================================
   LAYOUT
========================================================= */

.mainUI {

    width:
        100%;

    max-width:
        700px;

    margin:
        0 auto;

    padding:
        30px 18px 120px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        31px;

    animation:
        pageIn .55s ease;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    width:
        100%;

    padding:
        4px 4px 0;

}


.heroTopLine {

    width:
        43px;

    height:
        3px;

    margin-bottom:
        18px;

    border-radius:
        999px;

    background:
        var(--pink);

}


.heroTitle {

    color:
        #ffffff;

    font-size:
        clamp(
            32px,
            7vw,
            48px
        );

    font-weight:
        800;

    line-height:
        .98;

    letter-spacing:
        -1.2px;

    white-space:
        nowrap;

}


.heroSubtitle {

    max-width:
        410px;

    margin-top:
        14px;

    color:
        #85858e;

    font-size:
        11px;

    font-weight:
        600;

    line-height:
        1.5;

    letter-spacing:
        .15px;

}


/* =========================================================
   SEÇÃO
========================================================= */

.section {

    width:
        100%;

    display:
        flex;

    flex-direction:
        column;

    gap:
        11px;

}


/* =========================================================
   LABEL
========================================================= */

.label {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding-left:
        3px;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        800;

    letter-spacing:
        1.8px;

    text-transform:
        uppercase;

}


.label::before {

    content:
        "";

    width:
        5px;

    height:
        5px;

    flex-shrink:
        0;

    border-radius:
        50%;

    background:
        var(--pink);

}


/* =========================================================
   CARD
========================================================= */

.actionCard {

    width:
        100%;

    min-height:
        88px;

    position:
        relative;

    overflow:
        hidden;

    display:
        grid;

    grid-template-columns:
        52px
        minmax(0, 1fr)
        40px;

    column-gap:
        13px;

    align-items:
        center;

    padding:
        17px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    color:
        #ffffff;

    cursor:
        pointer;

    text-align:
        left;

    outline:
        none;

    -webkit-appearance:
        none;

    appearance:
        none;

    isolation:
        isolate;

    transition:
        filter .18s ease,
        border-color .18s ease;

}


/* =========================================================
   BRILHO DO CARD
========================================================= */

.actionCard::before {

    content:
        "";

    position:
        absolute;

    width:
        190px;

    height:
        190px;

    top:
        -135px;

    right:
        -65px;

    border-radius:
        50%;

    background:
        #ffffff0d;

    pointer-events:
        none;

    z-index:
        -1;

}





/* =========================================================
   ÍCONE
========================================================= */

.actionIcon {

    width:
        52px;

    height:
        52px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        17px;

    background:
        #ffffff16;

    color:
        #ffffff;

}


.actionIcon svg {

    width:
        28px;

    height:
        28px;

    display:
        block;

    fill:
        currentColor;

}


/* =========================================================
   CONTEÚDO
========================================================= */

.actionTitle {

    min-width:
        0;

    color:
        #ffffff;

    font-size:
        15px;

    font-weight:
        800;

    line-height:
        1.2;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

white-space:
        normal;

    overflow:
        hidden;

    text-overflow:
        clip;
}


.actionDescription {

    display:
        block;

    min-width:
        0;

    max-width:
        100%;

    margin-top:
        4px;

    color:
        #ffffffb8;

    font-size:
        10px;

    font-weight:
        600;

    line-height:
        1.3;

    white-space:
        normal;

    overflow:
        hidden;

    text-overflow:
        clip;

}

/* =========================================================
   SETA
========================================================= */

.actionArrow {

    width:
        40px;

    height:
        40px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #ffffffc7;

    background:
        #18181d;

    border:
        1px solid #303038;

    border-radius:
        14px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        27px;

    font-weight:
        300;

    line-height:
        1;

}
.actionArrow svg {

    width:
        19px;

    height:
        19px;

}

/* =========================================================
   CORES
========================================================= */

.policia {

    --accent:
        var(--blue);

    background:
        linear-gradient(
            145deg,
            #182744,
            #0f1829
        );

    border-color:
        #4f8cff38;

}


.policia .actionIcon {

    background:
        #4f8cff22;

    color:
        var(--blue-light);

}


.samu {

    --accent:
        var(--orange);

    background:
        linear-gradient(
            145deg,
            #2a2116,
            #171109
        );

    border-color:
        #ff9f4338;

}

    background:
        #ff9f4320;

    color:
        var(--orange-light);

}


.mulher {

        var(--pink);

    background:
        linear-gradient(
            145deg,
            #281521,
            #170c12
        );

    border-color:
        #ff3f8238;

}


.mulher .actionIcon {

    background:
        #ff3f8220;

    color:
        var(--pink-light);

}


.localizacao {

        var(--cyan);

        96px;

        linear-gradient(
            145deg,
            #112b2b,
            #0b1717

    border-color:
        #27c9c138;

}

    background:
        #27c9c120;

    color:
        var(--cyan-light);

}


.contato {

        var(--purple);

        linear-gradient(
            145deg,

            #120e20

        #8b5cf638;

.contato .actionIcon {

    background:
        #8b5cf622;

    color:
        var(--purple-light);

}


.sos {

    --accent:
        var(--red);

    background:
        linear-gradient(
            145deg,
            #2b171d,
            #170b0e

    border-color:
        #ff405438;

}

    background:
        #ff405422;

    color:

/* =========================================================
   INTERAÇÃO
========================================================= */

.actionCard:active {

    filter:
        brightness(1.12);

}


.actionCard:hover {

    filter:
        brightness(1.06);

    border-color:
        #ffffff28;

}


.actionCard:focus-visible {

    outline:
        2px solid #ffffffb8;

    outline-offset:
        3px;

}

</style>

</head>

<script>

/* =========================================================
   UTILITÁRIOS
========================================================= */

function vibrar(duracao = 100) {

    try {

        if (
            navigator.vibrate &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(duracao);

        }

    } catch (e) {}

}


function chamarAndroid(nome, ...args) {

    try {

        if (
            window.Android &&
            typeof window.Android[nome] === "function"
        ) {

            return window.Android[nome](...args);

        }

    } catch (e) {

        console.warn(
            "Android." + nome,
            e
        );

    }

    return null;

}


/* =========================================================
   LIGAÇÃO
========================================================= */

function ligar(numero) {

    if (!numero) {
        return;
    }

    vibrar(60);

    try {

        window.location.href =
            "tel:" + numero;

    } catch (e) {

        alert(
            "Não foi possível iniciar a ligação."
        );

    }

}


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

function enviarLocalizacao() {

    if (!navigator.geolocation) {

        alert(
            "A geolocalização não é suportada neste dispositivo."
        );

        return;

    }

    vibrar(60);

    navigator.geolocation.getCurrentPosition(

        function(pos) {

            const latitude =
                pos.coords.latitude;

            const longitude =
                pos.coords.longitude;

            const link =
                "https://maps.google.com/?q=" +
                latitude +
                "," +
                longitude;

            const mensagem =
                "🚨 SOCORRO! Estou aqui: " +
                link;

            const url =
                "https://wa.me/556196100180?text=" +
                encodeURIComponent(
                    mensagem
                );

            window.location.href =
                url;

        },

        function(error) {

            console.warn(
                "Geolocalização:",
                error
            );

            alert(
                "Não foi possível obter sua localização. " +
                "Verifique se a localização está ativada."
            );

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                5000

        }

    );

}
