<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Converse com a Amparada IA, uma experiência experimental do projeto Mulher Amparada.">
  <title>Amparada IA</title>
  <link rel="preload" href="/font.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="IA-day.css">
  <script src="ia.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/mulher-amparada/mulher-amparada-app" aria-label="Projeto Mulher Amparada">
      <span class="brand-mark" aria-hidden="true">✿</span>
      <span>Amparada IA</span>
    </a>
    <a class="menu-button" href="https://github.com/mulher-amparada/mulher-amparada-app" target="_blank" rel="noopener noreferrer" aria-label="Abrir projeto e opções">•••</a>
  </header>

  <main class="main">
    <section class="welcome" aria-label="Amparada IA">
      <div class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="welcome-title">Amparada IA</p>
      <p class="welcome-subtitle">Uma conversa começa com uma pergunta.</p>
    </section>

    <section class="chat" aria-label="Conversa">
      <div class="messages" id="messages" aria-live="polite" aria-relevant="additions">
        <div class="welcome-message">
          <strong>Olá! Como posso ajudar?</strong>
          <p>Envie uma mensagem para conversar com o modelo experimental.</p>
        </div>
      </div>
      <form class="composer" id="chat-form">
        <label class="visually-hidden" for="prompt">Sua mensagem</label>
        <textarea id="prompt" name="message" rows="1" maxlength="500" placeholder="Pergunte à Amparada IA..." autocomplete="off" required></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="Enviar mensagem">
          <span id="send-label" class="visually-hidden">Enviar</span>
          <span aria-hidden="true">↑</span>
        </button>
      </form>
      <div class="composer-footer">
        <span id="status-label">Verificando o servidor…</span>
        <span class="status-dot" id="status-dot"></span>
      </div>
    </section>
  </main>
</body>
</html>
