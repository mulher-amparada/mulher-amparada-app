
name: Mulher Amparada - Android 17

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Código-fonte do app = Mulher Amparada/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar e assinar APK
    runs-on: ubuntu-26.04

    env:
      PROJECT_DIR: 'Código-fonte do app = Mulher Amparada'

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar plataforma Android
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --channel=3 --list --include_obsolete \
            > "$RUNNER_TEMP/sdk-packages.txt"

          if grep -qE 'platforms;android-37[[:space:]]*\|' "$RUNNER_TEMP/sdk-packages.txt"; then
            PLATFORM="platforms;android-37"
          else
            PLATFORM="$(
              grep -oE 'platforms;android-[0-9]+' "$RUNNER_TEMP/sdk-packages.txt" \
                | sort -Vu \
                | tail -n 1
            )"
          fi

          if [ -z "$PLATFORM" ]; then
            echo "::error::Nenhuma plataforma Android disponível."
            exit 1
          fi

          echo "Plataforma selecionada: $PLATFORM"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

          sdkmanager --channel=3 --install \
            "$PLATFORM" \
            "platform-tools"

          sdkmanager --licenses

      - name: Instalar Build Tools
        id: build-tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --channel=3 --list --include_obsolete \
            > "$RUNNER_TEMP/sdk-packages.txt"

          VERSION="$(
            grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/sdk-packages.txt" \
              | sed 's/^build-tools;//' \
              | sort -Vu \
              | tail -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::Nenhuma versão do Build Tools encontrada."
            exit 1
          fi

          sdkmanager --channel=3 --install "build-tools;$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Localizar Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            WRAPPER="$GITHUB_WORKSPACE/$PROJECT_DIR/gradlew"
            ROOT="$GITHUB_WORKSPACE/$PROJECT_DIR"
          elif [ -f "$GITHUB_WORKSPACE/gradlew" ]; then
            WRAPPER="$GITHUB_WORKSPACE/gradlew"
            ROOT="$GITHUB_WORKSPACE"
          else
            echo "::error::Gradle Wrapper não encontrado."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          bash "${{ steps.gradle.outputs.wrapper }}" \
            -p "${{ steps.gradle.outputs.root }}" \
            --no-daemon \
            assembleRelease

      - name: Validar secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for NAME in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Configure o secret $NAME."
              exit 1
            fi
          done

      - name: Preparar keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/mulher-amparada.p12"

          chmod 600 "$RUNNER_TEMP/mulher-amparada.p12"

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "${{ steps.gradle.outputs.root }}" \
              -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              ! -name '*androidTest*' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Alinhar e assinar APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${{ steps.build-tools.outputs.version }}"

          mkdir -p "$GITHUB_WORKSPACE/artefatos"

          "$BUILD_TOOLS/zipalign" \
            -f -p 4 \
            "${{ steps.apk.outputs.path }}" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/mulher-amparada.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Verificar assinatura
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${{ steps.build-tools.outputs.version }}"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/artefatos/mulher-amparada-release.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: mulher-amparada-android
          path: artefatos/mulher-amparada-release.apk
          if-no-files-found: error
          retention-days: 14
