/* =========================================================
   RESET
========================================================= */

    --surface: #0d0d0f;
    --surface-2: #121216;
    --surface-3: #18181d;

    --line: #24242a;

    --text: #ffffff;

    --text-muted: #707078;

    --blue: #7c6cff;

    --danger: #ff4f67;

* {

    margin: 0;

    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    color: #fff;

    width: 98%;

        "Quicksand",
        Arial,
        sans-serif;

    overflow-x: hidden;

}


html {

}


body {

    color: #fff;

width: 98%;
margin-left: 2%;
margin-right: 2%;

     * FADE-OUT DA PÁGINA INTEIRA
     */

    opacity: 1;

    transition:
        opacity .48s
        cubic-bezier(.22,1,.36,1);

}


body.fade-out {

/* =========================================================
   SCROLLBAR
========================================================= */

*::-webkit-scrollbar {

/* =========================================================

.emergency-list {

.emergency-button {

========================================================= */

.apps {

}


/* =========================================================
   CARD
========================================================= */

.app-card {

    position: relative;

    width: 100%;

    min-height: 92px;

    display: flex;

    align-items: center;

    gap: 17px;

    padding:
        14px
        17px;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #171820,
            #0e0f14
        );

    border:
        1px solid
        var(--border);

    box-shadow:
        0 13px 30px
        rgba(0,0,0,.28),

        0 25px 55px
        rgba(0,0,0,.20);

    text-decoration: none;

    color: #fff;

    isolation: isolate;

    cursor: pointer;

    transition:
        transform .18s
        cubic-bezier(.22,1,.36,1),

        border-color .2s ease,

        background .2s ease,

        box-shadow .2s ease;

}


/* =========================================================
   BOLHA DO CARD
========================================================= */

.app-card::before {

    content: "";

    position: absolute;

    width: 230px;

    height: 230px;

    top: -150px;

    right: -90px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.055);

    pointer-events: none;

    z-index: 0;

}


/* =========================================================
   SEGUNDA BOLHA
========================================================= */

.app-card::after {

    content: "";

    position: absolute;

    width: 150px;

    height: 150px;

    right: -80px;

    bottom: -95px;

    border-radius: 50%;

    background:
        rgba(255,63,159,.035);

    filter:
        blur(10px);

    pointer-events: none;

    z-index: 0;

}


/* =========================================================
   HOVER
========================================================= */

.app-card:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(255,255,255,.14);

    background:
        linear-gradient(
            145deg,
            #1a1c24,
            #101117
        );

    box-shadow:
        0 17px 38px
        rgba(0,0,0,.34),

        0 30px 65px
        rgba(0,0,0,.22);

}


/* =========================================================
   ACTIVE
========================================================= */

.app-card:active {

    transform:
        scale(.975);

    border-color:
        rgba(255,63,159,.35);

}


/* =========================================================

}


.app-card:hover .app-arrow {

    transform:
        translateX(3px);

    color: #858a98;

}


/* =========================================================
   BOLINHA
   APARECE E DEPOIS FICA FLUTUANDO
========================================================= */

@keyframes aparecerEFlutuar {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1.1);
    }

    100% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }

}

.toggle {

    position: absolute;

    z-index: 10000;

    margin-left: 77.5%;

    top:
        7.5%;

    width: 62px;

    height: 62px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 7px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 50%;

    background:
        #444;

    color: #fff;

    transform:
        translateX(-50%);

    cursor: pointer;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.45);

    -webkit-tap-highlight-color: transparent;

    overflow: hidden;

    animation:
        aparecerEFlutuar
        1.5s
        ease both;

}

/* =========================================================
   PARTE INTERNA
========================================================= */

.toggle-inner {

    width: 100%;

    display: flex;

<script>
function ir(pagina) {

    if (
        typeof pagina !== "string" ||
        pagina.trim() === ""
    ) {
        return false;
    }

    try {

        window.location.href = pagina;

        return true;

    } catch (erro) {

        console.error(
            "Erro ao navegar para:",
            pagina,
            erro
        );

        return false;

    }

}


/* =========================================================
   VIBRAÇÃO
========================================================= */

function vibrar(duracao = 40) {

    try {

        if (
            navigator.vibrate &&
            typeof navigator.vibrate === "function"
        ) {

            navigator.vibrate(duracao);

        }

    } catch (e) {}

}


/* =========================================================
   LIGAÇÕES
========================================================= */

function ligar(numero) {

    if (!numero) return;

    vibrar(50);

    try {

        window.location.href =
            "tel:" + numero;

    } catch (e) {

        console.warn(e);

    }

}


/* =========================================================
   ELEMENTOS
========================================================= */

const toggle =
    document.getElementById("toggle");

const cards =
    document.querySelectorAll(".app-card");


/* =========================================================
   CONTROLE
========================================================= */

let navegando = false;


/* =========================================================
   SAIR DA PÁGINA
========================================================= */

function sairDaPagina(destino) {

    if (
        navegando ||
        !destino
    ) {

        return;

    }

    navegando = true;

    vibrar(40);


    /*
     * A PÁGINA INTEIRA FAZ FADE-OUT.
     *
     * Não existe:
     * - movimento da bolinha
     * - fundo adicional
     * - expansão
     * - slide
     */

    document.body.classList.add(
        "fade-out"
    );


    /*
     * Espera o fade terminar
     * e então redireciona.
     */

    setTimeout(function() {

        window.location.href =
            destino;

    }, 480);

}


/* =========================================================
   CARDS DOS APLICATIVOS
========================================================= */

cards.forEach(function(card) {

    const destino =
        card.dataset.page ||
        card.getAttribute("href");


    card.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            sairDaPagina(
                destino
            );

        }
    );

});


/* =========================================================
   BOLINHA
   APENAS FADE-OUT
========================================================= */

if (toggle) {

    toggle.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            sairDaPagina(
                "home.html"
            );

        }
    );

}


/* =========================================================
   RESTAURAR AO VOLTAR
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        navegando = false;

        document.body.classList.remove(
            "fade-out"
        );

        document.body.style.pointerEvents =
            "auto";

    }
);




navegando = false;

document.body.classList.remove(
    "fade-out"
);

</script>
