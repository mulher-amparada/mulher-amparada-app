name: Atualizar Footer

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'index.html'
      - 'scripts/atualizar_footer.py'
      - '.github/workflows/atualizar-footer.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install Markdown

      - name: Atualizar footer
        run: python scripts/atualizar_footer.py

      - name: Salvar alterações no GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git fetch origin main
      git reset --soft origin/main

      git add index.html

      if ! git diff --cached --quiet; then
        git commit -m "chore: atualizar footer com README"
        git push origin HEAD:main
      else
        echo "O footer já está atualizado."
      fi