name: Build Safe Woman OS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            python3 \
            rsync

      - name: Configurar AOSP
        working-directory: Safe Woman Operational System
        run: |
          source build/envsetup.sh
          lunch safe_woman-userdebug

      - name: Compilar Mulher Amparada
        working-directory: Safe Woman Operational System
        run: |
          source build/envsetup.sh
          lunch safe_woman-userdebug
          m MulherAmparada