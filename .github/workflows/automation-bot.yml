name: Mulher Amparada Bot

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    name: Mulher Amparada Bot
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Compilar bot
        run: |
          g++ \
            tools/automation_bot.cpp \
            -o automation-bot \
            -std=c++17 \
            -lcurl \
            -lssl \
            -lcrypto

      - name: Executar Mulher Amparada Bot
        env:
          MULHER_AMPARADA_APP_ID: ${{ secrets.MULHER_AMPARADA_APP_ID }}
          MULHER_AMPARADA_INSTALLATION_ID: ${{ secrets.MULHER_AMPARADA_INSTALLATION_ID }}
          MULHER_AMPARADA_PRIVATE_KEY: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x automation-bot
          ./automation-bot


# =========================================================
# MULHER AMPARADA — ANÁLISE DE DADOS EM JULIA
# =========================================================

name: Atualizar dados de violência

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

concurrency:
  group: dados-violencia-julia
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Coletar e analisar dados públicos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Instalar dependências
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Executar análise de dados
        run: |
          julia --project=. src/main.jl
