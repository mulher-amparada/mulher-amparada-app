name: 🫆Simular Safe Woman OS🫆

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  simulate:
    name: Android virtual + system.img modificada
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          CMDLINE_TOOLS="$(find "$SDK/cmdline-tools" \
            -mindepth 3 \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$CMDLINE_TOOLS")" >> "$GITHUB_PATH"

          "$CMDLINE_TOOLS" --version

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;aosp_atd;x86_64"

      - name: Encontrar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "Safe Woman Operational System" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Projeto: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Encontrar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          APK="$(realpath "$APK")"

          echo "APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Criar AVD
        shell: bash
        run: |
          set -e

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd \
            --force \
            --name SafeWomanOS \
            --package "system-images;android-35;aosp_atd;x86_64" \
            --device "pixel_2"

          if ! emulator -list-avds | grep -qx "SafeWomanOS"; then
            echo "::error::AVD SafeWomanOS não foi criado."
            exit 1
          fi

      - name: Inspecionar imagens disponíveis
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SYSTEM_IMAGE_DIR="$SDK/system-images/android-35/aosp_atd/x86_64"

          mkdir -p simulation/image

          echo "===== DIRETÓRIO DA IMAGEM ====="
          echo "$SYSTEM_IMAGE_DIR"

          echo
          echo "===== ARQUIVOS ====="

          find "$SYSTEM_IMAGE_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p | %s bytes\n' \
            | tee simulation/image/files.txt

          echo
          echo "===== IMAGENS ====="

          find "$SYSTEM_IMAGE_DIR" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.raw' \
              -o -name '*.simg' \
            \) \
            -print \
            | tee simulation/image/images.txt

          echo
          echo "===== TIPOS ====="

          while IFS= read -r IMAGE; do
            echo
            echo "### $IMAGE"
            file "$IMAGE"
            ls -lh "$IMAGE"
          done < simulation/image/images.txt

      - name: Configurar aceleração KVM
        shell: bash
        run: |
          set -e

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          ls -l /dev/kvm || true

      - name: Iniciar Safe Woman OS
        shell: bash
        run: |
          set -e

          mkdir -p simulation

          export ANDROID_AVD_HOME="$HOME/.android/avd"

          nohup emulator \
            -avd SafeWomanOS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -wipe-data \
            -no-snapshot \
            > simulation/emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "$EMULATOR_PID" > simulation/emulator.pid

          echo "===== AGUARDANDO ADB ====="

          ADB_READY=false

          for i in {1..90}; do

            if adb get-state >/dev/null 2>&1; then
              ADB_READY=true
              echo "ADB disponível."
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulador encerrou."
              cat simulation/emulator.log || true
              exit 1
            fi

            echo "ADB aguardando — tentativa $i/90"

            sleep 2
          done

          if [ "$ADB_READY" != "true" ]; then
            echo "::error::ADB não ficou disponível."
            cat simulation/emulator.log || true
            exit 1
          fi

          echo
          echo "===== AGUARDANDO BOOT ====="

          BOOT_COMPLETED=false

          for i in {1..120}; do

            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

            echo "Boot: ${BOOT:-aguardando} — tentativa $i/120"

            if [ "$BOOT" = "1" ]; then
              BOOT_COMPLETED=true
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "true" ]; then
            echo "::error::Android não terminou o boot."
            cat simulation/emulator.log || true
            exit 1
          fi

          echo
          echo "Android iniciou."

          adb devices -l

      - name: Preparar sistema Android
        shell: bash
        run: |
          set -e

          mkdir -p simulation/system

          echo "===== ROOT ====="

          adb root || true

          sleep 3

          adb wait-for-device

          echo
          echo "===== REMOUNT ====="

          adb remount || true

          echo
          echo "===== MOUNT ====="

          adb shell mount \
            | tee simulation/system/mount-before.txt

          echo
          echo "===== SYSTEM ====="

          adb shell ls -la /system \
            | tee simulation/system/system-before.txt

      - name: Instalar APK como priv-app
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.path }}"

          echo "===== APK ====="
          echo "$APK"

          echo
          echo "===== CRIANDO PRIV-APP ====="

          adb shell mkdir -p \
            /system/priv-app/MulherAmparada

          echo
          echo "===== ENVIANDO APK ====="

          adb push \
            "$APK" \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          echo
          echo "===== PERMISSÕES ====="

          adb shell chmod 0644 \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          adb shell chown 0:0 \
            /system/priv-app/MulherAmparada/MulherAmparada.apk

          echo
          echo "===== ARQUIVO ====="

          adb shell ls -la \
            /system/priv-app/MulherAmparada/

          echo
          echo "===== REINICIANDO PACKAGE MANAGER ====="

          adb shell cmd package scan \
            /system/priv-app/MulherAmparada \
            || true

          adb shell cmd package reconcile-secondary-dex-files \
            || true

      - name: Verificar registro do pacote
        shell: bash
        run: |
          set -e

          echo "===== PACKAGE MANAGER ====="

          adb shell pm path com.mulheres 2>&1 \
            | tr -d '\r' \
            | tee simulation/pm-path.txt

          if ! grep -q '^package:' simulation/pm-path.txt; then
            echo "::error::PackageManagerService não registrou com.mulheres."
            exit 1
          fi

          echo
          echo "===== PACOTE REGISTRADO ====="

          cat simulation/pm-path.txt

          if grep -q '/priv-app/' simulation/pm-path.txt; then
            echo
            echo "✓ com.mulheres registrado como priv-app."
          else
            echo "::error::com.mulheres não está em priv-app."
            exit 1
          fi

      - name: Verificar permissões
        shell: bash
        run: |
          set +e

          adb shell dumpsys package com.mulheres \
            > simulation/permissions.txt

          echo "===== PERMISSÕES ====="

          grep -A100 -B10 \
            "requested permissions" \
            simulation/permissions.txt \
            || true

          echo
          echo "===== PRIVILEGIADAS ====="

          grep -Ei \
            "granted=true|privileged|INSTALL|LOCATION|RECORD_AUDIO|READ_CONTACTS|CALL_PHONE" \
            simulation/permissions.txt \
            || true

      - name: Criar system-modified.img
        shell: bash
        run: |
          set -e

          echo "===== PREPARANDO SYSTEM.IMG ====="

          mkdir -p simulation/image

          echo
          echo "===== EXTRAINDO /SYSTEM DO EMULADOR ====="

          rm -rf simulation/system/root

          mkdir -p simulation/system/root

          adb pull /system/. \
            simulation/system/root/

          echo
          echo "===== CONTEÚDO EXTRAÍDO ====="

          du -sh simulation/system/root

          echo
          echo "===== TAMANHO DA IMAGEM ====="

          SYSTEM_SIZE="$(du -sk simulation/system/root | awk '{print $1}')"

          MIN_SIZE=$((SYSTEM_SIZE + 262144))

          echo "Conteúdo: ${SYSTEM_SIZE} KB"
          echo "Imagem:   ${MIN_SIZE} KB"

          echo
          echo "===== CRIANDO system-modified.img ====="

          truncate -s "${MIN_SIZE}K" \
            simulation/image/system-modified.img

          mkfs.ext4 -F \
            simulation/image/system-modified.img

          echo
          echo "===== COPIANDO SYSTEM PARA A IMG ====="

          sudo mkdir -p /mnt/safe-woman-system

          sudo mount \
            -o loop \
            simulation/image/system-modified.img \
            /mnt/safe-woman-system

          sudo cp -a \
            simulation/system/root/. \
            /mnt/safe-woman-system/

          sudo sync

          sudo umount \
            /mnt/safe-woman-system

          echo
          echo "===== SYSTEM.IMG FINAL ====="

          file simulation/image/system-modified.img
          ls -lh simulation/image/system-modified.img

          echo
          echo "===== VERIFICANDO APK NA IMG ====="

          sudo debugfs \
            -R "ls -l /priv-app/MulherAmparada" \
            simulation/image/system-modified.img \
            | tee simulation/image/priv-app-in-image.txt

          if ! grep -q "MulherAmparada.apk" \
            simulation/image/priv-app-in-image.txt; then
            echo "::error::APK não encontrado na system-modified.img."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " SYSTEM.IMG MODIFICADA CRIADA"
          echo "=========================================="

      - name: Diagnosticar partições reais
        shell: bash
        run: |
          set +e

          echo "===== MOUNT ====="

          adb shell mount \
            | tee simulation/mount.txt

          echo
          echo "===== DF ====="

          adb shell df -h \
            | tee simulation/df.txt

          echo
          echo "===== /SYSTEM ====="

          adb shell ls -la /system \
            | tee simulation/system-list.txt

          echo
          echo "===== /PRIV-APP ====="

          adb shell ls -la /system/priv-app \
            | tee simulation/priv-app-list.txt

          echo
          echo "===== /DEV/BLOCK/BY-NAME ====="

          adb shell ls -la /dev/block/by-name/ \
            | tee simulation/partitions.txt

          echo
          echo "===== PARTIÇÕES DINÂMICAS ====="

          adb shell getprop ro.boot.dynamic_partitions \
            | tee simulation/dynamic-partitions.txt

          echo
          echo "===== SLOT ====="

          adb shell getprop ro.boot.slot_suffix \
            | tee simulation/slot.txt

          echo
          echo "===== PRODUTO ====="

          adb shell getprop ro.product.name \
            | tee simulation/product.txt

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            | tee simulation/build-type.txt

          adb shell getprop ro.debuggable \
            | tee simulation/debuggable.txt

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== PACOTE ====="

          adb shell dumpsys package com.mulheres \
            || true

          echo
          echo "===== CAMINHO ====="

          adb shell pm path com.mulheres \
            || true

          echo
          echo "===== BOOT ====="

          adb shell getprop sys.boot_completed \
            || true

          echo
          echo "===== BUILD ====="

          adb shell getprop ro.build.type \
            || true

          adb shell getprop ro.debuggable \
            || true

          echo
          echo "===== VERITY ====="

          adb shell getprop ro.boot.verifiedbootstate \
            || true

      - name: Parar emulador
        if: always()
        run: |
          if [ -f simulation/emulator.pid ]; then
            kill "$(cat simulation/emulator.pid)" 2>/dev/null || true
          fi

      - name: Salvar resultados em Imagem do Safe Woman OS
        if: always()
        shell: bash
        run: |
          set -e

          DESTINO="Imagem do Safe Woman OS"

          echo "===== SALVANDO RESULTADOS ====="

          mkdir -p "$DESTINO"

          cp -a simulation/. "$DESTINO/"

          echo
          echo "===== CONTEÚDO SALVO ====="

          find "$DESTINO" \
            -type f \
            -printf '%p | %s bytes\n' \
            | sort

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Safe-Woman-OS-Simulacao
          path: Imagem do Safe Woman OS/
          if-no-files-found: warn