  # =========================================================
  # PUBLICAR KIT DE DIVULGAÇÃO
  # =========================================================

  publicar-divulgacao:
    name: 🎲Publicar Kit de Divulgação
    runs-on: ubuntu-24.04
    

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
