name: 👾Mulher Amparada Agent👾

on:
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: Ação do agente
        required: true
        type: choice
        options:
          - executar-workflow
          - dependabot
          - ambos

      workflow:
        description: Arquivo do workflow em .github/workflows
        required: false
        default: automations.yml
        type: string

      branch:
        description: Branch de destino
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mulher-amparada-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    name: 🤖Agente do Mulher Amparada
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Instalar dependências
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-openssl-dev libssl-dev

      - name: Preparar chave privada Base64
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_KEY_BASE64:-}" ]]; then
            echo "::error::Secret MULHER_AMPARADA_PRIVATE_KEY ausente."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/private-key.pem"

          if ! printf '%s' "$PRIVATE_KEY_BASE64" |
            base64 --decode > "$KEY_FILE"; then
            echo "::error::Falha ao decodificar a chave Base64."
            exit 1
          fi

          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::A chave decodificada não é uma chave privada PEM válida."
            exit 1
          fi

          chmod 600 "$KEY_FILE"

          echo "MULHER_AMPARADA_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Compilar agente C++
        run: |
          set -euo pipefail

          g++ -std=c++17 -O2 -Wall -Wextra \
            tools/github_agent.cpp \
            -o github_agent \
            -lcurl -lssl -lcrypto

      - name: Executar agente
        env:
          MULHER_AMPARADA_PRIVATE_KEY: ${{ secrets.MULHER_AMPARADA_PRIVATE_KEY }}
          MULHER_AMPARADA_PRIVATE_KEY_FILE: ${{ runner.temp }}/private-key.pem
          MULHER_AMPARADA_APP_ID: ${{ secrets.MULHER_AMPARADA_APP_ID }}
          MULHER_AMPARADA_INSTALLATION_ID: ${{ secrets.MULHER_AMPARADA_INSTALLATION_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${MULHER_AMPARADA_APP_ID:-}" ]]; then
            echo "::error::Secret MULHER_AMPARADA_APP_ID ausente."
            exit 1
          fi

          if [[ -z "${MULHER_AMPARADA_INSTALLATION_ID:-}" ]]; then
            echo "::error::Secret MULHER_AMPARADA_INSTALLATION_ID ausente."
            exit 1
          fi

          if [[ ! -s "$MULHER_AMPARADA_PRIVATE_KEY_FILE" ]]; then
            echo "::error::Arquivo da chave privada não encontrado."
            exit 1
          fi

          ACTION="${{ inputs.action }}"
          WORKFLOW="${{ inputs.workflow }}"
          BRANCH="${{ inputs.branch }}"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ACTION="ambos"
            WORKFLOW="automations.yml"
            BRANCH="main"
          fi

          case "$ACTION" in
            executar-workflow)
              ./github_agent workflow "$WORKFLOW" "$BRANCH"
              ;;
            dependabot)
              ./github_agent dependabot "$BRANCH"
              ;;
            ambos)
              ./github_agent workflow "$WORKFLOW" "$BRANCH"
              ./github_agent dependabot "$BRANCH"
              ;;
            *)
              echo "::error::Ação inválida: $ACTION"
              exit 1
              ;;
          esac