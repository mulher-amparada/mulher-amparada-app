<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("file:///android_asset/font.ttf")
        format("truetype");

    font-weight: 400 800;

    font-style: normal;

    font-display: swap;

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --pink: #ff3f82;
    --pink-light: #ff79a9;

    --purple: #8b5cf6;
    --purple-light: #b69cff;

    --blue: #6285ff;
    --cyan: #4de2ff;

    --green: #53e58a;

    --red: #ff526b;

    --white: #ffffff;

    --text: #ffffff;
    --text-soft: #c7c7cf;
    --text-muted: #777781;

    --surface: rgba(18,18,22,.88);
    --surface-light: rgba(255,255,255,.045);

    --line: rgba(255,255,255,.075);
    --line-strong: rgba(255,255,255,.13);

    --radius: 25px;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


/* =========================================================
   HTML
========================================================= */

html {

    width: 100%;

    min-height: 100%;

    background: transparent;

    scroll-behavior: smooth;

}


/* =========================================================
   BODY
========================================================= */

body {

    width: 100%;

    min-height: 100vh;

    padding-top: 18%;

    padding-bottom: 70px;

    overflow-x: hidden;

    background: transparent;

    color: var(--text);

    font-family: "Quicksand", sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
    
    background: #000;
}


/* =========================================================
   SELEÇÃO
========================================================= */

::selection {

    background: rgba(255,63,130,.35);

    color: #fff;

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 4px;

}

::-webkit-scrollbar-track {

    background: transparent;

}

::-webkit-scrollbar-thumb {

    background:

        linear-gradient(
            180deg,
            var(--pink),
            var(--purple)
        );

    border-radius: 50px;

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 720px;

    margin: auto;

    padding:

        0
        clamp(16px, 5vw, 34px);

}


/* =========================================================
   ÁREA PROTEGIDA
========================================================= */

.protectedArea {

    position: relative;

    width: 100%;

    margin-bottom: 34px;

    padding: 22px;

    overflow: hidden;

    border-radius: 32px;

    border:

        1px solid
        rgba(255,255,255,.10);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    box-shadow:

        0 20px 55px
        rgba(0,0,0,.20);

}


/* =========================================================
   BRILHO DO CARTÃO PRINCIPAL
========================================================= */

.protectedArea::before {

    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    left: -120px;
    top: -140px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,63,130,.20),
            transparent 68%
        );

    filter: blur(20px);

    pointer-events: none;

}


.protectedArea::after {

    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    right: -130px;
    bottom: -140px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(124,58,237,.18),
            transparent 68%
        );

    filter: blur(20px);

    pointer-events: none;

}


/* =========================================================
   TOPO DA ÁREA PROTEGIDA
========================================================= */

.protectedTop {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

}


/* =========================================================
   CHAVE
========================================================= */

.protectedKey {

    width: 62px;
    height: 62px;

    flex: 0 0 62px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 21px;

    background:

        linear-gradient(
            145deg,
            rgba(255,63,130,.18),
            rgba(124,58,237,.12)
        );

    border:

        1px solid
        rgba(255,255,255,.10);

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.08),

        0 10px 30px
        rgba(0,0,0,.20);

}


.protectedKey img {

    width: 35px;
    height: 35px;

    display: block;

    object-fit: contain;

}


/* =========================================================
   TEXTO PRINCIPAL
========================================================= */

.protectedText {

    min-width: 0;

    flex: 1;

}


.protectedLabel {

    margin-bottom: 5px;

    color: #898992;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 2.2px;

    text-transform: uppercase;

}


.protectedTitle {

    color: #fff;

    font-size: clamp(20px, 5vw, 25px);

    font-weight: 800;

    line-height: 1.05;

}


.protectedDescription {

    margin-top: 7px;

    color: #8f8f98;

    font-size: 11px;

    font-weight: 500;

    line-height: 1.4;

}


/* =========================================================
   STATUS
========================================================= */

.protectedStatus {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 22px;

    padding-top: 16px;

    border-top:

        1px solid
        rgba(255,255,255,.065);

}


.statusDot {

    width: 7px;
    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:

        0 0 0 4px
        rgba(83,229,138,.08),

        0 0 14px
        rgba(83,229,138,.45);

}


.statusText {

    color: #9b9ba4;

    font-size: 10px;

    font-weight: 650;

}


.statusText strong {

    color: #d5d5db;

    font-weight: 750;

}


/* =========================================================
   MINI INDICADORES
========================================================= */

.securityStats {

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 13px;

}


.securityStat {

    min-width: 0;

    padding: 11px 8px;

    border-radius: 15px;

    background:

        rgba(255,255,255,.025);

    border:

        1px solid
        rgba(255,255,255,.045);

}


.securityStat span {

    display: block;

    margin-bottom: 4px;

    color: #676771;

    font-size: 8px;

    font-weight: 800;

    letter-spacing: .7px;

    text-transform: uppercase;

}


.securityStat strong {

    display: block;

    color: #bdbdc5;

    font-size: 10px;

    font-weight: 700;

}


/* =========================================================
   SEÇÕES
========================================================= */

.section {

    width: 100%;

    margin-bottom: 30px;

}


/* =========================================================
   CABEÇALHO DA SEÇÃO
========================================================= */

.sectionHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 12px;

    padding:

        0
        5px;

}


.sectionTitle {

    display: flex;

    align-items: center;

    gap: 9px;

    color: #777780;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 1.8px;

    line-height: 1;

    text-transform: uppercase;

}


.sectionTitle::before {

    content: "";

    width: 5px;
    height: 5px;

    flex: 0 0 5px;

    border-radius: 50%;

    background:

        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );

    box-shadow:

        0 0 10px
        rgba(255,63,130,.35);

}


.sectionCount {

    color: #55555e;

    font-size: 9px;

    font-weight: 700;

}


/* =========================================================
   LISTA
========================================================= */

.list {

    display: flex;

    flex-direction: column;

    gap: 8px;

}


/* =========================================================
   BOTÃO
========================================================= */

.btn {

    position: relative;

    isolation: isolate;

    width: 100%;

    min-height: 76px;

    display: flex;

    align-items: center;

    gap: 14px;

    padding:

        12px
        13px;

    overflow: hidden;

    border:

        1px solid
        var(--line);

    border-radius: 23px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.038),
            rgba(255,255,255,.012)
        );

    color: #fff;

    font-family: "Quicksand", sans-serif;

    text-align: left;

    cursor: pointer;

    transition:

        transform .20s ease,
        border-color .20s ease,
        background .20s ease,
        box-shadow .20s ease;

}


/* =========================================================
   BRILHO INTERNO
========================================================= */

.btn::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:

        linear-gradient(
            115deg,
            rgba(255,255,255,.055),
            transparent 34%,
            transparent 70%,
            rgba(124,58,237,.035)
        );

    pointer-events: none;

}


/* =========================================================
   LUZ LATERAL
========================================================= */

.btn::after {

    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    right: -65px;
    top: 50%;

    transform: translateY(-50%);

    border-radius: 50%;

    background:

        rgba(124,58,237,.07);

    filter: blur(25px);

    pointer-events: none;

}


/* =========================================================
   HOVER
========================================================= */

.btn:hover {

    transform: translateY(-2px);

    border-color:

        rgba(255,255,255,.12);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(124,58,237,.035)
        );

    box-shadow:

        0 13px 32px
        rgba(0,0,0,.18);

}


.btn:active {

    transform: scale(.975);

}


/* =========================================================
   ÍCONE
========================================================= */

.emoji {

    position: relative;

    width: 49px;
    height: 49px;

    flex: 0 0 49px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 17px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.02)
        );

    border:

        1px solid
        rgba(255,255,255,.065);

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.06),

        0 5px 14px
        rgba(0,0,0,.16);

    transition:

        transform .20s ease,
        border-color .20s ease;

}


.btn:hover .emoji {

    transform: scale(1.04);

    border-color:

        rgba(255,255,255,.12);

}


.emoji img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

}


.emoji svg {

    width: 24px;
    height: 24px;

    color: #e5e5ea;

}


/* =========================================================
   CONTEÚDO
========================================================= */

.content {

    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 4px;

}


.title {

    color: #f8f8fa;

    font-size: 14px;

    font-weight: 750;

    line-height: 1.25;

}


.description {

    color: #73737d;

    font-size: 11px;

    font-weight: 500;

    line-height: 1.35;

}


/* =========================================================
   SETA
========================================================= */

.arrow {

    width: 30px;
    height: 30px;

    flex: 0 0 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #62626b;

    background:

        rgba(255,255,255,.025);

    border:

        1px solid
        rgba(255,255,255,.035);

    transition:

        transform .20s ease,
        color .20s ease,
        background .20s ease;

}


.arrow svg {

    width: 16px;
    height: 16px;

}


.btn:hover .arrow {

    transform: translateX(3px);

    color: #aaaab4;

    background:

        rgba(255,255,255,.055);

}


/* =========================================================
   CARTÕES MAIORES
========================================================= */

.appCard {

    min-height: 82px;

}


/* =========================================================
   EMERGÊNCIA
========================================================= */

.emergencySection {

    margin-top: 10px;

}


.emergencyWrapper {

    position: relative;

    padding: 1px;

    border-radius: 25px;

    background:

        linear-gradient(
            135deg,
            rgba(255,82,107,.35),
            rgba(255,82,107,.04),
            rgba(255,255,255,.03)
        );

}


.emergency {

    border-color:

        rgba(255,82,107,.12);

    background:

        linear-gradient(
            135deg,
            rgba(255,82,107,.08),
            rgba(255,82,107,.018)
        );

}


.emergency::after {

    background:

        rgba(255,82,107,.13);

}


.emergency .emoji {

    background:

        linear-gradient(
            145deg,
            rgba(255,82,107,.19),
            rgba(255,82,107,.035)
        );

    border-color:

        rgba(255,82,107,.18);

}


.emergency .title {

    color: #ff7181;

}


.emergency .description {

    color: #985d67;

}


.emergency .arrow {

    color: #ad4b5b;

    background:

        rgba(255,82,107,.045);

}


.emergency:hover {

    border-color:

        rgba(255,82,107,.25);

}



/* =========================================================
   DESTAQUES ESPECIAIS
========================================================= */

.special {

    border-color:

        rgba(167,139,250,.08);

}


.special .emoji {

    background:

        linear-gradient(
            145deg,
            rgba(167,139,250,.12),
            rgba(124,58,237,.025)
        );

}


.special:hover {

    border-color:

        rgba(167,139,250,.18);

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

.btn:focus-visible {

    outline: none;

    border-color:

        rgba(167,139,250,.65);

    box-shadow:

        0 0 0 3px
        rgba(124,58,237,.16),

        0 10px 30px
        rgba(0,0,0,.20);

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 390px) {

    body {

        padding-top: 12%;

    }

    .protectedArea {

        padding: 18px;

        border-radius: 27px;

    }

    .protectedKey {

        width: 56px;
        height: 56px;

        flex-basis: 56px;

    }

    .protectedKey img {

        width: 31px;
        height: 31px;

    }

    .securityStats {

        gap: 5px;

    }

    .securityStat {

        padding:

            9px
            6px;

    }

    .securityStat strong {

        font-size: 9px;

    }

}


@media (prefers-reduced-motion: reduce) {
    /* Procura por QUALQUER elemento que use a sua animação e a desativa */

    * {
        animation-name: none !important;
    }
}


</style>

</head>

<script>

/* =========================================================
   NAVEGAÇÃO
========================================================= */

function ir(pagina) {

    if (
        typeof pagina !== "string" ||
        pagina.trim() === ""
    ) {

        return false;

    }

    try {

        window.location.href = pagina;

        return true;

    } catch (erro) {

        console.error(
            "Erro ao navegar para:",
            pagina,
            erro
        );

        return false;

    }

}


/* =========================================================
   ANDROID BRIDGE
========================================================= */

function androidCall(metodo) {

    if (
        typeof metodo !== "string" ||
        metodo.trim() === ""
    ) {

        console.warn(
            "Método Android inválido."
        );

        return false;

    }


    try {

        if (
            typeof Android === "undefined" ||
            Android === null
        ) {

            console.warn(
                "Interface Android não disponível."
            );

            return false;

        }


        if (
            typeof Android[metodo] !== "function"
        ) {

            console.warn(
                "Método Android não encontrado:",
                metodo
            );

            return false;

        }


        Android[metodo]();

        return true;

    } catch (erro) {

        console.error(
            "Erro ao executar método Android:",
            metodo,
            erro
        );

        return false;

    }

}


/* =========================================================
   DESATIVAR MENU DE CONTEXTO
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    },
    false
);

</script>
