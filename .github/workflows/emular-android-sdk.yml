name: Emular Mulher Amparada (Android SDK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emular:
    name: Iniciar Android virtual e testar o APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar diretório de evidências
        shell: bash
        run: |
          mkdir -p artefatos-emulador

      - name: Iniciar Android Emulator e executar Mulher Amparada
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot
            -wipe-data
          disable-animations: true
          script: bash .github/scripts/emular-android-sdk.sh

      - name: Publicar screenshot e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mulher-amparada-android-emulator
          path: artefatos-emulador/
          if-no-files-found: warn
          retention-days: 7
