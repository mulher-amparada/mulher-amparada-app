name: Automações do Mulher Amparada

on:
  push:
    branches:
      - '**'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}


jobs:

  # =========================================================
  # BAIXAR TODO O REPOSITÓRIO — ÚNICO CHECKOUT
  # =========================================================

  baixar-repositorio:

    name: Baixar todo o repositório

    runs-on: ubuntu-24.04

    steps:

      - name: Baixar todo o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Empacotar repositório completo
        run: |
          tar -czf "$RUNNER_TEMP/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE" .

      - name: Disponibilizar repositório completo
        uses: actions/upload-artifact@v6
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio-completo.tar.gz
          if-no-files-found: error


  # =========================================================
  # COMPILAR APK
  # =========================================================

  build:

    name: Compilar APK Kotlin

    runs-on: ubuntu-24.04

    needs: baixar-repositorio

    env:
      App1_DIR: "Código-fonte do app = Mulher Amparada"
      RELEASE_TAG: "app"
      RELEASE_APK_NAME: "app-debug-assinado.apk"

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Verificar projeto
        run: |
          if [ ! -d "$App1_DIR" ]; then
            echo "ERRO: pasta não encontrada:"
            echo "$App1_DIR"
            exit 1
          fi

          if [ ! -f "$App1_DIR/gradlew" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verificar Android SDK 37
        run: |
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Plataformas Android instaladas:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Plataformas 37 disponíveis:"

          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -name "android-37*"

          if ! find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -type d \
            -name "android-37*" \
            | grep -q .; then

            echo "ERRO: nenhuma plataforma Android 37 encontrada."
            exit 1
          fi

      - name: Dar permissão ao Gradle
        working-directory: ${{ env.App1_DIR }}
        run: chmod +x gradlew

      - name: Compilar APK
        id: compilar_apk
        working-directory: ${{ env.App1_DIR }}
        run: |
          set -o pipefail

          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            {
              echo ""
              echo "# ❌ ERRO NA COMPILAÇÃO"
              echo ""
              echo "## 🔴 Etapa"
              echo ""
              echo "**Compilar APK**"
              echo ""
              echo "## 💥 O que aconteceu"
              echo ""
              echo "O Gradle não conseguiu compilar o APK."
              echo ""
              echo "## 📋 Erro do Gradle"
              echo ""
              echo '```text'
              tail -n 100 "$GITHUB_WORKSPACE/gradle-build.log"
              echo '```'
              echo ""
              echo "**Código de saída:** \`$STATUS\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$STATUS"
          fi

      - name: Localizar APK
        id: apk
        working-directory: ${{ env.App1_DIR }}
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Assinar APK
        working-directory: ${{ env.App1_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERRO: KEYSTORE_BASE64 não configurado."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERRO: KEYSTORE_PASSWORD não configurado."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERRO: KEY_ALIAS não configurado."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: KEY_PASSWORD não configurado."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode > mulher-amparada.jks

          APK="${{ steps.apk.outputs.apk }}"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado:"
            echo "$APK"
            rm -f mulher-amparada.jks
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado."
            rm -f mulher-amparada.jks
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks mulher-amparada.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-assinado.apk \
            "$APK"

          mv app-assinado.apk "$APK"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          rm -f mulher-amparada.jks

      - name: Preparar APK da Release
        working-directory: ${{ env.App1_DIR }}
        run: |
          APK="${{ steps.apk.outputs.apk }}"

          cp "$APK" \
            "$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v6
        with:
          name: APK-Kotlin-Assinado
          path: "${{ github.workspace }}/${{ env.RELEASE_APK_NAME }}"
          if-no-files-found: error

      - name: Calcular tamanho real do APK
        id: apk_size
        run: |
          APK="$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

          BYTES=$(stat -c%s "$APK")

          SIZE_MB=$(awk "BEGIN {
            printf \"%.2f\", $BYTES / 1024 / 1024
          }")

          SIZE_FORMATADO="${SIZE_MB} MB"

          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "size_formatado=$SIZE_FORMATADO" >> "$GITHUB_OUTPUT"

          echo "Tamanho: $SIZE_FORMATADO"
          echo "Bytes: $BYTES"

      - name: Calcular SHA-256
        id: sha256
        run: |
          APK="$GITHUB_WORKSPACE/$RELEASE_APK_NAME"

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          echo "SHA-256:"
          echo "$SHA256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Atualizar APK no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="${App1_DIR}/app-release.apk"

          cp \
            "$GITHUB_WORKSPACE/$RELEASE_APK_NAME" \
            "$TARGET"

          git add "$TARGET"

          if git diff --cached --quiet; then
            echo "APK já está atualizado."
          else
            git commit \
              -m "Atualizar APK assinado [skip ci]"

            git push origin HEAD:main
          fi

      - name: Verificar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERRO: A Release '$RELEASE_TAG' não existe."
            exit 1
          fi

      - name: Excluir APK antigo da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq ".assets[] | select(.name == \"$RELEASE_APK_NAME\") | .id" \
            | head -n 1)

          if [ -n "$ASSET_ID" ]; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          fi

      - name: Enviar APK para a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/$RELEASE_APK_NAME" \
            --repo "$GITHUB_REPOSITORY"

      - name: Atualizar SHA-256 da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > release-notes.txt

          if grep -q \
            "SHA-256 gerado nesta compilação:" \
            release-notes.txt; then

            sed -i \
              "s/^SHA-256 gerado nesta compilação:.*$/SHA-256 gerado nesta compilação: $SHA256/" \
              release-notes.txt
          else
            printf \
              '\n\nSHA-256 gerado nesta compilação: %s\n' \
              "$SHA256" \
              >> release-notes.txt
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.txt

      - name: Atualizar download.html
        run: |
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$RELEASE_APK_NAME"
          APK_SIZE="${{ steps.apk_size.outputs.size_formatado }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          python3 - <<PY
          from pathlib import Path
          import re

          arquivo = Path("download.html")

          if not arquivo.exists():
              raise SystemExit("ERRO: download.html não encontrado.")

          texto = arquivo.read_text(encoding="utf-8")

          novo_url = """$ASSET_URL"""
          novo_tamanho = """$APK_SIZE"""
          novo_sha256 = """$SHA256"""

          texto, n = re.subn(
              r'(<a\s+class="download"\s+href=")[^"]*(")',
              lambda m: m.group(1) + novo_url + m.group(2),
              texto,
              count=1
          )

          if n == 0:
              raise SystemExit(
                  'ERRO: <a class="download"> não encontrado.'
              )

          texto, n = re.subn(
              r'(<strong\s+class="summary-value">\s*)'
              r'(?:[0-9]+(?:[.,][0-9]+)?\s*MB)'
              r'(\s*</strong>)',
              lambda m: m.group(1) + novo_tamanho + m.group(2),
              texto,
              count=1
          )

          if n == 0:
              raise SystemExit(
                  "ERRO: tamanho no resumo não encontrado."
              )

          texto, n = re.subn(
              r'(<strong\s+class="detail-value">\s*)'
              r'≈?\s*[0-9]+(?:[.,][0-9]+)?\s*MB'
              r'(\s*</strong>)',
              lambda m: m.group(1) + "≈ " + novo_tamanho + m.group(2),
              texto,
              count=1
          )

          if n == 0:
              raise SystemExit(
                  "ERRO: tamanho nas informações não encontrado."
              )

          texto, n = re.subn(
              r'(<span\s+class="detail-title">\s*'
              r'Código SHA-256\s*'
              r'</span>\s*'
              r'<strong\s+class="detail-value">\s*)'
              r'[^<]*(\s*</strong>)',
              lambda m: m.group(1) + novo_sha256 + m.group(2),
              texto,
              count=1
          )

          if n == 0:
              raise SystemExit(
                  "ERRO: Código SHA-256 não encontrado."
              )

          arquivo.write_text(texto, encoding="utf-8")
          PY

      - name: Enviar download.html atualizado para o main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add download.html

          if ! git diff --cached --quiet; then
            git commit \
              -m "Atualizar link, tamanho e SHA-256 do APK [skip ci]"

            git push origin HEAD:main
          fi

      - name: Mostrar resumo
        run: |
          {
            echo "## Compilação concluída"
            echo ""
            echo "**Release:** $RELEASE_TAG"
            echo "**APK:** $RELEASE_APK_NAME"
            echo "**Tamanho:** ${{ steps.apk_size.outputs.size_formatado }}"
            echo "**Bytes:** ${{ steps.apk_size.outputs.bytes }}"
            echo ""
            echo "**SHA-256:**"
            echo '```'
            echo "${{ steps.sha256.outputs.sha256 }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # GITHUB PAGES
  # =========================================================

  build-site:

    runs-on: ubuntu-24.04

    needs:
      - build
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site


  # =========================================================
  # DEPLOY GITHUB PAGES
  # =========================================================

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    needs: build-site

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  # =========================================================
  # ATUALIZAR TOTAL DE COMMITS
  # =========================================================

  atualizar-commits:

    runs-on: ubuntu-24.04

    needs:
      - deploy
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Atualizar total de commits
        run: |
          TOTAL=$(git rev-list --all --count)

          python3 - "$TOTAL" <<'PY'
          from pathlib import Path
          import re
          import sys

          total = sys.argv[1]

          arquivo = Path("README.md")
          texto = arquivo.read_text(encoding="utf-8")

          texto = re.sub(
              r"\*\*Commits totais de toda a história do projeto, \(feitos por mim e pelos workflows do github actions!\) =.*\*\*",
              f"**Commits totais de toda a história do projeto, (feitos por mim e pelos workflows do github actions!) = {total}**",
              texto,
              count=1
          )

          arquivo.write_text(texto, encoding="utf-8")
          PY

      - name: Enviar README atualizado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-readme
          path: README.md
          if-no-files-found: error


  # =========================================================
  # SITEMAP
  # =========================================================

  sitemap:

    name: Gerar Sitemap

    runs-on: ubuntu-24.04

    needs:
      - atualizar-commits
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Gerar Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://mulher-amparada.github.io/mulher-amparada-app/

      - name: Enviar Sitemap gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-sitemap
          path: sitemap.xml
          if-no-files-found: error


  # =========================================================
  # INDEXNOW
  # =========================================================

  indexnow:

    name: IndexNow

    runs-on: ubuntu-24.04

    needs: deploy

    steps:

      - name: Enviar Sitemap ao IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: https://mulher-amparada.github.io/mulher-amparada-app/sitemap.xml
          key: ${{ secrets.INDEXNOW_KEY }}


  # =========================================================
  # LIGHTHOUSE
  # =========================================================

  lighthouse:

    name: Lighthouse

    runs-on: ubuntu-24.04

    needs: deploy

    steps:

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://mulher-amparada.github.io/mulher-amparada-app/
          uploadArtifacts: true


  # =========================================================
  # PUBLICAR KIT DE DIVULGAÇÃO
  # =========================================================

  publicar-divulgacao:

    name: Publicar Kit de Divulgação

    runs-on: ubuntu-24.04

    needs:
      - lighthouse
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Criar pacote de divulgação
        working-directory: divulgacao
        run: npm pack

      - name: Publicar pacote no GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: divulgacao
          name: Kit de Divulgação
          files: divulgacao/*.tgz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # ATUALIZAR FOOTER
  # =========================================================

  atualizar-footer:

    name: Atualizar Footer com README

    runs-on: ubuntu-24.04

    needs:
      - atualizar-commits
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instalar dependência Python
        run: pip install Markdown

      - name: Atualizar footer com README
        run: python3 scripts/atualizar_footer.py

      - name: Enviar footer gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivo-footer
          path: index.html
          if-no-files-found: error


  # =========================================================
  # RELATÓRIO DE COMMITS
  # =========================================================

  atualizar-relatorio-commits:

    name: Atualizar relatório de commits

    runs-on: ubuntu-24.04

    needs:
      - atualizar-commits
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Instalar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Gerar relatório de commits
        run: ruby scripts/commits.rb

      - name: Enviar relatório gerado
        uses: actions/upload-artifact@v6
        with:
          name: arquivos-relatorio-commits
          path: commits/
          if-no-files-found: error


  # =========================================================
  # DOCUMENTAR WORKFLOW
  # =========================================================

  pesquisar-projeto:

    name: Documentar workflow YAML

    runs-on: ubuntu-24.04

    needs: baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Instalar PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Gerar documentação do workflow
        run: |
          set -e

          mkdir -p pesquisas

          php -l scripts/pesquisar_projeto.php
          php scripts/pesquisar_projeto.php

          if [ -f ".github/workflows/workflow.md" ]; then
            mv \
              .github/workflows/workflow.md \
              pesquisas/workflow.md
          fi

          test -s pesquisas/workflow.md

          ls -lh pesquisas/workflow.md

      - name: Enviar documentação do workflow
        uses: actions/upload-artifact@v6
        with:
          name: arquivos-pesquisas
          path: pesquisas/workflow.md
          if-no-files-found: error
          retention-days: 30


  # =========================================================
  # SALVAR TUDO NA MAIN
  # =========================================================

  salvar-na-main:

    name: Salvar todos os arquivos na main

    runs-on: ubuntu-24.04

    needs:
      - atualizar-commits
      - sitemap
      - atualizar-footer
      - atualizar-relatorio-commits
      - pesquisar-projeto
      - baixar-repositorio

    permissions:
      contents: write

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Baixar README atualizado
        uses: actions/download-artifact@v7
        with:
          name: arquivo-readme
          path: artefatos/readme

      - name: Baixar Sitemap
        uses: actions/download-artifact@v7
        with:
          name: arquivo-sitemap
          path: artefatos/sitemap

      - name: Baixar Footer
        uses: actions/download-artifact@v7
        with:
          name: arquivo-footer
          path: artefatos/footer

      - name: Baixar relatório de commits
        uses: actions/download-artifact@v7
        with:
          name: arquivos-relatorio-commits
          path: artefatos/commits

      - name: Baixar pesquisas
        uses: actions/download-artifact@v7
        with:
          name: arquivos-pesquisas
          path: artefatos/pesquisas

      - name: Reunir arquivos gerados
        run: |
          set -e

          cp artefatos/readme/README.md README.md
          cp artefatos/sitemap/sitemap.xml sitemap.xml
          cp artefatos/footer/index.html index.html

          mkdir -p commits pesquisas

          cp -a artefatos/commits/. commits/
          cp -a artefatos/pesquisas/. pesquisas/

          if [ -f "pesquisas/.github/workflows/workflow.md" ]; then
            mv \
              "pesquisas/.github/workflows/workflow.md" \
              "pesquisas/workflow.md"
          fi

          test -s pesquisas/workflow.md

      - name: Salvar todas as alterações em um commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            index.html \
            sitemap.xml \
            commits/ \
            pesquisas/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit \
            -m "Atualizar arquivos gerados [skip ci]"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "Todos os arquivos gerados foram salvos na main."


  # =========================================================
  # SINCRONIZAR DEV.TO
  # =========================================================

  sincronizar-devto:

    name: Sincronizar README com DEV.to

    runs-on: ubuntu-24.04

    needs:
      - salvar-na-main
      - baixar-repositorio

    steps:

      - name: Baixar repositório preparado
        uses: actions/download-artifact@v7
        with:
          name: repositorio-completo
          path: ${{ runner.temp }}/repositorio

      - name: Restaurar repositório
        run: |
          tar -xzf \
            "$RUNNER_TEMP/repositorio/repositorio-completo.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - name: Atualizar artigo no DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python3 - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error

          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as arquivo:
              markdown = arquivo.read()

          dados = json.dumps({
              "article": {
                  "body_markdown": markdown
              }
          }).encode("utf-8")

          requisicao = urllib.request.Request(
              "https://dev.to/api/articles/4771914",
              data=dados,
              method="PUT",
              headers={
                  "Content-Type": "application/json",
                  "api-key": os.environ["DEVTO_API_KEY"],
                  "User-Agent":
                      "Mulher-Amparada-GitHub-Action"
              }
          )

          try:

              with urllib.request.urlopen(
                  requisicao
              ) as resposta:

                  print(
                      resposta.read().decode("utf-8")
                  )

                  print(
                      "DEV.to atualizado com sucesso."
                  )

          except urllib.error.HTTPError as erro:

              print(f"HTTP {erro.code}")

              print(
                  erro.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              raise

          PY